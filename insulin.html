<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>인슐린 기록 - GlucoGuard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f4f8fb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #385566;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding: 20px 18px 45px;
    }


    /* =========================
       상단
    ========================= */

    .top-row {
      display: flex;
      align-items: center;

      gap: 11px;

      margin-bottom: 16px;
    }

    .back-button {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: none;
      border-radius: 14px;

      background: white;
      color: #657d89;

      font-size: 22px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(57,79,94,.06);
    }

    .page-title {
      color: #a85349;

      font-size: 21px;
      font-weight: 900;
    }

    .page-subtitle {
      margin-top: 3px;

      color: #8a9ca5;

      font-size: 10px;
    }


    /* =========================
       안내
    ========================= */

    .guide {
      margin-bottom: 15px;

      padding: 15px 17px;

      border-radius: 19px;

      background: #fff0ec;

      color: #94584f;
    }

    .guide-title {
      margin-bottom: 4px;

      font-size: 13px;
      font-weight: 900;
    }

    .guide-text {
      font-size: 10px;
      line-height: 1.55;
    }


    /* =========================
       공통 카드
    ========================= */

    .card {
      margin-bottom: 14px;

      padding: 20px;

      border-radius: 24px;

      background: white;

      box-shadow:
        0 6px 20px rgba(57,79,94,.055);
    }

    .step {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 9px;

      border-radius: 9px;

      background: #ffe6df;
      color: #af5c50;

      font-size: 11px;
      font-weight: 900;
    }

    .question {
      color: #385566;

      font-size: 17px;
      font-weight: 900;
    }

    .question-help {
      margin-top: 5px;

      color: #8a9ca5;

      font-size: 10px;
      line-height: 1.5;
    }


    /* =========================
       앞면 / 뒷면
    ========================= */

    .view-tabs {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 7px;

      margin-top: 15px;
      margin-bottom: 8px;
    }

    .view-tab {
      padding: 10px;

      border: none;
      border-radius: 13px;

      background: #f3f6f8;
      color: #71858f;

      font-size: 10px;
      font-weight: 900;

      cursor: pointer;
    }

    .view-tab.active {
      background: #ffeae5;
      color: #a85349;
    }


    /* =========================
       인체 그림
    ========================= */

    .body-panel {
      position: relative;

      width: 100%;
      min-height: 430px;

      margin-top: 8px;

      overflow: hidden;

      border: 1px solid #edf0f2;
      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          #fbfdfe,
          #f7fafc
        );
    }

    .body-label {
      padding-top: 14px;

      text-align: center;

      color: #8b9ca5;

      font-size: 9px;
    }

    .body-model {
      position: relative;

      width: 260px;
      height: 365px;

      margin: 7px auto 0;
    }

    .body-head {
      position: absolute;

      top: 4px;
      left: 102px;

      width: 56px;
      height: 56px;

      border-radius: 50%;

      background: #e0e7eb;
    }

    .hair {
      position: absolute;

      top: 2px;
      left: 104px;

      width: 52px;
      height: 25px;

      border-radius: 25px 25px 10px 10px;

      background: #a6bac5;
    }

    .body-neck {
      position: absolute;

      top: 54px;
      left: 119px;

      width: 22px;
      height: 18px;

      background: #e0e7eb;
    }

    .body-torso {
      position: absolute;

      top: 69px;
      left: 81px;

      width: 98px;
      height: 143px;

      border-radius: 38px 38px 31px 31px;

      background: #e0e7eb;
    }

    .body-arm {
      position: absolute;

      top: 80px;

      width: 34px;
      height: 142px;

      border-radius: 22px;

      background: #e0e7eb;
    }

    .body-arm.left {
      left: 42px;

      transform:
        rotate(5deg);
    }

    .body-arm.right {
      right: 42px;

      transform:
        rotate(-5deg);
    }

    .body-leg {
      position: absolute;

      top: 200px;

      width: 42px;
      height: 155px;

      border-radius: 23px;

      background: #e0e7eb;
    }

    .body-leg.left {
      left: 83px;

      transform:
        rotate(2deg);
    }

    .body-leg.right {
      right: 83px;

      transform:
        rotate(-2deg);
    }


    /* =========================
       선택 가능한 부위
    ========================= */

    .site-target {
      position: absolute;

      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;

      padding: 0;

      border: 3px solid white;
      border-radius: 50%;

      background:
        rgba(232,148,136,.43);

      color: transparent;

      cursor: pointer;

      box-shadow:
        0 3px 11px rgba(65,79,89,.15);

      transition:
        transform .15s,
        background .15s;
    }

    .site-target:hover {
      transform:
        scale(1.07);
    }

    .site-target.selected {
      background: #d96f62;
      color: white;

      transform:
        scale(1.12);

      font-size: 20px;
      font-weight: 900;
    }


    /* 앞면 */

    .front-arm-left {
      top: 99px;
      left: 34px;
    }

    .front-arm-right {
      top: 99px;
      right: 34px;
    }

    .front-abdomen-left {
      top: 128px;
      left: 80px;
    }

    .front-abdomen-right {
      top: 128px;
      right: 80px;
    }

    .front-thigh-left {
      top: 237px;
      left: 77px;
    }

    .front-thigh-right {
      top: 237px;
      right: 77px;
    }


    /* 뒷면 */

    .back-arm-left {
      top: 99px;
      left: 34px;
    }

    .back-arm-right {
      top: 99px;
      right: 34px;
    }

    .back-hip-left {
      top: 176px;
      left: 80px;
    }

    .back-hip-right {
      top: 176px;
      right: 80px;
    }

    .back-thigh-left {
      top: 237px;
      left: 77px;
    }

    .back-thigh-right {
      top: 237px;
      right: 77px;
    }


    /* =========================
       앞뒤 화면
    ========================= */

    .body-view {
      display: none;
    }

    .body-view.active {
      display: block;
    }


    /* =========================
       선택 결과
    ========================= */

    .site-result {
      margin-top: 12px;

      padding: 13px;

      border-radius: 14px;

      background: #fff0ec;
      color: #a85349;

      text-align: center;

      font-size: 12px;
      font-weight: 900;
    }


    /* =========================
       Unit
    ========================= */

    .unit-row {
      position: relative;

      margin-top: 17px;
    }

    .unit-input {
      width: 100%;
      height: 72px;

      padding:
        0
        80px
        0
        18px;

      border: 3px solid #dfe7eb;
      border-radius: 19px;

      background: #fafcfd;
      color: #385566;

      outline: none;

      font-size: 31px;
      font-weight: 900;
    }

    .unit-input:focus {
      border-color: #e1a096;

      background: white;
    }

    .unit-label {
      position: absolute;

      right: 20px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #778b95;

      font-size: 12px;
      font-weight: 900;
    }

    .quick-units {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 6px;

      margin-top: 10px;
    }

    .quick-button {
      padding: 10px 3px;

      border: none;
      border-radius: 12px;

      background: #f3f6f8;
      color: #617984;

      font-size: 11px;
      font-weight: 900;

      cursor: pointer;
    }

    .quick-button.selected {
      background: #ffeae5;
      color: #a85349;
    }


    /* =========================
       선택 입력
    ========================= */

    .optional-toggle {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 14px;

      padding: 12px 14px;

      border: none;
      border-radius: 14px;

      background: #f4f7f8;
      color: #647c87;

      font-size: 10px;
      font-weight: 900;

      cursor: pointer;
    }

    .optional-area {
      display: none;

      margin-top: 10px;
    }

    .optional-area.show {
      display: block;
    }

    .text-input {
      width: 100%;
      height: 52px;

      padding: 0 14px;

      border: 2px solid #e0e7eb;
      border-radius: 15px;

      background: #fafcfd;
      color: #405f6e;

      outline: none;

      font-size: 12px;
    }

    .unknown-button {
      width: 100%;

      margin-top: 8px;

      padding: 11px;

      border: none;
      border-radius: 13px;

      background: #f4f6f7;
      color: #758892;

      font-size: 10px;
      font-weight: 900;

      cursor: pointer;
    }

    .unknown-button.selected {
      background: #fff0ec;
      color: #a85349;
    }


    /* =========================
       시간
    ========================= */

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 14px;

      padding: 12px 14px;

      border-radius: 15px;

      background: #f5f8fa;
    }

    .time-text {
      color: #607985;

      font-size: 11px;
      font-weight: 800;
    }

    .change-time-button {
      border: none;

      padding: 8px 10px;

      border-radius: 10px;

      background: white;
      color: #69818d;

      font-size: 9px;
      font-weight: 900;

      cursor: pointer;
    }

    .datetime-input {
      display: none;

      width: 100%;

      margin-top: 9px;

      padding: 12px;

      border: 2px solid #e0e7eb;
      border-radius: 14px;

      background: white;
      color: #526c79;
    }

    .datetime-input.show {
      display: block;
    }


    /* =========================
       저장
    ========================= */

    .save-button {
      width: 100%;

      margin-top: 5px;

      padding: 17px;

      border: none;
      border-radius: 18px;

      background: #d96f62;
      color: white;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 6px 17px rgba(186,89,77,.18);
    }

    .save-button:disabled {
      opacity: .55;
    }


    /* =========================
       안전
    ========================= */

    .safety {
      margin-top: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      background: #fff6df;
      color: #876e39;

      font-size: 9px;
      line-height: 1.55;
    }


    /* =========================
       완료
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(38,53,63,.45);
    }

    .overlay.show {
      display: flex;
    }

    .complete-card {
      width: 100%;
      max-width: 380px;

      padding: 25px;

      border-radius: 25px;

      background: white;

      text-align: center;
    }

    .complete-icon {
      font-size: 43px;
    }

    .complete-title {
      margin-top: 10px;

      color: #3e6d5d;

      font-size: 19px;
      font-weight: 900;
    }

    .complete-text {
      margin-top: 7px;

      color: #81949d;

      font-size: 11px;
      line-height: 1.6;
    }

    .complete-button {
      width: 100%;

      margin-top: 18px;

      padding: 13px;

      border: none;
      border-radius: 14px;

      background: #4e9d82;
      color: white;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
    }

  </style>

</head>


<body>

<div class="page">


  <!-- 상단 -->

  <div class="top-row">

    <button
      class="back-button"
      onclick="goBack()">

      ‹

    </button>

    <div>

      <div class="page-title">
        💉 인슐린 기록
      </div>

      <div class="page-subtitle">
        맞은 곳을 누르고 기록해요.
      </div>

    </div>

  </div>



  <div class="guide">

    <div class="guide-title">
      🙂 맞은 곳을 몸 그림에서 눌러주세요
    </div>

    <div class="guide-text">
      잘 모르겠으면 선생님과 같이 확인해요.
    </div>

  </div>



  <!-- 위치 -->

  <div class="card">

    <div class="step">
      1
    </div>

    <div class="question">
      📍 어디에 맞았나요?
    </div>

    <div class="question-help">
      몸 그림에서 주사 맞은 곳을 직접 눌러주세요.
    </div>


    <div class="view-tabs">

      <button
        id="frontTab"
        class="view-tab active"
        onclick="changeBodyView('front')">

        앞에서 보기

      </button>

      <button
        id="backTab"
        class="view-tab"
        onclick="changeBodyView('back')">

        뒤에서 보기

      </button>

    </div>



    <div class="body-panel">

      <!-- 앞면 -->

      <div
        id="frontView"
        class="body-view active">

        <div class="body-label">
          앞에서 본 모습
        </div>

        <div class="body-model">

          <div class="body-head"></div>
          <div class="hair"></div>
          <div class="body-neck"></div>
          <div class="body-torso"></div>

          <div class="body-arm left"></div>
          <div class="body-arm right"></div>

          <div class="body-leg left"></div>
          <div class="body-leg right"></div>


          <button
            type="button"
            class="site-target front-arm-left"
            data-site="왼쪽 팔"
            onclick="selectSite('왼쪽 팔', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target front-arm-right"
            data-site="오른쪽 팔"
            onclick="selectSite('오른쪽 팔', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target front-abdomen-left"
            data-site="배 왼쪽"
            onclick="selectSite('배 왼쪽', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target front-abdomen-right"
            data-site="배 오른쪽"
            onclick="selectSite('배 오른쪽', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target front-thigh-left"
            data-site="왼쪽 허벅지"
            onclick="selectSite('왼쪽 허벅지', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target front-thigh-right"
            data-site="오른쪽 허벅지"
            onclick="selectSite('오른쪽 허벅지', this)">

            ✓

          </button>

        </div>

      </div>



      <!-- 뒷면 -->

      <div
        id="backView"
        class="body-view">

        <div class="body-label">
          뒤에서 본 모습
        </div>

        <div class="body-model">

          <div class="body-head"></div>
          <div class="hair"></div>
          <div class="body-neck"></div>
          <div class="body-torso"></div>

          <div class="body-arm left"></div>
          <div class="body-arm right"></div>

          <div class="body-leg left"></div>
          <div class="body-leg right"></div>


          <button
            type="button"
            class="site-target back-arm-left"
            data-site="왼쪽 팔"
            onclick="selectSite('왼쪽 팔', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target back-arm-right"
            data-site="오른쪽 팔"
            onclick="selectSite('오른쪽 팔', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target back-hip-left"
            data-site="왼쪽 엉덩이"
            onclick="selectSite('왼쪽 엉덩이', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target back-hip-right"
            data-site="오른쪽 엉덩이"
            onclick="selectSite('오른쪽 엉덩이', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target back-thigh-left"
            data-site="왼쪽 허벅지"
            onclick="selectSite('왼쪽 허벅지', this)">

            ✓

          </button>


          <button
            type="button"
            class="site-target back-thigh-right"
            data-site="오른쪽 허벅지"
            onclick="selectSite('오른쪽 허벅지', this)">

            ✓

          </button>

        </div>

      </div>

    </div>



    <div
      id="siteResult"
      class="site-result">

      아직 맞은 곳을 선택하지 않았어요.

    </div>

  </div>



  <!-- Unit -->

  <div class="card">

    <div class="step">
      2
    </div>

    <div class="question">
      🔢 몇 Unit 맞았나요?
    </div>

    <div class="question-help">
      실제로 맞은 양을 적어주세요.
    </div>


    <div class="unit-row">

      <input
        id="insulinUnits"
        class="unit-input"
        type="number"
        min="0.1"
        max="200"
        step="0.5"
        inputmode="decimal"
        placeholder="0">

      <div class="unit-label">
        Unit
      </div>

    </div>


    <div class="quick-units">

      <button
        class="quick-button"
        onclick="setUnits(1, this)">
        1
      </button>

      <button
        class="quick-button"
        onclick="setUnits(2, this)">
        2
      </button>

      <button
        class="quick-button"
        onclick="setUnits(3, this)">
        3
      </button>

      <button
        class="quick-button"
        onclick="setUnits(4, this)">
        4
      </button>

      <button
        class="quick-button"
        onclick="setUnits(5, this)">
        5
      </button>

    </div>



    <!-- 이름 선택 -->

    <button
      class="optional-toggle"
      onclick="toggleOptional()">

      <span>
        💉 인슐린 이름도 기록할래요
      </span>

      <span>
        선택
      </span>

    </button>


    <div
      id="optionalArea"
      class="optional-area">

      <input
        id="insulinName"
        class="text-input"
        type="text"
        maxlength="50"
        placeholder="인슐린 이름">

      <button
        id="unknownButton"
        class="unknown-button"
        onclick="setUnknownInsulin()">

        🤷 이름을 모르겠어요

      </button>

    </div>



    <!-- 시간 -->

    <div class="time-row">

      <div
        id="timeText"
        class="time-text">

        지금 시간으로 기록해요

      </div>

      <button
        class="change-time-button"
        onclick="toggleTimeInput()">

        시간 바꾸기

      </button>

    </div>


    <input
      id="administeredAt"
      class="datetime-input"
      type="datetime-local">

  </div>



  <!-- 저장 -->

  <button
    id="saveButton"
    class="save-button"
    onclick="saveInsulinRecord()">

    💉 기록하기

  </button>



  <div class="safety">

    GlucoGuard는 인슐린 투여량을 계산하거나 추천하지 않아요.
    실제로 투여한 내용만 기록하며 개인별 처방과 관리계획을 따라주세요.

  </div>


</div>



<!-- 완료 -->

<div
  id="completeOverlay"
  class="overlay">

  <div class="complete-card">

    <div class="complete-icon">
      ✅
    </div>

    <div class="complete-title">
      잘 기록했어요!
    </div>

    <div
      id="completeText"
      class="complete-text">
    </div>

    <button
      class="complete-button"
      onclick="finishRecord()">

      확인

    </button>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  );

  null;


let recordUserId =
  null;


let isTeacherRecording =
  false;


let selectedSite =
  "";


let unknownInsulin =
  false;



/* =========================
   시작
========================= */

window.addEventListener(
  "load",
  async function() {

    setCurrentTime();

    await checkLogin();

  }
);



/* =========================
   시간
========================= */

function setCurrentTime() {

  const now =
    new Date();


  const local =
    new Date(
      now.getTime()
      -
      now.getTimezoneOffset()
      * 60000
    );


  const value =
    local
      .toISOString()
      .slice(0,16);


  document.getElementById(
    "administeredAt"
  ).value =
    value;


  updateTimeText();

}


function updateTimeText() {

  const value =
    document.getElementById(
      "administeredAt"
    ).value;


  if (
    !value
  ) {

    document.getElementById(
      "timeText"
    ).textContent =
      "시간을 선택해주세요";

    return;

  }


  const date =
    new Date(
      value
    );


  document.getElementById(
    "timeText"
  ).textContent =
    date.toLocaleString(
      "ko-KR",
      {
        month: "numeric",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    );

}


document.addEventListener(
  "change",
  function(
    event
  ) {

    if (
      event.target.id
      ===
      "administeredAt"
    ) {

      updateTimeText();

    }

  }
);



/* =========================
   로그인
========================= */

async function checkLogin() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (
    !data.session
  ) {

    window.location.href =
      "./login.html";

    return;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,role,nickname"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    error
    ||
    !profile
  ) {

    alert(
      "사용자 정보를 불러오지 못했습니다."
    );


    window.location.href =
      "./login.html";


    return;

  }


  currentProfile =
    profile;



  /* 학생 */

  if (
    profile.role === "student"
  ) {

    recordUserId =
      currentUser.id;


    return;

  }



  /* 데모 */

  if (
    profile.role === "demo"
  ) {

    const mode =
      sessionStorage.getItem(
        "demoMode"
      );


    if (
      mode !== "student"
    ) {

      sessionStorage.setItem(
        "demoMode",
        "student"
      );

    }


    recordUserId =
      currentUser.id;


    return;

  }



  /* 교직원 입력 */

  if (
    profile.role === "teacher"
    ||
    profile.role === "nurse"
  ) {

    const selectedStudent =
      sessionStorage.getItem(
        "teacherSelectedStudent"
      );


    if (
      !selectedStudent
    ) {

      alert(
        "기록할 학생을 먼저 선택해주세요."
      );


      window.location.href =
        "./teacher.html";


      return;

    }


    recordUserId =
      selectedStudent;


    isTeacherRecording =
      true;


    return;

  }


  window.location.href =
    "./login.html";

}



/* =========================
   앞면 / 뒷면
========================= */

function changeBodyView(
  view
) {

  const front =
    view === "front";


  document.getElementById(
    "frontView"
  ).classList.toggle(
    "active",
    front
  );


  document.getElementById(
    "backView"
  ).classList.toggle(
    "active",
    !front
  );


  document.getElementById(
    "frontTab"
  ).classList.toggle(
    "active",
    front
  );


  document.getElementById(
    "backTab"
  ).classList.toggle(
    "active",
    !front
  );

}



/* =========================
   위치 선택
========================= */

function selectSite(
  site,
  button
) {

  selectedSite =
    site;


  document
    .querySelectorAll(
      ".site-target"
    )
    .forEach(
      item =>
        item.classList.remove(
          "selected"
        )
    );


  /*
    같은 위치가 앞/뒤에 둘 다 있는 경우
    해당 부위를 같이 선택 표시
  */

  document
    .querySelectorAll(
      `.site-target[data-site="${site}"]`
    )
    .forEach(
      item =>
        item.classList.add(
          "selected"
        )
    );


  document.getElementById(
    "siteResult"
  ).textContent =
    `✅ ${site}에 맞았어요`;

}



/* =========================
   Unit
========================= */

function setUnits(
  value,
  button
) {

  document.getElementById(
    "insulinUnits"
  ).value =
    value;


  document
    .querySelectorAll(
      ".quick-button"
    )
    .forEach(
      item =>
        item.classList.remove(
          "selected"
        )
    );


  button.classList.add(
    "selected"
  );

}



/* =========================
   선택 입력
========================= */

function toggleOptional() {

  document.getElementById(
    "optionalArea"
  ).classList.toggle(
    "show"
  );

}


function setUnknownInsulin() {

  unknownInsulin =
    !unknownInsulin;


  const input =
    document.getElementById(
      "insulinName"
    );


  const button =
    document.getElementById(
      "unknownButton"
    );


  if (
    unknownInsulin
  ) {

    input.value =
      "";


    input.disabled =
      true;


    button.classList.add(
      "selected"
    );


    button.textContent =
      "✅ 이름을 모르겠어요";

  }
  else {

    input.disabled =
      false;


    button.classList.remove(
      "selected"
    );


    button.textContent =
      "🤷 이름을 모르겠어요";

  }

}



/* =========================
   시간 펼치기
========================= */

function toggleTimeInput() {

  document.getElementById(
    "administeredAt"
  ).classList.toggle(
    "show"
  );

}



/* =========================
   저장
========================= */

async function saveInsulinRecord() {

  const unitsValue =
    document.getElementById(
      "insulinUnits"
    ).value;


  const insulinName =
    document.getElementById(
      "insulinName"
    ).value.trim();


  const administeredAt =
    document.getElementById(
      "administeredAt"
    ).value;



  if (
    !selectedSite
  ) {

    alert(
      "몸 그림에서 맞은 곳을 눌러주세요."
    );

    return;

  }


  if (
    unitsValue === ""
  ) {

    alert(
      "몇 Unit 맞았는지 입력해주세요."
    );

    return;

  }


  const insulinUnits =
    Number(
      unitsValue
    );


  if (
    !Number.isFinite(
      insulinUnits
    )
    ||
    insulinUnits <= 0
  ) {

    alert(
      "맞은 Unit을 다시 확인해주세요."
    );

    return;

  }


  if (
    !administeredAt
  ) {

    alert(
      "맞은 시간을 확인해주세요."
    );

    return;

  }


  const nameText =
    unknownInsulin
    ?
    "이름 모름"
    :
    (
      insulinName
      ||
      "이름 미입력"
    );


  const confirmed =
    confirm(
      `${selectedSite}\n${insulinUnits} Unit\n${nameText}\n\n이대로 기록할까요?`
    );


  if (
    !confirmed
  ) {

    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "기록하는 중...";


  const {
    error
  } =
    await supabaseClient
      .from("records")
      .insert({

        user_id:
          recordUserId,

        record_type:
          "insulin",

        insulin_type:
          "기록",

        insulin_name:
          unknownInsulin
          ?
          null
          :
          (
            insulinName
            ||
            null
          ),

        insulin_units:
          insulinUnits,

        injection_site:
          selectedSite,

        administered_at:
          new Date(
            administeredAt
          ).toISOString(),

        note:
          unknownInsulin
          ?
          "학생이 인슐린 이름을 모름"
          :
          null

      });


  saveButton.disabled =
    false;


  saveButton.textContent =
    "💉 기록하기";


  if (
    error
  ) {

    console.error(
      error
    );


    alert(
      "인슐린 기록을 저장하지 못했습니다."
    );


    return;

  }


  document.getElementById(
    "completeText"
  ).textContent =
    `${selectedSite} · ${insulinUnits} Unit으로 저장했어요.`;


  document.getElementById(
    "completeOverlay"
  ).classList.add(
    "show"
  );

}



/* =========================
   완료
========================= */

function finishRecord() {

  goBack();

}



/* =========================
   뒤로
========================= */

function goBack() {

  if (
    isTeacherRecording
  ) {

    window.location.href =
      "./teacher.html";

    return;

  }


  window.location.href =
    "./index.html";

}

</script>
