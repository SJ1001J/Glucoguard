<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>도움 요청 - GlucoGuard</title>

  <link
    rel="stylesheet"
    href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5faff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #263238;
    }


    .page-wrap {
      width: 100%;
      max-width: 460px;

      margin: 0 auto;

      padding:
        20px 18px 38px;
    }


    /* =========================
       상단
    ========================= */

    .top-bar {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 19px;
    }


    .back-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 14px;

      background: white;

      color: #526b7b;

      font-size: 27px;

      cursor: pointer;

      box-shadow:
        0 4px 13px rgba(60,90,110,.07);
    }


    .title-area h1 {
      margin: 0;

      color: #344e5e;

      font-size: 22px;
      font-weight: 900;
    }


    .title-area p {
      margin:
        4px 0 0;

      color: #8295a1;

      font-size: 12px;
    }



    /* =========================
       큰 안내
    ========================= */

    .help-hero {
      background:
        #fff0ee;

      border:
        2px solid #ffd2cd;

      border-radius: 24px;

      padding: 20px;

      margin-bottom: 17px;

      text-align: center;
    }


    .help-icon {
      width: 65px;
      height: 65px;

      margin:
        0 auto 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 21px;

      background: white;

      font-size: 34px;
    }


    .help-hero h2 {
      margin:
        0 0 7px;

      color: #c54c44;

      font-size: 20px;
      font-weight: 900;
    }


    .help-hero p {
      margin: 0;

      color: #826d6b;

      font-size: 13px;
      line-height: 1.65;
    }



    /* =========================
       연락할 사람
    ========================= */

    .section-title {
      margin:
        0 0 10px;

      color: #455a64;

      font-size: 15px;
      font-weight: 900;
    }


    .contacts-area {
      margin-bottom: 19px;
    }


    .contact-card {
      background: white;

      border-radius: 19px;

      padding: 14px;

      margin-bottom: 10px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }


    .contact-top {
      display: flex;
      align-items: center;

      gap: 12px;
    }


    .contact-icon {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #eef6ff;

      font-size: 25px;
    }


    .contact-info {
      flex: 1;
      min-width: 0;
    }


    .contact-name {
      margin-bottom: 3px;

      color: #344e5e;

      font-size: 15px;
      font-weight: 900;
    }


    .contact-meta {
      color: #81939e;

      font-size: 11px;
    }


    .call-button {
      width: 100%;

      margin-top: 11px;

      padding: 13px;

      border: none;
      border-radius: 13px;

      background: #e7f3ff;

      color: #28658e;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }


    .empty-card {
      padding: 21px 15px;

      background: white;

      border-radius: 18px;

      text-align: center;

      color: #8498a4;

      font-size: 12px;
      line-height: 1.65;
    }



    /* =========================
       119
    ========================= */

    .emergency-119 {
      background: #fff;

      border:
        2px solid #ffbeb8;

      border-radius: 21px;

      padding: 16px;

      margin-bottom: 21px;
    }


    .emergency-119-title {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 7px;

      color: #c3443d;

      font-size: 16px;
      font-weight: 900;
    }


    .emergency-119 p {
      margin:
        0 0 12px;

      color: #7e6d6b;

      font-size: 11px;
      line-height: 1.6;
    }


    .call-119-button {
      width: 100%;

      border: none;
      border-radius: 14px;

      padding: 14px;

      background: #e9564e;

      color: white;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;
    }



    /* =========================
       연락처 관리
    ========================= */

    .manage-box {
      background: white;

      border-radius: 21px;

      padding: 16px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }


    .manage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      cursor: pointer;
    }


    .manage-title {
      color: #526b79;

      font-size: 14px;
      font-weight: 900;
    }


    .manage-arrow {
      color: #94a7b2;

      font-size: 18px;
    }


    #manageContent {
      display: none;

      margin-top: 16px;
    }


    .input-label {
      display: block;

      margin:
        0 0 5px 2px;

      color: #607d8b;

      font-size: 11px;
      font-weight: 800;
    }


    .form-input,
    .form-select {
      width: 100%;

      padding: 12px;

      margin-bottom: 11px;

      border:
        1px solid #d8e2e8;

      border-radius: 13px;

      background: white;

      font-size: 14px;

      outline: none;
    }


    .form-input:focus,
    .form-select:focus {
      border-color:
        #72a9ce;
    }


    .save-button {
      width: 100%;

      border: none;
      border-radius: 13px;

      padding: 13px;

      background: #4285b4;

      color: white;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }


    .manage-contact-list {
      margin-top: 17px;
    }


    .manage-contact-card {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 9px;

      padding:
        11px 0;

      border-bottom:
        1px solid #eef2f4;
    }


    .manage-contact-card:last-child {
      border-bottom: none;
    }


    .manage-name {
      color: #526b79;

      font-size: 12px;
      font-weight: 800;
    }


    .manage-phone {
      margin-top: 2px;

      color: #8a9ba5;

      font-size: 10px;
    }


    .delete-button {
      border: none;
      border-radius: 9px;

      padding:
        7px 9px;

      background: #fff0ee;

      color: #b15a53;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;
    }



    /* =========================
       하단
    ========================= */

    .bottom-message {
      margin-top: 18px;

      text-align: center;

      color: #8da0ab;

      font-size: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="page-wrap">


  <!-- 상단 -->

  <div class="top-bar">

    <button
      class="back-button"
      onclick="location.href='index.html'">

      ‹

    </button>


    <div class="title-area">

      <h1>
        도움이 필요해요
      </h1>

      <p>
        혼자 있지 말고 어른에게 바로 알려요.
      </p>

    </div>

  </div>



  <!-- 도움 안내 -->

  <div class="help-hero">

    <div class="help-icon">
      🚨
    </div>

    <h2>
      선생님, 도와주세요!
    </h2>

    <p>
      몸이 이상하거나 도움이 필요하면<br>
      가까운 선생님이나 어른에게 먼저 알려주세요.
    </p>

  </div>



  <!-- 연락할 사람 -->

  <div class="section-title">
    📞 누구에게 연락할까요?
  </div>


  <div
    id="contactList"
    class="contacts-area">

    <div class="empty-card">
      연락처를 불러오는 중이에요.
    </div>

  </div>



  <!-- 119 -->

  <div class="emergency-119">

    <div class="emergency-119-title">
      🚑 아주 위급한 상황이에요
    </div>

    <p>
      반응이 없거나 의식이 흐린 등 심각한 응급상황에서는
      주변 어른에게 즉시 알리고 학교의 응급대응 절차를 따라주세요.
    </p>

    <button
      class="call-119-button"
      onclick="confirmCall119()">

      119에 전화하기

    </button>

  </div>



  <!-- 연락처 관리 -->

  <div class="manage-box">

    <div
      class="manage-header"
      onclick="toggleManage()">

      <div class="manage-title">
        ⚙️ 비상연락처 등록·관리
      </div>

      <div
        id="manageArrow"
        class="manage-arrow">

        ▾

      </div>

    </div>


    <div id="manageContent">


      <label class="input-label">
        누구인가요?
      </label>

      <select
        id="relationship"
        class="form-select">

        <option value="엄마">
          엄마
        </option>

        <option value="아빠">
          아빠
        </option>

        <option value="보호자">
          보호자
        </option>

        <option value="보건실">
          보건실
        </option>

        <option value="담임 선생님">
          담임 선생님
        </option>

        <option value="기타">
          기타
        </option>

      </select>



      <label class="input-label">
        이름
      </label>

      <input
        id="contactName"
        class="form-input"
        type="text"
        maxlength="30"
        placeholder="예: 김OO">



      <label class="input-label">
        전화번호
      </label>

      <input
        id="phoneNumber"
        class="form-input"
        type="tel"
        inputmode="tel"
        maxlength="20"
        placeholder="예: 010-1234-5678">



      <button
        id="saveButton"
        class="save-button"
        onclick="saveContact()">

        연락처 저장

      </button>



      <div
        id="manageContactList"
        class="manage-contact-list">
      </div>


    </div>

  </div>



  <div class="bottom-message">

    전화 버튼을 누르면 휴대폰의 전화 기능이 열립니다.<br>
    실제 대응은 학교의 응급계획과 학생의 개별 관리계획을 따라주세요.

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let currentContacts =
  [];



window.addEventListener(
  "load",
  async function() {

    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    await loadContacts();

  }
);



/* =========================
   로그인 확인
========================= */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );

  }


  if (
    profile &&
    (
      profile.role === "teacher"
      ||
      profile.role === "nurse"
    )
  ) {

    location.href =
      "teacher.html";


    return false;

  }


  return true;

}



/* =========================
   연락처 불러오기
========================= */

async function loadContacts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .select(
        "id, contact_name, relationship, phone_number, created_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    document.getElementById(
      "contactList"
    ).innerHTML =
      `
        <div class="empty-card">
          연락처를 불러오지 못했어요.
        </div>
      `;


    return;

  }


  currentContacts =
    data || [];


  renderContacts();

}



/* =========================
   연락처 표시
========================= */

function renderContacts() {

  const contactList =
    document.getElementById(
      "contactList"
    );


  const manageList =
    document.getElementById(
      "manageContactList"
    );


  contactList.innerHTML =
    "";


  manageList.innerHTML =
    "";


  if (
    currentContacts.length === 0
  ) {

    contactList.innerHTML =
      `
        <div class="empty-card">

          아직 등록된 연락처가 없어요.<br>

          아래의
          <strong>
            비상연락처 등록·관리
          </strong>
          에서<br>

          보호자나 보건실 연락처를 등록해주세요.

        </div>
      `;


    return;

  }


  currentContacts.forEach(
    function(contact) {

      /* 메인 전화 카드 */

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "contact-card";


      let icon =
        "📞";


      if (
        contact.relationship === "엄마"
        ||
        contact.relationship === "아빠"
        ||
        contact.relationship === "보호자"
      ) {

        icon =
          "👨‍👩‍👧";

      }


      if (
        contact.relationship === "보건실"
      ) {

        icon =
          "🏥";

      }


      if (
        contact.relationship === "담임 선생님"
      ) {

        icon =
          "👩‍🏫";

      }


      const top =
        document.createElement(
          "div"
        );


      top.className =
        "contact-top";


      const iconBox =
        document.createElement(
          "div"
        );


      iconBox.className =
        "contact-icon";


      iconBox.textContent =
        icon;


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "contact-info";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "contact-name";


      name.textContent =
        contact.relationship
        +
        " · "
        +
        contact.contact_name;


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "contact-meta";


      meta.textContent =
        contact.phone_number;


      info.appendChild(
        name
      );


      info.appendChild(
        meta
      );


      top.appendChild(
        iconBox
      );


      top.appendChild(
        info
      );


      const callButton =
        document.createElement(
          "button"
        );


      callButton.className =
        "call-button";


      callButton.textContent =
        "📞 "
        +
        contact.relationship
        +
        "에게 전화하기";


      callButton.onclick =
        function() {

          confirmCall(
            contact
          );

        };


      card.appendChild(
        top
      );


      card.appendChild(
        callButton
      );


      contactList.appendChild(
        card
      );



      /* 관리용 카드 */

      const manageCard =
        document.createElement(
          "div"
        );


      manageCard.className =
        "manage-contact-card";


      const manageInfo =
        document.createElement(
          "div"
        );


      const manageName =
        document.createElement(
          "div"
        );


      manageName.className =
        "manage-name";


      manageName.textContent =
        contact.relationship
        +
        " · "
        +
        contact.contact_name;


      const managePhone =
        document.createElement(
          "div"
        );


      managePhone.className =
        "manage-phone";


      managePhone.textContent =
        contact.phone_number;


      manageInfo.appendChild(
        manageName
      );


      manageInfo.appendChild(
        managePhone
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          deleteContact(
            contact.id,
            contact.contact_name
          );

        };


      manageCard.appendChild(
        manageInfo
      );


      manageCard.appendChild(
        deleteButton
      );


      manageList.appendChild(
        manageCard
      );

    }
  );

}



/* =========================
   연락처 저장
========================= */

async function saveContact() {

  const relationship =
    document.getElementById(
      "relationship"
    ).value;


  const contactName =
    document.getElementById(
      "contactName"
    ).value.trim();


  const phoneNumber =
    document.getElementById(
      "phoneNumber"
    ).value.trim();


  if (!contactName) {

    alert(
      "이름을 입력해주세요."
    );


    return;

  }


  if (!phoneNumber) {

    alert(
      "전화번호를 입력해주세요."
    );


    return;

  }


  const cleanedPhone =
    phoneNumber.replace(
      /[^0-9+]/g,
      ""
    );


  if (
    cleanedPhone.length < 8
  ) {

    alert(
      "전화번호를 다시 확인해주세요."
    );


    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "저장 중...";


  const {
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .insert({

        user_id:
          currentUser.id,

        contact_name:
          contactName,

        relationship:
          relationship,

        phone_number:
          phoneNumber

      });


  saveButton.disabled =
    false;


  saveButton.textContent =
    "연락처 저장";


  if (error) {

    console.error(
      error
    );


    alert(
      "연락처를 저장하지 못했어요."
    );


    return;

  }


  document.getElementById(
    "contactName"
  ).value =
    "";


  document.getElementById(
    "phoneNumber"
  ).value =
    "";


  await loadContacts();

}



/* =========================
   전화
========================= */

function confirmCall(
  contact
) {

  const confirmed =
    confirm(
      contact.relationship
      +
      " "
      +
      contact.contact_name
      +
      "에게 전화할까요?\n\n"
      +
      contact.phone_number
    );


  if (!confirmed) {
    return;
  }


  const cleanedPhone =
    contact.phone_number.replace(
      /[^0-9+]/g,
      ""
    );


  location.href =
    "tel:"
    +
    cleanedPhone;

}



/* =========================
   119
========================= */

function confirmCall119() {

  const confirmed =
    confirm(
      "119에 전화할까요?\n\n"
      +
      "실수로 누른 경우에는 취소를 눌러주세요."
    );


  if (!confirmed) {
    return;
  }


  location.href =
    "tel:119";

}



/* =========================
   삭제
========================= */

async function deleteContact(
  id,
  name
) {

  const confirmed =
    confirm(
      name
      +
      " 연락처를 삭제할까요?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    console.error(
      error
    );


    alert(
      "연락처를 삭제하지 못했어요."
    );


    return;

  }


  await loadContacts();

}



/* =========================
   관리 영역 열기/닫기
========================= */

function toggleManage() {

  const content =
    document.getElementById(
      "manageContent"
    );


  const arrow =
    document.getElementById(
      "manageArrow"
    );


  const isOpen =
    content.style.display ===
    "block";


  if (isOpen) {

    content.style.display =
      "none";


    arrow.textContent =
      "▾";

  } else {

    content.style.display =
      "block";


    arrow.textContent =
      "▴";

  }

}

</script>

</body>

</html>
