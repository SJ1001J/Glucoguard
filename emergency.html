<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>도움 요청 - GlucoGuard</title>

  <link
    rel="stylesheet"
    href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5faff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #263238;
    }

    .page-wrap {
      width: 100%;
      max-width: 460px;

      margin: 0 auto;

      padding: 20px 18px 38px;
    }

    .top-bar {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 19px;
    }

    .back-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 14px;

      background: white;

      color: #526b7b;

      font-size: 27px;

      cursor: pointer;

      box-shadow:
        0 4px 13px rgba(60,90,110,.07);
    }

    .title-area h1 {
      margin: 0;

      color: #344e5e;

      font-size: 22px;
      font-weight: 900;
    }

    .title-area p {
      margin: 4px 0 0;

      color: #8295a1;

      font-size: 12px;
    }

    .help-hero {
      background: #fff0ee;

      border: 2px solid #ffd2cd;

      border-radius: 24px;

      padding: 20px;

      margin-bottom: 17px;

      text-align: center;
    }

    .help-icon {
      width: 65px;
      height: 65px;

      margin: 0 auto 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 21px;

      background: white;

      font-size: 34px;
    }

    .help-hero h2 {
      margin: 0 0 7px;

      color: #c54c44;

      font-size: 20px;
      font-weight: 900;
    }

    .help-hero p {
      margin: 0;

      color: #826d6b;

      font-size: 13px;
      line-height: 1.65;
    }

    .section-title {
      margin: 0 0 10px;

      color: #455a64;

      font-size: 15px;
      font-weight: 900;
    }

    .contacts-area {
      margin-bottom: 19px;
    }

    .contact-card {
      background: white;

      border-radius: 19px;

      padding: 14px;

      margin-bottom: 10px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }

    .contact-top {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .contact-icon {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #eef6ff;

      font-size: 25px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      margin-bottom: 3px;

      color: #344e5e;

      font-size: 15px;
      font-weight: 900;
    }

    .contact-meta {
      color: #81939e;

      font-size: 11px;
    }

    .call-button {
      width: 100%;

      margin-top: 11px;

      padding: 13px;

      border: none;
      border-radius: 13px;

      background: #e7f3ff;

      color: #28658e;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }

    .empty-card {
      padding: 21px 15px;

      background: white;

      border-radius: 18px;

      text-align: center;

      color: #8498a4;

      font-size: 12px;
      line-height: 1.65;
    }

    .teacher-managed-note {
      background: #eef5ff;

      border-radius: 17px;

      padding: 13px 14px;

      color: #607d8b;

      font-size: 11px;
      line-height: 1.6;

      text-align: center;
    }

    .bottom-message {
      margin-top: 18px;

      text-align: center;

      color: #8da0ab;

      font-size: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="page-wrap">


  <div class="top-bar">

    <button
      class="back-button"
      onclick="location.href='index.html'">

      ‹

    </button>


    <div class="title-area">

      <h1>
        도움이 필요해요
      </h1>

      <p>
        혼자 있지 말고 어른에게 바로 알려요.
      </p>

    </div>

  </div>



  <div class="help-hero">

    <div class="help-icon">
      🚨
    </div>

    <h2>
      선생님, 도와주세요!
    </h2>

    <p>
      몸이 이상하거나 도움이 필요하면<br>
      가까운 선생님이나 어른에게 먼저 알려주세요.
    </p>

  </div>



  <div class="section-title">
    📞 누구에게 연락할까요?
  </div>


  <div
    id="contactList"
    class="contacts-area">

    <div class="empty-card">
      연락처를 불러오는 중이에요.
    </div>

  </div>



  <div class="teacher-managed-note">

    🔒 비상연락처는 보호자 또는 교직원이 등록·관리합니다.<br>
    학생은 등록된 연락처를 확인하고 전화할 수 있어요.

  </div>



  <div class="bottom-message">

    전화 버튼을 누르면 휴대폰의 전화 기능이 열립니다.<br>
    도움이 필요하면 혼자 있지 말고 가까운 어른에게 바로 알려주세요.

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let currentContacts =
  [];



window.addEventListener(
  "load",
  async function() {

    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    await loadContacts();

  }
);



async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );

  }


  if (
    profile &&
    (
      profile.role === "teacher"
      ||
      profile.role === "nurse"
    )
  ) {

    location.href =
      "teacher.html";


    return false;

  }


  return true;

}



async function loadContacts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .select(
        "id, contact_name, relationship, phone_number, created_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    document.getElementById(
      "contactList"
    ).innerHTML =
      `
        <div class="empty-card">
          연락처를 불러오지 못했어요.
        </div>
      `;


    return;

  }


  currentContacts =
    data || [];


  renderContacts();

}



function renderContacts() {

  const contactList =
    document.getElementById(
      "contactList"
    );


  contactList.innerHTML =
    "";


  if (
    currentContacts.length === 0
  ) {

    contactList.innerHTML =
      `
        <div class="empty-card">
          아직 등록된 연락처가 없어요.<br>
          선생님이나 보호자에게 등록을 요청해주세요.
        </div>
      `;


    return;

  }


  currentContacts.forEach(
    function(contact) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "contact-card";


      let icon =
        "📞";


      if (
        contact.relationship === "엄마"
        ||
        contact.relationship === "아빠"
        ||
        contact.relationship === "보호자"
      ) {

        icon =
          "👨‍👩‍👧";

      }


      if (
        contact.relationship === "보건실"
      ) {

        icon =
          "🏥";

      }


      if (
        contact.relationship === "담임 선생님"
      ) {

        icon =
          "👩‍🏫";

      }


      const top =
        document.createElement(
          "div"
        );


      top.className =
        "contact-top";


      const iconBox =
        document.createElement(
          "div"
        );


      iconBox.className =
        "contact-icon";


      iconBox.textContent =
        icon;


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "contact-info";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "contact-name";


      name.textContent =
        contact.relationship
        +
        " · "
        +
        contact.contact_name;


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "contact-meta";


      meta.textContent =
        contact.phone_number;


      info.appendChild(
        name
      );


      info.appendChild(
        meta
      );


      top.appendChild(
        iconBox
      );


      top.appendChild(
        info
      );


      const callButton =
        document.createElement(
          "button"
        );


      callButton.className =
        "call-button";


      callButton.textContent =
        "📞 "
        +
        contact.relationship
        +
        "에게 전화하기";


      callButton.onclick =
        function() {

          confirmCall(
            contact
          );

        };


      card.appendChild(
        top
      );


      card.appendChild(
        callButton
      );


      contactList.appendChild(
        card
      );

    }
  );

}



function confirmCall(
  contact
) {

  const confirmed =
    confirm(
      contact.relationship
      +
      " "
      +
      contact.contact_name
      +
      "에게 전화할까요?\n\n"
      +
      contact.phone_number
    );


  if (!confirmed) {
    return;
  }


  const cleanedPhone =
    contact.phone_number.replace(
      /[^0-9+]/g,
      ""
    );


  location.href =
    "tel:"
    +
    cleanedPhone;

}

</script>

</body>

</html>
