<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>도움 요청 - GlucoGuard</title>

  <link
    rel="stylesheet"
    href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5faff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #263238;
    }

    .page-wrap {
      width: 100%;
      max-width: 460px;

      margin: 0 auto;

      padding: 20px 18px 38px;
    }

    .top-bar {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 19px;
    }

    .back-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 14px;

      background: white;

      color: #526b7b;

      font-size: 27px;

      cursor: pointer;

      box-shadow:
        0 4px 13px rgba(60,90,110,.07);
    }

    .title-area h1 {
      margin: 0;

      color: #344e5e;

      font-size: 22px;
      font-weight: 900;
    }

    .title-area p {
      margin: 4px 0 0;

      color: #8295a1;

      font-size: 12px;
    }


    /* =========================
       도움 안내
    ========================= */

    .help-hero {
      background: #fff0ee;

      border: 2px solid #ffd2cd;

      border-radius: 24px;

      padding: 20px;

      margin-bottom: 18px;

      text-align: center;
    }

    .help-icon {
      width: 65px;
      height: 65px;

      margin: 0 auto 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 21px;

      background: white;

      font-size: 34px;
    }

    .help-hero h2 {
      margin: 0 0 7px;

      color: #c54c44;

      font-size: 20px;
      font-weight: 900;
    }

    .help-hero p {
      margin: 0;

      color: #826d6b;

      font-size: 13px;
      line-height: 1.65;
    }


    /* =========================
       섹션
    ========================= */

    .section-title {
      margin: 0 0 10px;

      color: #455a64;

      font-size: 15px;
      font-weight: 900;
    }


    /* =========================
       담당 선생님
    ========================= */

    .teacher-area {
      margin-bottom: 20px;
    }

    .teacher-card {
      background: #eef4ff;

      border: 2px solid #d9e7ff;

      border-radius: 20px;

      padding: 15px;

      margin-bottom: 10px;
    }

    .teacher-top {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .teacher-icon {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: white;

      font-size: 27px;
    }

    .teacher-info {
      flex: 1;
      min-width: 0;
    }

    .teacher-label {
      margin-bottom: 3px;

      color: #6f83a4;

      font-size: 10px;
      font-weight: 800;
    }

    .teacher-name {
      margin-bottom: 3px;

      color: #3f587d;

      font-size: 15px;
      font-weight: 900;
    }

    .teacher-phone {
      color: #71849f;

      font-size: 11px;
    }

    .teacher-call-button {
      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border: none;
      border-radius: 13px;

      background: #5f83c4;

      color: white;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }


    /* =========================
       기타 연락처
    ========================= */

    .contacts-area {
      margin-bottom: 18px;
    }

    .contact-card {
      background: white;

      border-radius: 19px;

      padding: 14px;

      margin-bottom: 10px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }

    .contact-top {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .contact-icon {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #eef6ff;

      font-size: 25px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      margin-bottom: 3px;

      color: #344e5e;

      font-size: 15px;
      font-weight: 900;
    }

    .contact-meta {
      color: #81939e;

      font-size: 11px;
    }

    .call-button {
      width: 100%;

      margin-top: 11px;

      padding: 13px;

      border: none;
      border-radius: 13px;

      background: #e7f3ff;

      color: #28658e;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }

    .empty-card {
      padding: 21px 15px;

      background: white;

      border-radius: 18px;

      text-align: center;

      color: #8498a4;

      font-size: 12px;
      line-height: 1.65;
    }


    /* =========================
       안내
    ========================= */

    .teacher-managed-note {
      background: #eef5ff;

      border-radius: 17px;

      padding: 13px 14px;

      color: #607d8b;

      font-size: 11px;
      line-height: 1.6;

      text-align: center;
    }

    .bottom-message {
      margin-top: 18px;

      text-align: center;

      color: #8da0ab;

      font-size: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="page-wrap">


  <div class="top-bar">

    <button
      class="back-button"
      onclick="location.href='index.html'">

      ‹

    </button>


    <div class="title-area">

      <h1>
        도움이 필요해요
      </h1>

      <p>
        혼자 있지 말고 어른에게 바로 알려요.
      </p>

    </div>

  </div>



  <div class="help-hero">

    <div class="help-icon">
      🚨
    </div>

    <h2>
      선생님, 도와주세요!
    </h2>

    <p>
      몸이 이상하거나 도움이 필요하면<br>
      가까운 선생님이나 어른에게 먼저 알려주세요.
    </p>

  </div>



  <!-- 담당 선생님 -->

  <div class="section-title">
    👩‍🏫 담당 선생님
  </div>


  <div
    id="teacherList"
    class="teacher-area">

    <div class="empty-card">
      담당 선생님을 확인하고 있어요.
    </div>

  </div>



  <!-- 보호자 / 보건실 -->

  <div class="section-title">
    📞 다른 연락처
  </div>


  <div
    id="contactList"
    class="contacts-area">

    <div class="empty-card">
      연락처를 불러오는 중이에요.
    </div>

  </div>



  <div class="teacher-managed-note">

    🔒 담당 선생님은 학교에서 연결된 정보가 자동으로 표시돼요.<br>
    보호자와 보건실 연락처는 보호자 또는 교직원이 관리합니다.

  </div>



  <div class="bottom-message">

    전화 버튼을 누르면 휴대폰의 전화 기능이 열립니다.<br>
    도움이 필요하면 혼자 있지 말고 가까운 어른에게 바로 알려주세요.

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let currentContacts =
  [];


let currentTeachers =
  [];



window.addEventListener(
  "load",
  async function() {

    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    await loadTeachers();


    await loadContacts();

  }
);



/* =========================
   로그인
========================= */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );

  }


  if (
    profile &&
    (
      profile.role === "teacher"
      ||
      profile.role === "nurse"
    )
  ) {

    location.href =
      "teacher.html";


    return false;

  }


  return true;

}



/* =========================
   담당 교직원 자동 불러오기
========================= */

async function loadTeachers() {

  const teacherList =
    document.getElementById(
      "teacherList"
    );


  const {
    data: links,
    error: linkError
  } =
    await supabaseClient
      .from("teacher_students")
      .select("teacher_id")
      .eq(
        "student_id",
        currentUser.id
      );


  if (linkError) {

    console.error(
      linkError
    );


    teacherList.innerHTML =
      `
        <div class="empty-card">
          담당 선생님 정보를 불러오지 못했어요.
        </div>
      `;


    return;

  }


  const teacherIds =
    (links || [])
      .map(
        item =>
          item.teacher_id
      );


  if (
    teacherIds.length === 0
  ) {

    teacherList.innerHTML =
      `
        <div class="empty-card">
          아직 연결된 담당 선생님이 없어요.<br>
          가까운 선생님에게 직접 도움을 요청해주세요.
        </div>
      `;


    return;

  }


  const {
    data: teachers,
    error: teacherError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, nickname, class_name, role, phone_number"
      )
      .in(
        "id",
        teacherIds
      );


  if (teacherError) {

    console.error(
      teacherError
    );


    teacherList.innerHTML =
      `
        <div class="empty-card">
          담당 선생님 정보를 불러오지 못했어요.
        </div>
      `;


    return;

  }


  currentTeachers =
    teachers || [];


  renderTeachers();

}



/* =========================
   담당 교직원 표시
========================= */

function renderTeachers() {

  const container =
    document.getElementById(
      "teacherList"
    );


  container.innerHTML =
    "";


  if (
    currentTeachers.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty-card">
          아직 연결된 담당 선생님이 없어요.
        </div>
      `;


    return;

  }


  currentTeachers.forEach(
    function(teacher) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "teacher-card";


      const top =
        document.createElement(
          "div"
        );


      top.className =
        "teacher-top";


      const icon =
        document.createElement(
          "div"
        );


      icon.className =
        "teacher-icon";


      icon.textContent =
        teacher.role === "nurse"
        ?
        "🧑‍⚕️"
        :
        "👩‍🏫";


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "teacher-info";


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "teacher-label";


      label.textContent =
        teacher.role === "nurse"
        ?
        "담당 보건교사"
        :
        "담당 선생님";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "teacher-name";


      name.textContent =
        teacher.nickname ||
        "선생님";


      const phone =
        document.createElement(
          "div"
        );


      phone.className =
        "teacher-phone";


      phone.textContent =
        teacher.phone_number
        ||
        "전화번호가 아직 등록되지 않았어요";


      info.appendChild(
        label
      );


      info.appendChild(
        name
      );


      info.appendChild(
        phone
      );


      top.appendChild(
        icon
      );


      top.appendChild(
        info
      );


      card.appendChild(
        top
      );


      if (
        teacher.phone_number
      ) {

        const callButton =
          document.createElement(
            "button"
          );


        callButton.className =
          "teacher-call-button";


        callButton.textContent =
          teacher.role === "nurse"
          ?
          "📞 보건 선생님에게 전화하기"
          :
          "📞 담당 선생님에게 전화하기";


        callButton.onclick =
          function() {

            confirmTeacherCall(
              teacher
            );

          };


        card.appendChild(
          callButton
        );

      }


      container.appendChild(
        card
      );

    }
  );

}



/* =========================
   보호자 등 연락처
========================= */

async function loadContacts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .select(
        "id, contact_name, relationship, phone_number, created_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    document.getElementById(
      "contactList"
    ).innerHTML =
      `
        <div class="empty-card">
          연락처를 불러오지 못했어요.
        </div>
      `;


    return;

  }


  currentContacts =
    data || [];


  renderContacts();

}



function renderContacts() {

  const contactList =
    document.getElementById(
      "contactList"
    );


  contactList.innerHTML =
    "";


  if (
    currentContacts.length === 0
  ) {

    contactList.innerHTML =
      `
        <div class="empty-card">
          등록된 보호자 또는 보건실 연락처가 없어요.
        </div>
      `;


    return;

  }


  currentContacts.forEach(
    function(contact) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "contact-card";


      let icon =
        "📞";


      if (
        contact.relationship === "엄마"
        ||
        contact.relationship === "아빠"
        ||
        contact.relationship === "보호자"
      ) {

        icon =
          "👨‍👩‍👧";

      }


      if (
        contact.relationship === "보건실"
      ) {

        icon =
          "🏥";

      }


      const top =
        document.createElement(
          "div"
        );


      top.className =
        "contact-top";


      const iconBox =
        document.createElement(
          "div"
        );


      iconBox.className =
        "contact-icon";


      iconBox.textContent =
        icon;


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "contact-info";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "contact-name";


      name.textContent =
        contact.relationship
        +
        " · "
        +
        contact.contact_name;


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "contact-meta";


      meta.textContent =
        contact.phone_number;


      info.appendChild(
        name
      );


      info.appendChild(
        meta
      );


      top.appendChild(
        iconBox
      );


      top.appendChild(
        info
      );


      const callButton =
        document.createElement(
          "button"
        );


      callButton.className =
        "call-button";


      callButton.textContent =
        "📞 "
        +
        contact.relationship
        +
        "에게 전화하기";


      callButton.onclick =
        function() {

          confirmContactCall(
            contact
          );

        };


      card.appendChild(
        top
      );


      card.appendChild(
        callButton
      );


      contactList.appendChild(
        card
      );

    }
  );

}



/* =========================
   담당 선생님 전화
========================= */

function confirmTeacherCall(
  teacher
) {

  const phone =
    teacher.phone_number;


  if (!phone) {

    alert(
      "담당 선생님의 전화번호가 등록되지 않았어요."
    );


    return;

  }


  const confirmed =
    confirm(
      (teacher.nickname || "담당 선생님")
      +
      "에게 전화할까요?\n\n"
      +
      phone
    );


  if (!confirmed) {
    return;
  }


  const cleanedPhone =
    phone.replace(
      /[^0-9+]/g,
      ""
    );


  location.href =
    "tel:"
    +
    cleanedPhone;

}



/* =========================
   보호자 전화
========================= */

function confirmContactCall(
  contact
) {

  const confirmed =
    confirm(
      contact.relationship
      +
      " "
      +
      contact.contact_name
      +
      "에게 전화할까요?\n\n"
      +
      contact.phone_number
    );


  if (!confirmed) {
    return;
  }


  const cleanedPhone =
    contact.phone_number.replace(
      /[^0-9+]/g,
      ""
    );


  location.href =
    "tel:"
    +
    cleanedPhone;

}

</script>

</body>

</html>
