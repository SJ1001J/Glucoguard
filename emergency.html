<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>다른 연락처 - GlucoGuard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  background: #f5f8fb;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #344e5e;
}

button,
input,
select {
  font-family: inherit;
}

.page {
  width: 100%;
  max-width: 650px;

  margin: 0 auto;

  padding: 18px 16px 50px;
}


/* =========================
상단
========================= */

.top-bar {
  display: flex;
  align-items: flex-start;

  gap: 12px;

  margin-bottom: 15px;
}

.back-button {
  width: 44px;
  height: 44px;

  flex-shrink: 0;

  border: none;
  border-radius: 14px;

  background: white;

  color: #607d8b;

  font-size: 22px;

  cursor: pointer;

  box-shadow:
    0 4px 12px rgba(60,80,95,.06);
}

.top-title h1 {
  margin: 0;

  color: #355f7f;

  font-size: 22px;
  font-weight: 900;
}

.top-title p {
  margin: 5px 0 0;

  color: #8799a4;

  font-size: 11px;
  line-height: 1.5;
}


/* =========================
슈퍼모드
========================= */

.super-banner {
  display: none;

  margin-bottom: 14px;

  padding: 13px 14px;

  border-radius: 16px;

  background: #fff3d8;

  color: #8a6722;

  font-size: 11px;
  line-height: 1.6;
}

.super-banner.show {
  display: block;
}

.super-banner strong {
  display: block;

  margin-bottom: 3px;
}


/* =========================
학생 정보
========================= */

.student-card {
  display: flex;
  align-items: center;

  gap: 12px;

  margin-bottom: 14px;

  padding: 16px;

  border-radius: 20px;

  background: white;

  box-shadow:
    0 5px 15px rgba(60,80,95,.06);
}

.student-avatar {
  width: 52px;
  height: 52px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 16px;

  background: #fff0c8;

  font-size: 29px;
}

.student-name {
  color: #344e5e;

  font-size: 16px;
  font-weight: 900;
}

.student-class {
  margin-top: 4px;

  color: #899aa3;

  font-size: 10px;
}


/* =========================
안내
========================= */

.info-card {
  margin-bottom: 15px;

  padding: 14px 15px;

  border-radius: 17px;

  background: #eaf4ff;

  color: #4a6d83;

  font-size: 10px;
  line-height: 1.65;
}


/* =========================
추가 버튼
========================= */

.add-button {
  display: none;

  width: 100%;

  margin-bottom: 14px;

  padding: 13px;

  border: none;
  border-radius: 14px;

  background: #dff2e8;

  color: #3e765c;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}

.add-button.show {
  display: block;
}


/* =========================
목록
========================= */

.section-title {
  margin: 18px 2px 10px;

  color: #516c7a;

  font-size: 14px;
  font-weight: 900;
}

.contact-list {
  display: grid;

  gap: 10px;
}

.contact-card {
  padding: 15px;

  border-radius: 19px;

  background: white;

  box-shadow:
    0 4px 13px rgba(60,80,95,.05);
}

.contact-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 10px;
}

.contact-main {
  display: flex;
  align-items: center;

  gap: 11px;
}

.contact-icon {
  width: 43px;
  height: 43px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 13px;

  background: #f2f6f9;

  font-size: 21px;
}

.contact-name {
  color: #344e5e;

  font-size: 13px;
  font-weight: 900;
}

.contact-relation {
  margin-top: 3px;

  color: #8999a2;

  font-size: 9px;
}

.phone-button {
  display: inline-block;

  margin-top: 10px;

  padding: 9px 11px;

  border: none;
  border-radius: 11px;

  background: #edf5ff;

  color: #3d7193;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}

.admin-actions {
  display: none;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 10px;
}

.admin-actions.show {
  display: grid;
}

.edit-button,
.delete-button {
  border: none;
  border-radius: 11px;

  padding: 9px;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}

.edit-button {
  background: #e9f4ed;

  color: #47725a;
}

.delete-button {
  background: #fff0ee;

  color: #a6534c;
}

.empty-card {
  padding: 25px;

  border-radius: 19px;

  background: white;

  color: #8999a2;

  text-align: center;

  font-size: 11px;
  line-height: 1.6;
}


/* =========================
담당교직원
========================= */

.teacher-card {
  margin-top: 16px;

  padding: 15px;

  border-radius: 19px;

  background: #f2efff;

  color: #65598a;
}

.teacher-title {
  margin-bottom: 8px;

  font-size: 12px;
  font-weight: 900;
}

.teacher-name {
  font-size: 13px;
  font-weight: 900;
}

.teacher-phone {
  margin-top: 4px;

  font-size: 10px;
}


/* =========================
모달
========================= */

.overlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 1000;

  padding: 18px;

  overflow-y: auto;

  background:
    rgba(35,50,60,.42);
}

.overlay.show {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal {
  width: 100%;
  max-width: 480px;

  margin-top: 30px;

  padding: 19px;

  border-radius: 22px;

  background: white;

  box-shadow:
    0 15px 40px rgba(0,0,0,.17);
}

.modal-title {
  margin-bottom: 5px;

  color: #355f7f;

  font-size: 18px;
  font-weight: 900;
}

.modal-sub {
  margin-bottom: 16px;

  color: #899aa3;

  font-size: 10px;
  line-height: 1.5;
}

.field {
  margin-bottom: 13px;
}

.field label {
  display: block;

  margin-bottom: 6px;

  color: #607783;

  font-size: 10px;
  font-weight: 900;
}

.field input,
.field select {
  width: 100%;

  border: 1px solid #dbe5ea;
  border-radius: 12px;

  padding: 12px;

  background: white;

  color: #344e5e;

  font-size: 15px;

  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: #9dbed5;
}

.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  margin-top: 16px;
}

.cancel-button,
.save-button {
  border: none;
  border-radius: 13px;

  padding: 12px;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}

.cancel-button {
  background: #f1f3f4;

  color: #71818a;
}

.save-button {
  background: #dfefff;

  color: #355f7f;
}

.save-button:disabled {
  opacity: .5;
}

</style>

</head>


<body>

<div class="page">


  <div class="top-bar">

    <button
      class="back-button"
      onclick="goBack()">

      ←

    </button>


    <div class="top-title">

      <h1>
        📞 다른 연락처
      </h1>

      <p id="pageDescription">
        보호자와 학교 연락처를 확인해요.
      </p>

    </div>

  </div>



  <div
    id="superBanner"
    class="super-banner">

    <strong>
      🛡️ 슈퍼관리
    </strong>

    선택한 실제 학생의 연락처를 관리하고 있습니다.

  </div>



  <div class="student-card">

    <div
      id="studentAvatar"
      class="student-avatar">

      🐻

    </div>

    <div>

      <div
        id="studentName"
        class="student-name">

        학생

      </div>

      <div
        id="studentClass"
        class="student-class">

        정보를 불러오는 중...

      </div>

    </div>

  </div>



  <div
    id="infoCard"
    class="info-card">

    보호자 또는 학교 연락처를 확인할 수 있습니다.

  </div>



  <button
    id="addButton"
    class="add-button"
    onclick="openAddModal()">

    ➕ 연락처 추가

  </button>



  <div class="section-title">
    📱 등록된 연락처
  </div>


  <div
    id="contactList"
    class="contact-list">

    <div class="empty-card">
      연락처를 불러오는 중...
    </div>

  </div>



  <div
    id="teacherArea">
  </div>


</div>



<!-- 연락처 등록/수정 모달 -->

<div
  id="contactOverlay"
  class="overlay">

  <div class="modal">

    <div
      id="modalTitle"
      class="modal-title">

      연락처 추가

    </div>


    <div class="modal-sub">

      학생에게 필요한 보호자 또는 학교 연락처를 입력해주세요.

    </div>



    <div class="field">

      <label for="contactName">
        이름
      </label>

      <input
        id="contactName"
        type="text"
        maxlength="50"
        placeholder="예: 김OO">

    </div>



    <div class="field">

      <label for="relationship">
        관계
      </label>

      <select id="relationship">

        <option value="">
          선택해주세요
        </option>

        <option value="어머니">
          어머니
        </option>

        <option value="아버지">
          아버지
        </option>

        <option value="보호자">
          보호자
        </option>

        <option value="보건실">
          보건실
        </option>

        <option value="학교">
          학교
        </option>

        <option value="기타">
          기타
        </option>

      </select>

    </div>



    <div class="field">

      <label for="phoneNumber">
        전화번호
      </label>

      <input
        id="phoneNumber"
        type="tel"
        maxlength="30"
        placeholder="예: 010-1234-5678">

    </div>



    <div class="modal-actions">

      <button
        class="cancel-button"
        onclick="closeModal()">

        취소

      </button>


      <button
        id="saveButton"
        class="save-button"
        onclick="saveContact()">

        저장

      </button>

    </div>

  </div>

</div>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let loginProfile =
  null;


let targetStudentId =
  null;


let targetStudent =
  null;


let isSuperView =
  false;


let isTeacherView =
  false;


let contacts =
  [];


let editingContact =
  null;



/* =========================
시작
========================= */

window.addEventListener(
  "load",
  async function() {

    const ready =
      await initializePage();


    if (!ready) {
      return;
    }


    await loadContacts();


    await loadTeacher();

  }
);



/* =========================
누구의 연락처를 볼지 결정
========================= */

async function initializePage() {

  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth
      .getSession();


  if (
    sessionError
    ||
    !sessionData.session
  ) {

    location.href =
      "./login.html";


    return false;

  }


  currentUser =
    sessionData.session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nickname,role,is_super"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    error
    ||
    !profile
  ) {

    alert(
      "계정 정보를 확인하지 못했어요."
    );


    return false;

  }


  loginProfile =
    profile;



  /* =========================
     슈퍼계정
  ========================= */

  const superStudentId =
    sessionStorage.getItem(
      "superViewStudent"
    );


  if (
    profile.is_super === true
    &&
    superStudentId
  ) {

    isSuperView =
      true;


    targetStudentId =
      superStudentId;


    const {
      data: student,
      error: studentError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nickname,class_name,avatar,role"
        )
        .eq(
          "id",
          targetStudentId
        )
        .eq(
          "role",
          "student"
        )
        .maybeSingle();


    if (
      studentError
      ||
      !student
    ) {

      alert(
        "학생 정보를 불러오지 못했어요."
      );


      location.href =
        "./admin.html";


      return false;

    }


    targetStudent =
      student;


    document.getElementById(
      "superBanner"
    ).classList.add(
      "show"
    );


    document.getElementById(
      "addButton"
    ).classList.add(
      "show"
    );


    document.getElementById(
      "infoCard"
    ).innerHTML =
      `
        🛡️ 슈퍼계정에서는
        이 학생의 보호자·학교 연락처를
        <strong>추가, 수정, 삭제</strong>할 수 있습니다.
      `;


    renderStudentInfo();


    return true;

  }



  /* =========================
     교직원
  ========================= */

  if (
    profile.role === "teacher"
    ||
    profile.role === "nurse"
  ) {

    const selectedStudent =
      sessionStorage.getItem(
        "teacherSelectedStudent"
      );


    if (!selectedStudent) {

      alert(
        "먼저 학생을 선택해주세요."
      );


      location.href =
        "./teacher.html";


      return false;

    }


    targetStudentId =
      selectedStudent;


    isTeacherView =
      true;


    const {
      data: student
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nickname,class_name,avatar"
        )
        .eq(
          "id",
          targetStudentId
        )
        .maybeSingle();


    targetStudent =
      student;


    renderStudentInfo();


    return true;

  }



  /* =========================
     일반 학생
  ========================= */

  if (
    profile.role === "student"
  ) {

    targetStudentId =
      currentUser.id;


    const {
      data: student
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nickname,class_name,avatar"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    targetStudent =
      student;


    renderStudentInfo();


    return true;

  }



  /* =========================
     데모
  ========================= */

  if (
    profile.role === "demo"
  ) {

    targetStudentId =
      currentUser.id;


    targetStudent = {

      id:
        currentUser.id,

      nickname:
        "GlucoGuard Demo",

      class_name:
        "학생 화면 체험 중",

      avatar:
        "⭐"

    };


    renderStudentInfo();


    document.getElementById(
      "contactList"
    ).innerHTML =
      `

        <div class="contact-card">

          <div class="contact-main">

            <div class="contact-icon">
              👩
            </div>

            <div>

              <div class="contact-name">
                보호자
              </div>

              <div class="contact-relation">
                체험용 연락처
              </div>

            </div>

          </div>

          <button
            class="phone-button"
            onclick="alert('체험 모드에서는 실제 전화 연결을 하지 않습니다.')">

            📞 010-0000-0000

          </button>

        </div>

      `;


    return false;

  }


  return false;

}



/* =========================
학생정보
========================= */

function renderStudentInfo() {

  if (!targetStudent) {
    return;
  }


  document.getElementById(
    "studentAvatar"
  ).textContent =
    targetStudent.avatar
    ||
    "🐻";


  document.getElementById(
    "studentName"
  ).textContent =
    targetStudent.nickname
    ||
    "학생";


  document.getElementById(
    "studentClass"
  ).textContent =
    targetStudent.class_name
    ||
    "학급 정보 없음";


  if (
    isSuperView
  ) {

    document.getElementById(
      "pageDescription"
    ).textContent =
      `${targetStudent.nickname || "학생"} 학생의 연락처를 관리합니다.`;

  }

}



/* =========================
연락처 불러오기
========================= */

async function loadContacts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .select(
        "id,user_id,contact_name,relationship,phone_number,created_at"
      )
      .eq(
        "user_id",
        targetStudentId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    document.getElementById(
      "contactList"
    ).innerHTML =
      `

        <div class="empty-card">

          연락처를 불러오지 못했어요.

        </div>

      `;


    return;

  }


  contacts =
    data || [];


  renderContacts();

}



/* =========================
연락처 표시
========================= */

function renderContacts() {

  const area =
    document.getElementById(
      "contactList"
    );


  if (
    contacts.length === 0
  ) {

    area.innerHTML =
      `

        <div class="empty-card">

          아직 등록된 다른 연락처가 없습니다.

          ${
            isSuperView
            ?
            "<br>위의 ‘연락처 추가’ 버튼으로 등록해주세요."
            :
            ""
          }

        </div>

      `;


    return;

  }


  area.innerHTML =
    contacts.map(
      contact => {

        return `

          <div class="contact-card">

            <div class="contact-head">

              <div class="contact-main">

                <div class="contact-icon">

                  ${getRelationshipIcon(
                    contact.relationship
                  )}

                </div>


                <div>

                  <div class="contact-name">

                    ${escapeHtml(
                      contact.contact_name
                      ||
                      "이름 없음"
                    )}

                  </div>


                  <div class="contact-relation">

                    ${escapeHtml(
                      contact.relationship
                      ||
                      "연락처"
                    )}

                  </div>

                </div>

              </div>

            </div>


            <button
              class="phone-button"
              onclick="callContact('${escapeJs(contact.phone_number || "")}')">

              📞
              ${escapeHtml(
                contact.phone_number
                ||
                "전화번호 없음"
              )}

            </button>


            <div
              class="admin-actions
              ${isSuperView ? "show" : ""}">

              <button
                class="edit-button"
                onclick="openEditModal(${Number(contact.id)})">

                ✏️ 수정

              </button>


              <button
                class="delete-button"
                onclick="deleteContact(${Number(contact.id)})">

                🗑️ 삭제

              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}



/* =========================
담당 교직원
========================= */

async function loadTeacher() {

  if (
    !targetStudentId
  ) {
    return;
  }


  const {
    data: links,
    error
  } =
    await supabaseClient
      .from(
        "teacher_students"
      )
      .select(
        "teacher_id"
      )
      .eq(
        "student_id",
        targetStudentId
      )
      .limit(1);


  if (
    error
    ||
    !links
    ||
    links.length === 0
  ) {

    return;

  }


  const teacherId =
    links[0].teacher_id;


  const {
    data: teacher
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "nickname,phone_number"
      )
      .eq(
        "id",
        teacherId
      )
      .maybeSingle();


  if (!teacher) {
    return;
  }


  document.getElementById(
    "teacherArea"
  ).innerHTML =
    `

      <div class="teacher-card">

        <div class="teacher-title">
          👩‍🏫 담당 선생님
        </div>

        <div class="teacher-name">

          ${escapeHtml(
            teacher.nickname
            ||
            "담당 선생님"
          )}

        </div>

        <div class="teacher-phone">

          ${
            teacher.phone_number
            ?
            escapeHtml(
              teacher.phone_number
            )
            :
            "등록된 연락처 없음"
          }

        </div>

      </div>

    `;

}



/* =========================
추가 모달
========================= */

function openAddModal() {

  if (
    !isSuperView
  ) {
    return;
  }


  editingContact =
    null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "연락처 추가";


  document.getElementById(
    "contactName"
  ).value =
    "";


  document.getElementById(
    "relationship"
  ).value =
    "";


  document.getElementById(
    "phoneNumber"
  ).value =
    "";


  document.getElementById(
    "contactOverlay"
  ).classList.add(
    "show"
  );

}



/* =========================
수정 모달
========================= */

function openEditModal(
  id
) {

  if (
    !isSuperView
  ) {
    return;
  }


  const contact =
    contacts.find(
      item =>
        Number(item.id)
        ===
        Number(id)
    );


  if (!contact) {
    return;
  }


  editingContact =
    contact;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "연락처 수정";


  document.getElementById(
    "contactName"
  ).value =
    contact.contact_name
    ||
    "";


  document.getElementById(
    "relationship"
  ).value =
    contact.relationship
    ||
    "";


  document.getElementById(
    "phoneNumber"
  ).value =
    contact.phone_number
    ||
    "";


  document.getElementById(
    "contactOverlay"
  ).classList.add(
    "show"
  );

}



/* =========================
모달 닫기
========================= */

function closeModal() {

  document.getElementById(
    "contactOverlay"
  ).classList.remove(
    "show"
  );


  editingContact =
    null;

}



/* =========================
연락처 저장
========================= */

async function saveContact() {

  if (
    !isSuperView
  ) {

    return;

  }


  const contactName =
    document.getElementById(
      "contactName"
    ).value.trim();


  const relationship =
    document.getElementById(
      "relationship"
    ).value.trim();


  const phoneNumber =
    document.getElementById(
      "phoneNumber"
    ).value.trim();


  if (
    !contactName
  ) {

    alert(
      "이름을 입력해주세요."
    );


    return;

  }


  if (
    !relationship
  ) {

    alert(
      "관계를 선택해주세요."
    );


    return;

  }


  if (
    !phoneNumber
  ) {

    alert(
      "전화번호를 입력해주세요."
    );


    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "저장 중...";


  let result;


  if (
    editingContact
  ) {

    result =
      await supabaseClient
        .from(
          "emergency_contacts"
        )
        .update(
          {

            contact_name:
              contactName,

            relationship:
              relationship,

            phone_number:
              phoneNumber

          }
        )
        .eq(
          "id",
          editingContact.id
        )
        .eq(
          "user_id",
          targetStudentId
        );

  }
  else {

    result =
      await supabaseClient
        .from(
          "emergency_contacts"
        )
        .insert(
          {

            user_id:
              targetStudentId,

            contact_name:
              contactName,

            relationship:
              relationship,

            phone_number:
              phoneNumber

          }
        );

  }


  saveButton.disabled =
    false;


  saveButton.textContent =
    "저장";


  if (
    result.error
  ) {

    console.error(
      result.error
    );


    alert(
      "연락처를 저장하지 못했어요.\nSupabase 권한 설정도 확인해주세요."
    );


    return;

  }


  closeModal();


  await loadContacts();


  alert(
    "연락처가 저장되었습니다."
  );

}



/* =========================
삭제
========================= */

async function deleteContact(
  id
) {

  if (
    !isSuperView
  ) {
    return;
  }


  const contact =
    contacts.find(
      item =>
        Number(item.id)
        ===
        Number(id)
    );


  if (!contact) {
    return;
  }


  const confirmed =
    confirm(
      `${contact.contact_name || "이 연락처"}를 삭제할까요?`
    );


  if (
    !confirmed
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        targetStudentId
      );


  if (
    error
  ) {

    console.error(
      error
    );


    alert(
      "연락처를 삭제하지 못했어요."
    );


    return;

  }


  await loadContacts();

}



/* =========================
전화
========================= */

function callContact(
  phone
) {

  if (!phone) {

    alert(
      "전화번호가 등록되어 있지 않습니다."
    );


    return;

  }


  const cleaned =
    phone.replace(
      /[^0-9+]/g,
      ""
    );


  window.location.href =
    "tel:"
    +
    cleaned;

}

/* =========================
안전처리
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      ""
    )
    .replaceAll(
      "\r",
      ""
    );

}

바깥 클릭

document.getElementById(
  "contactOverlay"
).addEventListener(
  "click",
  function(event) {

    if (
      event.target === this

  }
);
