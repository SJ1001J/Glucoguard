<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>다른 연락처 - GlucoGuard</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5faff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #263238;
    }

    .page-wrap {
      width: 100%;
      max-width: 460px;

      margin: 0 auto;

      padding: 20px 18px 38px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 22px;
    }

    .back-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 14px;

      background: white;

      color: #526b7b;

      font-size: 27px;

      cursor: pointer;

      box-shadow:
        0 4px 13px rgba(60,90,110,.07);
    }

    .title-area h1 {
      margin: 0;

      color: #344e5e;

      font-size: 22px;
      font-weight: 900;
    }

    .title-area p {
      margin: 4px 0 0;

      color: #8295a1;

      font-size: 12px;
    }

    .section-title {
      margin: 0 0 11px;

      color: #455a64;

      font-size: 15px;
      font-weight: 900;
    }

    .guardian-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-bottom: 19px;
    }

    .guardian-card {
      min-height: 180px;

      display: flex;
      flex-direction: column;

      padding: 15px;

      background: white;

      border-radius: 21px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }

    .guardian-icon {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 10px;

      border-radius: 16px;

      background: #eef6ff;

      font-size: 27px;
    }

    .guardian-role {
      color: #344e5e;

      font-size: 16px;
      font-weight: 900;

      margin-bottom: 4px;
    }

    .guardian-name {
      color: #607d8b;

      font-size: 12px;

      margin-bottom: 4px;
    }

    .guardian-phone {
      color: #81939e;

      font-size: 10px;
      line-height: 1.4;

      margin-bottom: 12px;

      word-break: break-all;
    }

    .guardian-spacer {
      flex: 1;
    }

    .call-button {
      width: 100%;

      padding: 12px 8px;

      border: none;
      border-radius: 13px;

      background: #e7f3ff;

      color: #28658e;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
    }

    .call-button:disabled {
      background: #f1f4f6;
      color: #a0adb4;
      cursor: default;
    }

    .nurse-card {
      background: white;

      border-radius: 21px;

      padding: 15px;

      margin-bottom: 18px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }

    .nurse-top {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .nurse-icon {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: #edf9f1;

      font-size: 26px;
    }

    .nurse-info {
      flex: 1;
      min-width: 0;
    }

    .nurse-role {
      color: #344e5e;

      font-size: 15px;
      font-weight: 900;

      margin-bottom: 3px;
    }

    .nurse-name {
      color: #607d8b;

      font-size: 11px;

      margin-bottom: 3px;
    }

    .nurse-phone {
      color: #81939e;

      font-size: 10px;
    }

    .nurse-call-button {
      width: 100%;

      margin-top: 11px;

      padding: 13px;

      border: none;
      border-radius: 13px;

      background: #eaf8ef;

      color: #3f7c56;

      font-size: 13px;
      font-weight: 900;

      cursor: pointer;
    }

    .nurse-call-button:disabled {
      background: #f1f4f6;
      color: #a0adb4;
      cursor: default;
    }

    .managed-note {
      background: #eef5ff;

      border-radius: 17px;

      padding: 13px 14px;

      color: #607d8b;

      font-size: 11px;
      line-height: 1.6;

      text-align: center;
    }

    .bottom-message {
      margin-top: 18px;

      text-align: center;

      color: #8da0ab;

      font-size: 10px;
      line-height: 1.6;
    }

    @media (max-width: 360px) {

      .guardian-grid {
        grid-template-columns: 1fr;
      }

      .guardian-card {
        min-height: 160px;
      }

    }

  </style>

</head>


<body>

<div class="page-wrap">


  <div class="top-bar">

    <button
      class="back-button"
      onclick="location.href='index.html'">

      ‹

    </button>


    <div class="title-area">

      <h1>
        다른 연락처
      </h1>

      <p>
        보호자나 보건실에 바로 전화할 수 있어요.
      </p>

    </div>

  </div>



  <div class="section-title">
    👨‍👩‍👧 보호자
  </div>


  <div class="guardian-grid">


    <div class="guardian-card">

      <div class="guardian-icon">
        👩
      </div>

      <div class="guardian-role">
        엄마
      </div>

      <div
        id="motherName"
        class="guardian-name">

        등록된 이름 없음

      </div>

      <div
        id="motherPhone"
        class="guardian-phone">

        등록된 번호 없음

      </div>

      <div class="guardian-spacer"></div>

      <button
        id="motherCallButton"
        class="call-button"
        disabled
        onclick="callContact('mother')">

        📞 엄마에게 전화

      </button>

    </div>



    <div class="guardian-card">

      <div class="guardian-icon">
        👨
      </div>

      <div class="guardian-role">
        아빠
      </div>

      <div
        id="fatherName"
        class="guardian-name">

        등록된 이름 없음

      </div>

      <div
        id="fatherPhone"
        class="guardian-phone">

        등록된 번호 없음

      </div>

      <div class="guardian-spacer"></div>

      <button
        id="fatherCallButton"
        class="call-button"
        disabled
        onclick="callContact('father')">

        📞 아빠에게 전화

      </button>

    </div>


  </div>



  <div class="section-title">
    🏥 학교 연락처
  </div>


  <div class="nurse-card">

    <div class="nurse-top">

      <div class="nurse-icon">
        🏥
      </div>

      <div class="nurse-info">

        <div class="nurse-role">
          보건실
        </div>

        <div
          id="nurseName"
          class="nurse-name">

          등록된 이름 없음

        </div>

        <div
          id="nursePhone"
          class="nurse-phone">

          등록된 번호 없음

        </div>

      </div>

    </div>


    <button
      id="nurseCallButton"
      class="nurse-call-button"
      disabled
      onclick="callContact('nurse')">

      📞 보건실에 전화하기

    </button>

  </div>



  <div class="managed-note">

    🔒 연락처는 보호자 또는 교직원이 등록·관리해요.<br>
    학생은 등록된 번호로 전화만 할 수 있어요.

  </div>



  <div class="bottom-message">

    전화 버튼을 누르면 휴대폰의 전화 기능이 열려요.<br>
    도움이 필요하면 혼자 있지 말고 가까운 어른에게 바로 알려주세요.

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let contactMap =
  {
    mother: null,
    father: null,
    nurse: null
  };



window.addEventListener(
  "load",
  async function() {

    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    await loadContacts();

  }
);



async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );

  }


  if (
    profile &&
    (
      profile.role === "teacher"
      ||
      profile.role === "nurse"
    )
  ) {

    location.href =
      "teacher.html";


    return false;

  }


  return true;

}



async function loadContacts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .select(
        "id, contact_name, relationship, phone_number, created_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    return;

  }


  const contacts =
    data || [];


  contactMap.mother =
    contacts.find(
      contact =>
        contact.relationship ===
        "엄마"
    ) || null;


  contactMap.father =
    contacts.find(
      contact =>
        contact.relationship ===
        "아빠"
    ) || null;


  contactMap.nurse =
    contacts.find(
      contact =>
        contact.relationship ===
        "보건실"
    ) || null;


  renderContact(
    "mother",
    contactMap.mother
  );


  renderContact(
    "father",
    contactMap.father
  );


  renderContact(
    "nurse",
    contactMap.nurse
  );

}



function renderContact(
  type,
  contact
) {

  let nameElement;
  let phoneElement;
  let buttonElement;


  if (
    type === "mother"
  ) {

    nameElement =
      document.getElementById(
        "motherName"
      );


    phoneElement =
      document.getElementById(
        "motherPhone"
      );


    buttonElement =
      document.getElementById(
        "motherCallButton"
      );

  }


  if (
    type === "father"
  ) {

    nameElement =
      document.getElementById(
        "fatherName"
      );


    phoneElement =
      document.getElementById(
        "fatherPhone"
      );


    buttonElement =
      document.getElementById(
        "fatherCallButton"
      );

  }


  if (
    type === "nurse"
  ) {

    nameElement =
      document.getElementById(
        "nurseName"
      );


    phoneElement =
      document.getElementById(
        "nursePhone"
      );


    buttonElement =
      document.getElementById(
        "nurseCallButton"
      );

  }


  if (!contact) {

    nameElement.textContent =
      "등록된 이름 없음";


    phoneElement.textContent =
      "등록된 번호 없음";


    buttonElement.disabled =
      true;


    return;

  }


  nameElement.textContent =
    contact.contact_name;


  phoneElement.textContent =
    contact.phone_number;


  buttonElement.disabled =
    false;

}



function callContact(
  type
) {

  const contact =
    contactMap[type];


  if (!contact) {

    alert(
      "등록된 전화번호가 없어요."
    );


    return;

  }


  const confirmed =
    confirm(
      contact.relationship
      +
      " "
      +
      contact.contact_name
      +
      "에게 전화할까요?\n\n"
      +
      contact.phone_number
    );


  if (!confirmed) {
    return;
  }


  const cleanedPhone =
    contact.phone_number.replace(
      /[^0-9+]/g,
      ""
    );


  location.href =
    "tel:"
    +
    cleanedPhone;

}

</script>

</body>

</html>
