<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>GlucoGuard 로그인</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(
          180deg,
          #eef7ff 0%,
          #f5fbf8 100%
        );
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #334e5d;
    }

    button,
    input {
      font-family: inherit;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-icon {
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      border-radius: 25px;
      background: white;
      box-shadow: 0 8px 24px rgba(68, 101, 120, .10);
      font-size: 42px;
    }

    .logo-title {
      margin: 0;
      color: #315b75;
      font-size: 28px;
      font-weight: 900;
    }

    .logo-subtitle {
      margin-top: 7px;
      color: #7b919e;
      font-size: 12px;
      line-height: 1.6;
    }

    .login-card {
      padding: 24px;
      border-radius: 25px;
      background: white;
      box-shadow: 0 12px 35px rgba(53, 80, 96, .09);
    }

    .login-title {
      margin: 0 0 18px;
      color: #405f70;
      font-size: 18px;
      font-weight: 900;
    }

    .input-label {
      display: block;
      margin: 0 0 6px 2px;
      color: #6d828e;
      font-size: 11px;
      font-weight: 800;
    }

    .login-input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 14px;
      border: 1px solid #d9e3e8;
      border-radius: 13px;
      outline: none;
      background: #fbfcfd;
      color: #405a68;
      font-size: 14px;
    }

    .login-input:focus {
      border-color: #75afd1;
      background: white;
    }

    .login-button {
      width: 100%;
      margin-top: 3px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #4285b4;
      color: white;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: default;
    }

    .login-message {
      min-height: 18px;
      margin-top: 12px;
      color: #c05851;
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }

    .demo-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(36, 52, 62, .45);
    }

    .demo-modal {
      width: 100%;
      max-width: 430px;
      padding: 23px;
      border-radius: 26px;
      background: white;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .demo-icon {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      border-radius: 20px;
      background: #fff4cf;
      font-size: 35px;
    }

    .demo-title {
      margin: 0;
      color: #3c5c6f;
      font-size: 21px;
      font-weight: 900;
      text-align: center;
    }

    .demo-description {
      margin: 7px 0 20px;
      color: #80929c;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .demo-role-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .demo-role-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      border: none;
      border-radius: 17px;
      text-align: left;
      cursor: pointer;
    }

    .demo-role-icon {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: rgba(255,255,255,.8);
      font-size: 27px;
    }

    .demo-role-text {
      flex: 1;
    }

    .demo-role-title {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 900;
    }

    .demo-role-description {
      font-size: 10px;
      line-height: 1.5;
      opacity: .8;
    }

    .demo-role-arrow {
      font-size: 22px;
      opacity: .5;
    }

    .student-role {
      background: #e9f8f2;
      color: #397762;
    }

    .teacher-role {
      background: #e9f3ff;
      color: #356b91;
    }

    .demo-logout {
      width: 100%;
      margin-top: 13px;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: #f3f5f6;
      color: #72848e;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

  </style>

</head>


<body>

<div class="login-container">

  <div class="logo-area">

    <div class="logo-icon">
      💙
    </div>

    <h1 class="logo-title">
      GlucoGuard
    </h1>

    <div class="logo-subtitle">
      학교에서 함께 관리하는<br>
      학생 혈당·건강 지원 서비스
    </div>

  </div>


  <div class="login-card">

    <h2 class="login-title">
      로그인
    </h2>


    <label
      class="input-label"
      for="email">

      이메일

    </label>

    <input
      id="email"
      class="login-input"
      type="email"
      autocomplete="email"
      placeholder="이메일을 입력해주세요">


    <label
      class="input-label"
      for="password">

      비밀번호

    </label>

    <input
      id="password"
      class="login-input"
      type="password"
      autocomplete="current-password"
      placeholder="비밀번호를 입력해주세요">


    <button
      id="loginButton"
      class="login-button"
      onclick="login()">

      로그인

    </button>


    <div
      id="loginMessage"
      class="login-message">
    </div>

  </div>

</div>



<!-- 데모 역할 선택 -->

<div
  id="demoOverlay"
  class="demo-overlay">

  <div class="demo-modal">

    <div class="demo-icon">
      ⭐
    </div>

    <h2 class="demo-title">
      GlucoGuard 체험 모드
    </h2>

    <div class="demo-description">
      하나의 데모계정으로 학생 화면과<br>
      교직원 화면을 모두 체험할 수 있습니다.
    </div>


    <div class="demo-role-list">

      <button
        class="demo-role-button student-role"
        onclick="enterDemoStudent()">

        <div class="demo-role-icon">
          👧
        </div>

        <div class="demo-role-text">

          <div class="demo-role-title">
            학생으로 보기
          </div>

          <div class="demo-role-description">
            혈당, 식사, 몸 상태 기록과 학생용 화면을 체험합니다.
          </div>

        </div>

        <div class="demo-role-arrow">
          ›
        </div>

      </button>


      <button
        class="demo-role-button teacher-role"
        onclick="enterDemoTeacher()">

        <div class="demo-role-icon">
          👩‍🏫
        </div>

        <div class="demo-role-text">

          <div class="demo-role-title">
            교직원으로 보기
          </div>

          <div class="demo-role-description">
            학생 관리, 안전카드, 알림, 교육 기능을 체험합니다.
          </div>

        </div>

        <div class="demo-role-arrow">
          ›
        </div>

      </button>

    </div>


    <button
      class="demo-logout"
      onclick="demoLogout()">

      다른 계정으로 로그인

    </button>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



window.addEventListener(
  "load",
  async function() {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (
      data.session
    ) {

      await routeLoggedInUser(
        data.session.user
      );

    }

  }
);



document.getElementById(
  "password"
).addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      login();

    }

  }
);



async function login() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const button =
    document.getElementById(
      "loginButton"
    );


  const message =
    document.getElementById(
      "loginMessage"
    );


  message.textContent =
    "";


  if (
    !email
    ||
    !password
  ) {

    message.textContent =
      "이메일과 비밀번호를 입력해주세요.";

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "로그인 중...";


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


  if (
    error
    ||
    !data.user
  ) {

    message.textContent =
      "이메일 또는 비밀번호를 확인해주세요.";


    button.disabled =
      false;


    button.textContent =
      "로그인";


    return;

  }


  sessionStorage.removeItem(
    "demoMode"
  );


  await routeLoggedInUser(
    data.user
  );


  button.disabled =
    false;


  button.textContent =
    "로그인";

}



async function routeLoggedInUser(
  user
) {

  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "role"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (
    error
    ||
    !profile
  ) {

    document.getElementById(
      "loginMessage"
    ).textContent =
      "사용자 정보를 불러오지 못했습니다.";

    return;

  }


  if (
    profile.role === "demo"
  ) {

    document.getElementById(
      "demoOverlay"
    ).style.display =
      "flex";

    return;

  }


  if (
    profile.role === "student"
  ) {

    window.location.href =
      "./index.html";

    return;

  }


  if (
    profile.role === "teacher"
    ||
    profile.role === "nurse"
  ) {

    window.location.href =
      "./teacher.html";

    return;

  }


  document.getElementById(
    "loginMessage"
  ).textContent =
    "등록되지 않은 사용자 유형입니다.";

}



function enterDemoStudent() {

  sessionStorage.setItem(
    "demoMode",
    "student"
  );


  window.location.href =
    "./index.html";

}



function enterDemoTeacher() {

  sessionStorage.setItem(
    "demoMode",
    "teacher"
  );


  window.location.href =
    "./teacher.html";

}



async function demoLogout() {

  sessionStorage.removeItem(
    "demoMode"
  );


  await supabaseClient.auth
    .signOut();


  document.getElementById(
    "demoOverlay"
  ).style.display =
    "none";


  document.getElementById(
    "email"
  ).value =
    "";


  document.getElementById(
    "password"
  ).value =
    "";

}

</script>

</body>

</html>
