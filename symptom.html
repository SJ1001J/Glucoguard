<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>몸 상태 기록 - GlucoGuard</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7fbff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #263238;
    }

    .page-wrap {
      width: 100%;
      max-width: 460px;

      margin: 0 auto;

      padding: 20px 18px 38px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;
    }

    .back-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 14px;

      background: white;

      color: #526b7b;

      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 4px 13px rgba(60,90,110,.07);
    }

    .title-area h1 {
      margin: 0;

      color: #344e5e;

      font-size: 22px;
      font-weight: 900;
    }

    .title-area p {
      margin: 4px 0 0;

      color: #8295a1;

      font-size: 12px;
    }


    /* =========================
       공통 STEP
    ========================= */

    .step-card {
      background: white;

      border-radius: 21px;

      padding: 16px;

      margin-bottom: 13px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }

    .step-badge {
      display: inline-block;

      padding: 4px 7px;

      margin-bottom: 10px;

      border-radius: 7px;

      background: #eaf4ff;

      color: #3776a4;

      font-size: 10px;
      font-weight: 900;
    }

    .step-title {
      margin-bottom: 5px;

      color: #344e5e;

      font-size: 17px;
      font-weight: 900;
    }

    .step-description {
      margin-bottom: 13px;

      color: #8397a3;

      font-size: 11px;
      line-height: 1.5;
    }


    /* =========================
       상황
    ========================= */

    .context-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;
    }

    .context-button {
      min-height: 58px;

      border: 2px solid transparent;
      border-radius: 14px;

      background: #f6f8fa;

      color: #455a64;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
    }

    .context-button.selected {
      border-color: #79aeda;

      background: #eaf4ff;

      color: #2c6c98;
    }

    .context-button.full {
      grid-column: 1 / -1;
    }


    /* =========================
       증상
    ========================= */

    .symptom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;
    }

    .symptom-button {
      min-height: 61px;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 11px;

      border: 2px solid transparent;
      border-radius: 14px;

      background: #f7f9fa;

      color: #455a64;

      text-align: left;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
    }

    .symptom-button.selected {
      border-color: #ffaaa4;

      background: #fff0ef;

      color: #ad4e48;
    }

    .symptom-icon {
      font-size: 20px;
    }


    /* =========================
       상태
    ========================= */

    .condition-list {
      display: flex;
      flex-direction: column;

      gap: 9px;
    }

    .condition-button {
      width: 100%;

      display: flex;
      align-items: flex-start;

      gap: 11px;

      padding: 14px;

      border: 2px solid transparent;
      border-radius: 15px;

      background: #f6f8fa;

      text-align: left;

      cursor: pointer;
    }

    .condition-button.selected {
      border-color: #79aeda;

      background: #eaf4ff;
    }

    .condition-button.danger.selected {
      border-color: #ff9f98;

      background: #fff0ef;
    }

    .condition-icon {
      flex-shrink: 0;

      font-size: 24px;
    }

    .condition-text {
      flex: 1;
    }

    .condition-title {
      margin-bottom: 3px;

      color: #344e5e;

      font-size: 13px;
      font-weight: 900;
    }

    .condition-description {
      color: #8799a3;

      font-size: 10px;
      line-height: 1.5;
    }


    /* =========================
       혈당
    ========================= */

    .glucose-row {
      display: flex;
      align-items: center;

      gap: 9px;
    }

    .glucose-input {
      flex: 1;
      min-width: 0;

      padding: 14px;

      border: 1px solid #d4e0e7;
      border-radius: 14px;

      background: white;

      font-size: 18px;

      outline: none;
    }

    .glucose-input:focus {
      border-color: #79aeda;
    }

    .unit {
      flex-shrink: 0;

      color: #607d8b;

      font-size: 12px;
    }


    /* =========================
       안내 결과
    ========================= */

    .guidance {
      display: none;

      margin-bottom: 13px;

      padding: 16px;

      border-radius: 18px;

      font-size: 12px;
      line-height: 1.7;
    }

    .guidance.low {
      background: #fff4d7;

      color: #795f20;

      border: 1px solid #f2d786;
    }

    .guidance.high {
      background: #fff0ee;

      color: #9d4e48;

      border: 1px solid #ffc4bf;
    }

    .guidance.danger {
      background: #ffe8e5;

      color: #a33d36;

      border: 2px solid #ffaaa3;
    }

    .guidance.normal {
      background: #edf7ef;

      color: #477359;

      border: 1px solid #cce6d2;
    }

    .guidance-title {
      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 900;
    }


    /* =========================
       타이머
    ========================= */

    .timer-box {
      display: none;

      margin-top: 12px;

      padding: 13px;

      border-radius: 14px;

      background: rgba(255,255,255,.7);

      text-align: center;
    }

    .timer-time {
      margin-bottom: 8px;

      font-size: 25px;
      font-weight: 900;
    }

    .timer-button {
      border: none;
      border-radius: 11px;

      padding: 10px 13px;

      background: #d99628;

      color: white;

      font-size: 11px;
      font-weight: 900;

      cursor: pointer;
    }


    /* =========================
       저장
    ========================= */

    .save-button {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: 15px;

      background: #428dbc;

      color: white;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 6px 15px rgba(66,141,188,.18);
    }

    .save-button:disabled {
      background: #b9c7d0;

      cursor: default;
    }

    .bottom-note {
      margin-top: 15px;

      text-align: center;

      color: #96a4ac;

      font-size: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="page-wrap">


  <!-- 상단 -->

  <div class="top-bar">

    <button
      class="back-button"
      onclick="goBack()">

      ←

    </button>


    <div class="title-area">

      <h1>
        🙂 몸 상태 기록
      </h1>

      <p id="pageSubtitle">
        지금 몸이 어떤지 간단히 알려주세요.
      </p>

    </div>

  </div>



  <!-- STEP 1 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 1
    </div>

    <div class="step-title">
      지금 어떤 상황인가요?
    </div>

    <div class="step-description">
      가장 가까운 것을 골라주세요.
    </div>


    <div class="context-grid">

      <button
        class="context-button full"
        data-context="그냥 지금"
        onclick="selectContext(this)">

        🙂 그냥 지금

      </button>


      <button
        class="context-button"
        data-context="체육 전"
        onclick="selectContext(this)">

        🏃 체육 전

      </button>


      <button
        class="context-button"
        data-context="체육 후"
        onclick="selectContext(this)">

        🏃 체육 후

      </button>


      <button
        class="context-button"
        data-context="쉬는 시간"
        onclick="selectContext(this)">

        ⚽ 쉬는 시간

      </button>


      <button
        class="context-button"
        data-context="현장학습"
        onclick="selectContext(this)">

        🚌 현장학습

      </button>

    </div>

  </div>



  <!-- STEP 2 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 2
    </div>

    <div class="step-title">
      어떤 느낌이 있나요?
    </div>

    <div class="step-description">
      여러 개 골라도 괜찮아요.
    </div>


    <div class="symptom-grid">


      <button
        class="symptom-button"
        data-symptom="식은땀"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">💦</span>
        식은땀

      </button>


      <button
        class="symptom-button"
        data-symptom="손 떨림"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">🤲</span>
        손 떨림

      </button>


      <button
        class="symptom-button"
        data-symptom="창백함"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">😶</span>
        얼굴이 창백해요

      </button>


      <button
        class="symptom-button"
        data-symptom="어지러움"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">😵</span>
        어지러워요

      </button>


      <button
        class="symptom-button"
        data-symptom="행동 변화"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">😕</span>
        평소와 달라요

      </button>


      <button
        class="symptom-button"
        data-symptom="심한 졸림"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">😴</span>
        너무 졸려요

      </button>


      <button
        class="symptom-button"
        data-symptom="심한 갈증"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">🥤</span>
        목이 너무 말라요

      </button>


      <button
        class="symptom-button"
        data-symptom="구토"
        onclick="toggleSymptom(this)">

        <span class="symptom-icon">🤢</span>
        토했어요

      </button>


    </div>

  </div>



  <!-- STEP 3 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 3
    </div>

    <div class="step-title">
      지금 상태는 어떤가요?
    </div>


    <div class="condition-list">


      <button
        class="condition-button"
        data-condition="conscious"
        data-label="의식이 있고 삼킬 수 있음"
        onclick="selectCondition(this)">

        <div class="condition-icon">
          🙂
        </div>

        <div class="condition-text">

          <div class="condition-title">
            말할 수 있고 삼킬 수 있어요
          </div>

          <div class="condition-description">
            의식이 있고 음식이나 음료를 안전하게 삼킬 수 있어요.
          </div>

        </div>

      </button>



      <button
        class="condition-button danger"
        data-condition="danger"
        data-label="의식이 흐리거나 삼키기 어려움"
        onclick="selectCondition(this)">

        <div class="condition-icon">
          🚨
        </div>

        <div class="condition-text">

          <div class="condition-title">
            많이 힘들거나 삼키기 어려워요
          </div>

          <div class="condition-description">
            의식이 흐리거나 반응이 이상하거나 안전하게 삼키기 어려워요.
          </div>

        </div>

      </button>


    </div>

  </div>



  <!-- STEP 4 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 4 · 선택
    </div>

    <div class="step-title">
      혈당도 알고 있나요?
    </div>

    <div class="step-description">
      알고 있으면 입력해요. 몰라도 괜찮아요.
    </div>


    <div class="glucose-row">

      <input
        id="glucoseInput"
        class="glucose-input"
        type="number"
        inputmode="numeric"
        min="20"
        max="600"
        placeholder="예: 120">

      <span class="unit">
        mg/dL
      </span>

    </div>

  </div>



  <!-- 안내 -->

  <div
    id="guidance"
    class="guidance">

    <div
      id="guidanceTitle"
      class="guidance-title">
    </div>

    <div id="guidanceText">
    </div>


    <div
      id="timerBox"
      class="timer-box">

      <div
        id="timerTime"
        class="timer-time">

        15:00

      </div>

      <button
        id="timerButton"
        class="timer-button"
        onclick="startTimer()">

        ⏱️ 15분 타이머 시작

      </button>

    </div>

  </div>



  <button
    id="saveButton"
    class="save-button"
    onclick="saveSymptom()">

    🙂 몸 상태 기록하기

  </button>



  <div class="bottom-note">

    GlucoGuard는 증상을 진단하지 않아요.<br>
    실제 대응은 학생의 개별 관리계획과 학교·의료진 지침을 따라주세요.

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let currentRole =
  null;


let targetStudentId =
  null;


let selectedContext =
  null;


let selectedSymptoms =
  [];


let selectedCondition =
  null;


let selectedConditionLabel =
  null;


let timerInterval =
  null;


let remainingSeconds =
  15 * 60;



/* =========================
   시작
========================= */

window.addEventListener(
  "load",
  async function() {

    const ready =
      await checkLogin();


    if (!ready) {
      return;
    }


    await determineTargetStudent();

  }
);



/* =========================
   로그인
========================= */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "role, nickname"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    profileError ||
    !profile
  ) {

    alert(
      "사용자 정보를 확인하지 못했어요."
    );


    return false;

  }


  currentRole =
    profile.role;


  return true;

}



/* =========================
   기록 대상 결정
========================= */

async function determineTargetStudent() {

  if (
    currentRole === "teacher"
    ||
    currentRole === "nurse"
  ) {

    const selectedStudent =
      sessionStorage.getItem(
        "teacherSelectedStudent"
      );


    if (!selectedStudent) {

      alert(
        "학생을 먼저 선택해주세요."
      );


      location.href =
        "teacher.html";


      return;

    }


    const {
      data: link,
      error
    } =
      await supabaseClient
        .from(
          "teacher_students"
        )
        .select(
          "student_id"
        )
        .eq(
          "teacher_id",
          currentUser.id
        )
        .eq(
          "student_id",
          selectedStudent
        )
        .maybeSingle();


    if (
      error ||
      !link
    ) {

      alert(
        "이 학생을 관리할 권한이 없습니다."
      );


      location.href =
        "teacher.html";


      return;

    }


    targetStudentId =
      selectedStudent;


    const {
      data: studentProfile
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "nickname"
        )
        .eq(
          "id",
          targetStudentId
        )
        .maybeSingle();


    document.getElementById(
      "pageSubtitle"
    ).textContent =
      (
        studentProfile
        &&
        studentProfile.nickname
        ?
        studentProfile.nickname
        :
        "학생"
      )
      +
      " 학생의 상태를 기록해요.";


  } else {

    targetStudentId =
      currentUser.id;

  }

}



/* =========================
   상황 선택
========================= */

function selectContext(
  button
) {

  selectedContext =
    button.dataset.context;


  document.querySelectorAll(
    ".context-button"
  ).forEach(
    item => {

      item.classList.toggle(
        "selected",
        item === button
      );

    }
  );

}



/* =========================
   증상 여러 개 선택
========================= */

function toggleSymptom(
  button
) {

  const symptom =
    button.dataset.symptom;


  if (
    selectedSymptoms.includes(
      symptom
    )
  ) {

    selectedSymptoms =
      selectedSymptoms.filter(
        item =>
          item !== symptom
      );


    button.classList.remove(
      "selected"
    );


  } else {

    selectedSymptoms.push(
      symptom
    );


    button.classList.add(
      "selected"
    );

  }


  updateGuidance();

}



/* =========================
   상태 선택
========================= */

function selectCondition(
  button
) {

  selectedCondition =
    button.dataset.condition;


  selectedConditionLabel =
    button.dataset.label;


  document.querySelectorAll(
    ".condition-button"
  ).forEach(
    item => {

      item.classList.toggle(
        "selected",
        item === button
      );

    }
  );


  updateGuidance();

}



/* =========================
   혈당 입력
========================= */

document.getElementById(
  "glucoseInput"
).addEventListener(
  "input",
  updateGuidance
);



/* =========================
   안내
========================= */

function updateGuidance() {

  const guidance =
    document.getElementById(
      "guidance"
    );


  const title =
    document.getElementById(
      "guidanceTitle"
    );


  const text =
    document.getElementById(
      "guidanceText"
    );


  const timerBox =
    document.getElementById(
      "timerBox"
    );


  const glucoseValue =
    document.getElementById(
      "glucoseInput"
    ).value;


  const glucose =
    glucoseValue === ""
    ?
    null
    :
    Number(
      glucoseValue
    );


  guidance.style.display =
    "none";


  guidance.className =
    "guidance";


  timerBox.style.display =
    "none";


  /*
    의식 저하 / 삼키기 어려움
  */

  if (
    selectedCondition ===
    "danger"
  ) {

    guidance.style.display =
      "block";


    guidance.classList.add(
      "danger"
    );


    title.textContent =
      "🚨 바로 어른의 도움이 필요해요";


    text.innerHTML =
      `
        음식이나 음료를 억지로 먹이지 않아요.<br>
        학생을 혼자 두지 말고 학교의 응급대응 계획을 따라주세요.<br>
        처방된 글루카곤이 있고 교육받은 교직원이 있다면 개별 계획에 따라 대응해요.
      `;


    return;

  }


  /*
    저혈당
  */

  if (
    glucose !== null
    &&
    glucose < 70
  ) {

    guidance.style.display =
      "block";


    guidance.classList.add(
      "low"
    );


    title.textContent =
      "⚠️ 혈당이 낮아요";


    text.innerHTML =
      `
        학생의 개별 저혈당 관리계획을 확인하고 가까운 어른에게 알려주세요.<br>
        의식이 있고 안전하게 삼킬 수 있는 경우에만 개별 계획에 따른 대응을 해요.
      `;


    timerBox.style.display =
      "block";


    return;

  }


  /*
    고혈당
  */

  if (
    glucose !== null
    &&
    glucose >= 250
  ) {

    guidance.style.display =
      "block";


    guidance.classList.add(
      "high"
    );


    title.textContent =
      "⚠️ 혈당이 높아요";


    text.innerHTML =
      `
        학생의 개별 고혈당 관리계획을 확인하고 선생님이나 보건교사에게 알려주세요.<br>
        구토나 심한 이상 증상이 함께 있다면 더 빠른 확인이 필요해요.
      `;


    return;

  }


  /*
    구토
  */

  if (
    selectedSymptoms.includes(
      "구토"
    )
  ) {

    guidance.style.display =
      "block";


    guidance.classList.add(
      "high"
    );


    title.textContent =
      "🤢 구토가 기록됐어요";


    text.innerHTML =
      `
        구토가 있으면 가까운 선생님이나 보건교사에게 바로 알려주세요.<br>
        학생의 개별 관리계획에 따라 상태를 확인해요.
      `;


    return;

  }


  /*
    특별한 위험 경고 없음
  */

  if (
    selectedSymptoms.length > 0
    ||
    selectedCondition
    ||
    glucose !== null
  ) {

    guidance.style.display =
      "block";


    guidance.classList.add(
      "normal"
    );


    title.textContent =
      "💙 상태를 기록하고 있어요";


    text.textContent =
      "몸이 더 이상해지거나 불편해지면 가까운 선생님에게 바로 알려주세요.";

  }

}



/* =========================
   15분 타이머
========================= */

function startTimer() {

  if (
    timerInterval
  ) {

    clearInterval(
      timerInterval
    );

  }


  remainingSeconds =
    15 * 60;


  updateTimerDisplay();


  document.getElementById(
    "timerButton"
  ).textContent =
    "타이머 진행 중";


  timerInterval =
    setInterval(
      function() {

        remainingSeconds--;


        updateTimerDisplay();


        if (
          remainingSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );


          timerInterval =
            null;


          document.getElementById(
            "timerButton"
          ).textContent =
            "⏱️ 15분 타이머 다시 시작";


          playAlarm();


          alert(
            "15분이 지났어요. 개별 관리계획에 따라 다시 확인해주세요."
          );

        }

      },
      1000
    );

}



function updateTimerDisplay() {

  const minutes =
    Math.floor(
      remainingSeconds / 60
    );


  const seconds =
    remainingSeconds % 60;


  document.getElementById(
    "timerTime"
  ).textContent =
    String(
      minutes
    ).padStart(
      2,
      "0"
    )
    +
    ":"
    +
    String(
      seconds
    ).padStart(
      2,
      "0"
    );

}



function playAlarm() {

  try {

    const AudioContext =
      window.AudioContext
      ||
      window.webkitAudioContext;


    const context =
      new AudioContext();


    const oscillator =
      context.createOscillator();


    oscillator.connect(
      context.destination
    );


    oscillator.frequency.value =
      880;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

      },
      800
    );


  } catch (error) {

    console.error(
      error
    );

  }


  if (
    "speechSynthesis" in window
  ) {

    const message =
      new SpeechSynthesisUtterance(
        "15분이 지났어요. 다시 확인해주세요."
      );


    message.lang =
      "ko-KR";


    window.speechSynthesis.speak(
      message
    );

  }

}



/* =========================
   저장
========================= */

async function saveSymptom() {

  if (!selectedContext) {

    alert(
      "지금 어떤 상황인지 골라주세요."
    );


    return;

  }


  if (
    selectedSymptoms.length === 0
  ) {

    alert(
      "지금 느끼는 증상을 하나 이상 골라주세요."
    );


    return;

  }


  if (!selectedCondition) {

    alert(
      "지금 상태를 골라주세요."
    );


    return;

  }


  const glucoseValue =
    document.getElementById(
      "glucoseInput"
    ).value;


  const glucose =
    glucoseValue === ""
    ?
    null
    :
    Number(
      glucoseValue
    );


  if (
    glucose !== null
    &&
    (
      glucose < 20
      ||
      glucose > 600
    )
  ) {

    alert(
      "혈당 수치를 다시 확인해주세요."
    );


    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;


  button.textContent =
    "기록 중...";


  const noteData =
    {

      context:
        selectedContext,

      symptoms:
        selectedSymptoms,

      condition:
        selectedCondition,

      conditionLabel:
        selectedConditionLabel,

      recordedBy:
        (
          currentRole === "teacher"
          ||
          currentRole === "nurse"
        )
        ?
        "teacher"
        :
        "student"

    };


  const {
    error
  } =
    await supabaseClient
      .from("records")
      .insert({

        user_id:
          targetStudentId,

        record_type:
          "symptom",

        glucose_value:
          glucose,

        meal_type:
          null,

        planned_carbs:
          null,

        intake_ratio:
          null,

        estimated_carbs:
          null,

        note:
          JSON.stringify(
            noteData
          )

      });


  button.disabled =
    false;


  button.textContent =
    "🙂 몸 상태 기록하기";


  if (error) {

    console.error(
      error
    );


    alert(
      "몸 상태 기록을 저장하지 못했어요."
    );


    return;

  }


  alert(
    "몸 상태를 기록했어요. 🙂"
  );


  if (
    currentRole === "teacher"
    ||
    currentRole === "nurse"
  ) {

    location.href =
      "teacher.html";


  } else {

    location.href =
      "index.html";

  }

}



/* =========================
   뒤로가기
========================= */

function goBack() {

  if (
    currentRole === "teacher"
    ||
    currentRole === "nurse"
  ) {

    location.href =
      "teacher.html";


  } else {

    location.href =
      "index.html";

  }

}
