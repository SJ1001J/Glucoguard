<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>GlucoGuard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f8fb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #385566;
    }

    button {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    /* 데모 */

    .demo-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 12px;
      padding: 11px 13px;

      border-radius: 15px;

      background: #fff4ce;
      color: #896b24;

      font-size: 11px;
      font-weight: 800;
    }

    .demo-banner.show {
      display: flex;
    }

    .demo-switch-button {
      border: none;
      border-radius: 10px;

      padding: 9px 11px;

      background: white;
      color: #356b91;

      font-size: 10px;
      font-weight: 900;

      cursor: pointer;
    }

    /* 프로필 */

    .header-card {
      padding: 20px;
      margin-bottom: 15px;

      border-radius: 24px;

      background: white;

      box-shadow:
        0 6px 20px rgba(56,83,99,.06);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 60px;
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 19px;

      background: #fff1c8;

      font-size: 34px;
    }

    .hello {
      margin-bottom: 4px;

      color: #81929c;

      font-size: 11px;
    }

    .student-name {
      color: #385768;

      font-size: 20px;
      font-weight: 900;
    }

    .student-class {
      margin-top: 4px;

      color: #8b9ba4;

      font-size: 10px;
    }

    .logout-button {
      border: none;
      border-radius: 11px;

      padding: 9px 10px;

      background: #f4f6f7;
      color: #778992;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;
    }

    /* 상태 */

    .status-card {
      margin-bottom: 15px;
      padding: 17px;

      border-radius: 21px;

      background: #e8f8f2;
      color: #407565;
    }

    .status-title {
      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 900;
    }

    .status-description {
      font-size: 11px;
      line-height: 1.6;
    }

    /* 도움요청 */

    .help-button {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 14px;

      margin-bottom: 14px;
      padding: 17px;

      border: none;
      border-radius: 20px;

      background: #ffe5e1;
      color: #a64b44;

      text-align: left;

      cursor: pointer;
    }

    .help-icon {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 16px;

      background: rgba(255,255,255,.75);

      font-size: 28px;
    }

    .help-text {
      flex: 1;
    }

    .help-title {
      margin-bottom: 4px;

      font-size: 15px;
      font-weight: 900;
    }

    .help-description {
      font-size: 10px;
      line-height: 1.5;

      opacity: .85;
    }

    .arrow {
      font-size: 22px;
      opacity: .5;
    }

    /* 기록 메뉴 */

    .menu-title {
      margin: 21px 0 10px 3px;

      color: #607986;

      font-size: 12px;
      font-weight: 900;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu-button {
      min-height: 145px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;

      padding: 17px;

      border: none;
      border-radius: 21px;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 5px 15px rgba(56,83,99,.05);
    }

    .menu-icon {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(255,255,255,.82);

      font-size: 27px;
    }

    .menu-name {
      margin-top: 15px;

      font-size: 14px;
      font-weight: 900;
    }

    .menu-description {
      margin-top: 4px;

      font-size: 9px;
      line-height: 1.45;

      opacity: .8;
    }

    .meal-menu {
      background: #fff3d9;
      color: #806327;
    }

    .glucose-menu {
      background: #e7f2ff;
      color: #376b91;
    }

    .symptom-menu {
      background: #e5f7ef;
      color: #397361;
    }

    .records-menu {
      background: #f0edff;
      color: #635b91;
    }

    /* 인슐린 */

    .insulin-button {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 14px;

      margin-top: 10px;
      padding: 16px;

      border: none;
      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #eeeaff,
          #f4efff
        );

      color: #655b98;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 5px 15px rgba(56,83,99,.05);
    }

    .insulin-icon {
      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 16px;

      background: white;

      font-size: 29px;
    }

    .insulin-content {
      flex: 1;
    }

    .insulin-title {
      margin-bottom: 4px;

      font-size: 14px;
      font-weight: 900;
    }

    .insulin-description {
      font-size: 10px;
      line-height: 1.5;

      opacity: .82;
    }

    .insulin-badge {
      display: inline-block;

      margin-top: 7px;
      padding: 4px 7px;

      border-radius: 8px;

      background: rgba(255,255,255,.75);

      font-size: 8px;
      font-weight: 900;
    }

    /* 연락처 */

    .other-contact-button {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: 11px;
      padding: 14px;

      border: none;
      border-radius: 17px;

      background: white;
      color: #607783;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(56,83,99,.04);
    }

    .contact-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 13px;

      background: #f4f6f8;

      font-size: 21px;
    }

    .contact-text {
      flex: 1;
    }

    .contact-title {
      margin-bottom: 3px;

      font-size: 12px;
      font-weight: 900;
    }

    .contact-description {
      color: #8a9ba4;

      font-size: 9px;
    }

  </style>

</head>


<body>

<div class="page">

  <div
    id="demoBanner"
    class="demo-banner">

    <div>
      ⭐ 체험 모드 · 👧 학생 화면
    </div>

    <button
      class="demo-switch-button"
      onclick="switchToDemoTeacher()">

      👩‍🏫 교직원 화면

    </button>

  </div>


  <div class="header-card">

    <div class="header-top">

      <div class="profile">

        <div
          id="studentAvatar"
          class="avatar">

          🐻

        </div>

        <div>

          <div class="hello">
            안녕! 👋
          </div>

          <div
            id="studentName"
            class="student-name">

            학생

          </div>

          <div
            id="studentClass"
            class="student-class">

            정보를 불러오는 중...

          </div>

        </div>

      </div>


      <button
        class="logout-button"
        onclick="logout()">

        로그아웃

      </button>

    </div>

  </div>


  <div class="status-card">

    <div class="status-title">
      🙂 오늘 몸 상태는 어때?
    </div>

    <div class="status-description">
      몸이 평소와 다르거나 이상한 느낌이 들면
      선생님에게 알려주고 몸 상태를 기록해줘.
    </div>

  </div>


  <button
    class="help-button"
    onclick="callTeacher()">

    <div class="help-icon">
      🚨
    </div>

    <div class="help-text">

      <div class="help-title">
        선생님, 도와주세요!
      </div>

      <div class="help-description">
        도움이 필요하면 담당 선생님께 바로 연락해요.
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>


  <div class="menu-title">
    내가 기록하기
  </div>


  <div class="menu-grid">

    <button
      class="menu-button meal-menu"
      onclick="goMeal()">

      <div class="menu-icon">
        🍱
      </div>

      <div>

        <div class="menu-name">
          먹은 거 기록
        </div>

        <div class="menu-description">
          점심이나 간식을 얼마나 먹었는지 기록해요.
        </div>

      </div>

    </button>


    <button
      class="menu-button glucose-menu"
      onclick="goGlucose()">

      <div class="menu-icon">
        🩸
      </div>

      <div>

        <div class="menu-name">
          혈당 기록
        </div>

        <div class="menu-description">
          확인한 혈당 수치를 간단하게 기록해요.
        </div>

      </div>

    </button>


    <button
      class="menu-button symptom-menu"
      onclick="goSymptom()">

      <div class="menu-icon">
        🙂
      </div>

      <div>

        <div class="menu-name">
          몸 상태 기록
        </div>

        <div class="menu-description">
          어지럽거나 이상한 느낌이 있으면 알려줘요.
        </div>

      </div>

    </button>


    <button
      class="menu-button records-menu"
      onclick="goRecords()">

      <div class="menu-icon">
        📒
      </div>

      <div>

        <div class="menu-name">
          내 기록 보기
        </div>

        <div class="menu-description">
          내가 기록한 내용을 다시 확인해요.
        </div>

      </div>

    </button>

  </div>


  <button
    class="insulin-button"
    onclick="goInsulin()">

    <div class="insulin-icon">
      💉
    </div>

    <div class="insulin-content">

      <div class="insulin-title">
        인슐린 기록
      </div>

      <div class="insulin-description">
        실제로 투여한 시간, 종류, Unit과 투여 위치를 기록해요.
      </div>

      <div class="insulin-badge">
        💉 투여 기록
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>


  <button
    class="other-contact-button"
    onclick="goEmergencyContacts()">

    <div class="contact-icon">
      📞
    </div>

    <div class="contact-text">

      <div class="contact-title">
        다른 연락처
      </div>

      <div class="contact-description">
        보호자나 보건실 연락처를 확인해요.
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser = null;
let currentProfile = null;
let isDemoStudent = false;


window.addEventListener(
  "load",
  async function() {

    await loadStudent();

  }
);


async function loadStudent() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (!data.session) {

    window.location.href =
      "./login.html";

    return;
  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nickname,class_name,avatar,role"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    error
    ||
    !profile
  ) {

    alert(
      "사용자 정보를 불러오지 못했습니다."
    );

    await logout();

    return;
  }


  currentProfile =
    profile;


  if (
    profile.role === "student"
  ) {

    isDemoStudent =
      false;

    showStudentProfile();

    return;
  }


  if (
    profile.role === "demo"
  ) {

    const demoMode =
      sessionStorage.getItem(
        "demoMode"
      );


    if (
      demoMode !== "student"
    ) {

      window.location.href =
        "./teacher.html";

      return;
    }


    isDemoStudent =
      true;


    document.getElementById(
      "demoBanner"
    ).classList.add(
      "show"
    );


    showStudentProfile();

    return;
  }


  if (
    profile.role === "teacher"
    ||
    profile.role === "nurse"
  ) {

    window.location.href =
      "./teacher.html";

    return;
  }


  window.location.href =
    "./login.html";

}


function showStudentProfile() {

  document.getElementById(
    "studentAvatar"
  ).textContent =
    currentProfile.avatar
    ||
    "🐻";


  document.getElementById(
    "studentName"
  ).textContent =
    currentProfile.nickname
    ||
    "학생";


  document.getElementById(
    "studentClass"
  ).textContent =
    isDemoStudent
    ?
    "학생 화면 체험 중"
    :
    (
      currentProfile.class_name
      ||
      "학급 정보 없음"
    );

}


function goMeal() {

  window.location.href =
    "./meal.html";

}


function goGlucose() {

  window.location.href =
    "./glucose.html";

}


function goSymptom() {

  window.location.href =
    "./symptom.html";

}


function goInsulin() {

  window.location.href =
    "./insulin.html";

}


function goRecords() {

  sessionStorage.removeItem(
    "teacherSelectedStudent"
  );

  window.location.href =
    "./records.html";

}


function goEmergencyContacts() {

  window.location.href =
    "./emergency.html";

}


function switchToDemoTeacher() {

  if (
    !isDemoStudent
  ) {

    return;
  }


  sessionStorage.setItem(
    "demoMode",
    "teacher"
  );


  sessionStorage.removeItem(
    "teacherSelectedStudent"
  );


  window.location.href =
    "./teacher.html";

}


async function callTeacher() {

  if (
    isDemoStudent
  ) {

    window.location.href =
      "./emergency.html";

    return;
  }


  const {
    data: links,
    error
  } =
    await supabaseClient
      .from("teacher_students")
      .select(
        "teacher_id"
      )
      .eq(
        "student_id",
        currentUser.id
      )
      .limit(1);


  if (
    error
    ||
    !links
    ||
    links.length === 0
  ) {

    window.location.href =
      "./emergency.html";

    return;
  }


  const teacherId =
    links[0].teacher_id;


  const {
    data: teacher
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "nickname,phone_number"
      )
      .eq(
        "id",
        teacherId
      )
      .maybeSingle();


  if (
    !teacher
    ||
    !teacher.phone_number
  ) {

    window.location.href =
      "./emergency.html";

    return;
  }


  const confirmed =
    confirm(
      `${teacher.nickname || "담당 선생님"}에게 전화할까요?`
    );


  if (
    !confirmed
  ) {

    return;
  }


  window.location.href =
    "tel:"
    +
    teacher.phone_number.replace(
      /[^0-9+]/g,
      ""
    );

}


async function logout() {

  sessionStorage.removeItem(
    "demoMode"
  );


  sessionStorage.removeItem(
    "teacherSelectedStudent"
  );


  await supabaseClient.auth
    .signOut();


  window.location.href =
    "./login.html";

}

</script>


</body>

</html>
