<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>GlucoGuard</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5faff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #263238;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 18px 38px;
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      border-radius: 50%;

      font-size: 38px;

      box-shadow:
        0 8px 22px rgba(64, 99, 120, .10);
    }

    .hero h1 {
      margin: 0;
      color: #245978;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #68869a;
      font-size: 14px;
      line-height: 1.7;
    }

    .student-login-card {
      background: white;
      border-radius: 19px;
      padding: 12px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 15px;

      box-shadow:
        0 5px 16px rgba(70, 95, 110, .06);
    }

    .student-login-left {
      min-width: 0;
    }

    .student-login-badge {
      display: inline-block;
      padding: 5px 9px;
      margin-bottom: 4px;
      border-radius: 8px;
      background: #edf5ff;
      color: #3974a2;
      font-size: 11px;
      font-weight: 800;
    }

    .student-email {
      color: #6e8797;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-button {
      flex-shrink: 0;
      border: none;
      border-radius: 11px;
      padding: 10px 12px;
      background: #fff0ee;
      color: #ae554e;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .profile-card {
      background: white;
      border-radius: 24px;
      padding: 17px;
      margin-bottom: 15px;

      box-shadow:
        0 6px 18px rgba(70, 95, 110, .07);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .profile-avatar {
      width: 70px;
      height: 70px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;
      background: #fff1c8;
      font-size: 39px;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-label {
      color: #718b9d;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .profile-name {
      color: #263f50;
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .profile-class {
      color: #7b919e;
      font-size: 12px;
    }

    .profile-edit-button {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: #f3f6f8;
      color: #5f7888;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .profile-bottom {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
      margin-top: 15px;
    }

    .profile-stat {
      padding: 11px;
      border-radius: 14px;
      background: #f5f8fa;
    }

    .profile-stat-label {
      color: #8196a3;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .profile-stat-value {
      color: #316b94;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
    }

    .records-button {
      width: 100%;
      border: none;
      border-radius: 17px;
      padding: 14px;
      margin-bottom: 14px;
      background: #eaf3ff;
      color: #245978;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-card {
      width: 100%;
      min-height: 80px;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 14px 15px;

      border: none;
      border-radius: 21px;

      text-align: left;
      cursor: pointer;
    }

    .menu-card .icon-box {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,.78);
      border-radius: 15px;
      font-size: 25px;
    }

    .menu-text {
      flex: 1;
      min-width: 0;
    }

    .menu-text strong {
      display: block;
      color: #263238;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .menu-text span {
      display: block;
      color: #708794;
      font-size: 11px;
      line-height: 1.45;
    }

    .arrow {
      color: #8aa7b7;
      font-size: 29px;
    }

    .meal {
      background: #fff4cf;
    }

    .glucose {
      background: #e8f2ff;
    }

    .exercise {
      background: #eaf9ee;
    }

    .symptom {
      background: #ffeded;
    }

    .help {
      background: #ffe8e5;
      border: 2px solid #ffbeb8;
    }

    .help .menu-text strong {
      color: #c8443d;
    }

    .profile-setup {
      display: none;
      background: white;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 15px;

      box-shadow:
        0 5px 16px rgba(70,95,110,.07);
    }

    .profile-setup h2 {
      margin: 0 0 7px;
      color: #37474f;
      font-size: 18px;
    }

    .profile-setup p {
      margin: 0 0 13px;
      color: #78909c;
      font-size: 12px;
      line-height: 1.5;
    }

    .setup-input {
      width: 100%;
      border: 1px solid #d8e2e8;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 9px;
      font-size: 14px;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 3px 0 12px;
    }

    .avatar-option {
      border: 2px solid transparent;
      border-radius: 13px;
      padding: 9px;
      background: #f6f8fa;
      font-size: 25px;
      cursor: pointer;
    }

    .avatar-option.selected {
      border-color: #79aeda;
      background: #eaf4ff;
    }

    .setup-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      background: #4285b4;
      color: white;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .footer-note {
      margin-top: 21px;
      padding: 12px;
      text-align: center;
      color: #899da9;
      font-size: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="hero">

    <div class="hero-icon">
      🌈
    </div>

    <h1>GlucoGuard</h1>

    <p class="subtitle">
      학교에서 안전하게<br>
      나의 하루를 기록해요.
    </p>

  </div>



  <div class="student-login-card">

    <div class="student-login-left">

      <div class="student-login-badge">
        👧 학생 로그인
      </div>

      <div
        id="loginEmail"
        class="student-email">

        로그인 확인 중...

      </div>

    </div>

    <button
      class="logout-button"
      onclick="logout()">

      로그아웃

    </button>

  </div>



  <div
    id="profileSetup"
    class="profile-setup">

    <h2 id="profileSetupTitle">
      🌟 나의 Gluco 친구 만들기
    </h2>

    <p id="profileSetupDescription">
      이름과 반, 함께할 친구를 골라주세요.
    </p>

    <input
      id="setupNickname"
      class="setup-input"
      type="text"
      maxlength="20"
      placeholder="이름 또는 별명">

    <input
      id="setupClass"
      class="setup-input"
      type="text"
      maxlength="30"
      placeholder="예: 3학년 4반">

    <div class="avatar-grid">

      <button
        type="button"
        class="avatar-option selected"
        data-avatar="🐻"
        onclick="selectAvatar(this)">
        🐻
      </button>

      <button
        type="button"
        class="avatar-option"
        data-avatar="🐱"
        onclick="selectAvatar(this)">
        🐱
      </button>

      <button
        type="button"
        class="avatar-option"
        data-avatar="🐰"
        onclick="selectAvatar(this)">
        🐰
      </button>

      <button
        type="button"
        class="avatar-option"
        data-avatar="🐶"
        onclick="selectAvatar(this)">
        🐶
      </button>

    </div>

    <button
      id="profileSaveButton"
      class="setup-button"
      onclick="saveProfile()">

      친구 만들기 ✨

    </button>

  </div>



  <div
    id="profileCard"
    class="profile-card"
    style="display:none;">

    <div class="profile-top">

      <div
        id="profileAvatar"
        class="profile-avatar">
        🐻
      </div>

      <div class="profile-info">

        <div class="profile-label">
          🌟 나의 Gluco 친구
        </div>

        <div
          id="profileName"
          class="profile-name">
          -
        </div>

        <div
          id="profileClass"
          class="profile-class">
          -
        </div>

      </div>

      <button
        class="profile-edit-button"
        onclick="editProfile()">

        수정

      </button>

    </div>


    <div class="profile-bottom">

      <div class="profile-stat">

        <div class="profile-stat-label">
          오늘 기록
        </div>

        <div
          id="todayRecordCount"
          class="profile-stat-value">
          0회
        </div>

      </div>

      <div class="profile-stat">

        <div class="profile-stat-label">
          오늘 목표
        </div>

        <div class="profile-stat-value">
          안전하게 기록하기 💙
        </div>

      </div>

    </div>

  </div>



  <button
    id="recordsButton"
    class="records-button"
    style="display:none;"
    onclick="location.href='records.html'">

    📊 내 기록 보기

  </button>



  <div class="menu">

    <button
      class="menu-card meal"
      onclick="location.href='meal.html'">

      <div class="icon-box">🍱</div>

      <div class="menu-text">
        <strong>먹은 거 기록</strong>
        <span>오늘 먹은 양을 간단히 남겨요</span>
      </div>

      <div class="arrow">›</div>

    </button>



    <button
      class="menu-card glucose"
      onclick="location.href='glucose.html'">

      <div class="icon-box">🩸</div>

      <div class="menu-text">
        <strong>혈당 기록</strong>
        <span>혈당 또는 CGM 수치를 기록해요</span>
      </div>

      <div class="arrow">›</div>

    </button>



    <button
      class="menu-card exercise"
      onclick="location.href='activity.html'">

      <div class="icon-box">🏃</div>

      <div class="menu-text">
        <strong>체육·활동 기록</strong>
        <span>체육 전후와 몸 상태를 기록해요</span>
      </div>

      <div class="arrow">›</div>

    </button>



    <button
      class="menu-card symptom"
      onclick="location.href='symptom.html'">

      <div class="icon-box">🙂</div>

      <div class="menu-text">
        <strong>몸 상태 기록</strong>
        <span>지금 느끼는 증상과 상태를 알려요</span>
      </div>

      <div class="arrow">›</div>

    </button>



    <button
      id="teacherHelpButton"
      class="menu-card help"
      onclick="callTeacherDirectly()">

      <div class="icon-box">🚨</div>

      <div class="menu-text">

        <strong>
          선생님, 도와주세요!
        </strong>

        <span>
          누르면 담당 선생님에게 바로 전화해요
        </span>

      </div>

      <div class="arrow">›</div>

    </button>

  </div>



  <div class="footer-note">
    GlucoGuard는 학교생활을 돕기 위한 교육용 프로토타입입니다.<br>
    실제 치료와 응급대응은 학생의 개별 관리계획과 의료진의 지침을 따라주세요.
  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser = null;
let currentProfile = null;
let selectedAvatar = "🐻";



window.addEventListener(
  "load",
  async function() {

    const ready =
      await checkLogin();

    if (!ready) {
      return;
    }

    await loadProfile();
    await loadTodayRecordCount();

  }
);



async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();

  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";

    return false;
  }

  currentUser =
    data.session.user;

  document.getElementById(
    "loginEmail"
  ).textContent =
    currentUser.email ||
    "학생 계정";

  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if (
    profile &&
    (
      profile.role === "teacher"
      ||
      profile.role === "nurse"
    )
  ) {

    location.href =
      "teacher.html";

    return false;
  }

  return true;

}



async function callTeacherDirectly() {

  if (!currentUser) {

    alert(
      "로그인 정보를 확인하고 있어요."
    );

    return;
  }


  const button =
    document.getElementById(
      "teacherHelpButton"
    );


  button.disabled =
    true;


  try {

    const {
      data: links,
      error: linkError
    } =
      await supabaseClient
        .from("teacher_students")
        .select("teacher_id")
        .eq(
          "student_id",
          currentUser.id
        );


    if (linkError) {

      throw linkError;

    }


    if (
      !links ||
      links.length === 0
    ) {

      alert(
        "연결된 담당 선생님이 없어요.\n다른 연락처를 확인할게요."
      );


      location.href =
        "emergency.html";


      return;

    }


    const teacherIds =
      links.map(
        item =>
          item.teacher_id
      );


    const {
      data: teachers,
      error: teacherError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, nickname, role, phone_number"
        )
        .in(
          "id",
          teacherIds
        );


    if (teacherError) {

      throw teacherError;

    }


    const teacher =
      (teachers || [])
        .find(
          item =>
            item.phone_number
        );


    if (!teacher) {

      alert(
        "담당 선생님의 전화번호가 아직 등록되지 않았어요.\n보호자 연락처를 확인할게요."
      );


      location.href =
        "emergency.html";


      return;

    }


    const confirmed =
      confirm(
        (teacher.nickname || "담당 선생님")
        +
        "에게 전화할까요?\n\n"
        +
        teacher.phone_number
      );


    if (!confirmed) {
      return;
    }


    const cleanedPhone =
      teacher.phone_number.replace(
        /[^0-9+]/g,
        ""
      );


    location.href =
      "tel:"
      +
      cleanedPhone;


  } catch (error) {

    console.error(
      error
    );


    alert(
      "담당 선생님 정보를 확인하지 못했어요.\n다른 연락처를 확인해주세요."
    );


    location.href =
      "emergency.html";


  } finally {

    button.disabled =
      false;

  }

}



async function loadProfile() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, nickname, class_name, avatar, role"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (error) {

    alert(
      "프로필 정보를 불러오지 못했어요."
    );

    return;
  }


  if (!data) {

    currentProfile =
      null;

    showProfileSetup();

    return;
  }


  currentProfile =
    data;

  showProfileCard();

}



function showProfileCard() {

  document.getElementById(
    "profileSetup"
  ).style.display =
    "none";

  document.getElementById(
    "profileCard"
  ).style.display =
    "block";

  document.getElementById(
    "recordsButton"
  ).style.display =
    "block";

  document.getElementById(
    "profileAvatar"
  ).textContent =
    currentProfile.avatar ||
    "🐻";

  document.getElementById(
    "profileName"
  ).textContent =
    currentProfile.nickname ||
    "학생";

  document.getElementById(
    "profileClass"
  ).textContent =
    currentProfile.class_name ||
    "학년 · 반 미등록";

}



function showProfileSetup() {

  document.getElementById(
    "profileCard"
  ).style.display =
    "none";

  document.getElementById(
    "recordsButton"
  ).style.display =
    "none";

  document.getElementById(
    "profileSetup"
  ).style.display =
    "block";


  if (currentProfile) {

    document.getElementById(
      "profileSetupTitle"
    ).textContent =
      "✏️ 내 정보 수정";

    document.getElementById(
      "profileSaveButton"
    ).textContent =
      "수정 완료";

    document.getElementById(
      "setupNickname"
    ).value =
      currentProfile.nickname ||
      "";

    document.getElementById(
      "setupClass"
    ).value =
      currentProfile.class_name ||
      "";

    selectedAvatar =
      currentProfile.avatar ||
      "🐻";

  } else {

    selectedAvatar =
      "🐻";

  }


  updateAvatarSelection();

}



function editProfile() {

  showProfileSetup();

}



function selectAvatar(
  button
) {

  selectedAvatar =
    button.dataset.avatar;

  updateAvatarSelection();

}



function updateAvatarSelection() {

  document.querySelectorAll(
    ".avatar-option"
  ).forEach(
    function(button) {

      button.classList.toggle(
        "selected",
        button.dataset.avatar ===
        selectedAvatar
      );

    }
  );

}



async function saveProfile() {

  const nickname =
    document.getElementById(
      "setupNickname"
    ).value.trim();

  const className =
    document.getElementById(
      "setupClass"
    ).value.trim();


  if (!nickname) {

    alert(
      "이름 또는 별명을 입력해주세요."
    );

    return;
  }


  if (!className) {

    alert(
      "학년과 반을 입력해주세요."
    );

    return;
  }


  if (!currentProfile) {

    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .insert({

          id:
            currentUser.id,

          nickname:
            nickname,

          class_name:
            className,

          avatar:
            selectedAvatar,

          role:
            "student",

          updated_at:
            new Date()
              .toISOString()

        });


    if (error) {

      alert(
        "프로필을 저장하지 못했어요."
      );

      return;
    }

  } else {

    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .update({

          nickname:
            nickname,

          class_name:
            className,

          avatar:
            selectedAvatar,

          updated_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          currentUser.id
        );


    if (error) {

      alert(
        "프로필을 수정하지 못했어요."
      );

      return;
    }

  }


  await loadProfile();

}



async function loadTodayRecordCount() {

  const now =
    new Date();

  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const end =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );


  const {
    count
  } =
    await supabaseClient
      .from("records")
      .select(
        "*",
        {
          count:
            "exact",

          head:
            true
        }
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .gte(
        "created_at",
        start.toISOString()
      )
      .lt(
        "created_at",
        end.toISOString()
      );


  document.getElementById(
    "todayRecordCount"
  ).textContent =
    (count || 0)
    +
    "회";

}



async function logout() {

  await supabaseClient.auth
    .signOut();

  location.href =
    "login.html";

}

</script>
