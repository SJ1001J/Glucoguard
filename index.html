<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>GlucoGuard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #f4f8fb;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #385566;
}

button,
a {
  font-family: inherit;
}

a {
  text-decoration: none;
}

.page {
  width: 100%;
  max-width: 600px;

  margin: 0 auto;

  padding: 20px 18px 40px;
}


/* =========================
   데모
========================= */

.demo-banner {
  display: none;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 12px;

  padding: 11px 13px;

  border-radius: 15px;

  background: #fff4ce;

  color: #896b24;

  font-size: 11px;
  font-weight: 800;
}

.demo-banner.show {
  display: flex;
}

.demo-switch-button {
  border: none;

  border-radius: 10px;

  padding: 9px 11px;

  background: white;

  color: #356b91;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


/* =========================
   프로필
========================= */

.header-card {
  padding: 20px;

  margin-bottom: 15px;

  border-radius: 24px;

  background: white;

  box-shadow:
    0 6px 20px rgba(56,83,99,.06);
}

.header-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.profile {
  display: flex;

  align-items: center;

  gap: 12px;
}

.avatar {
  width: 60px;
  height: 60px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 19px;

  background: #fff1c8;

  font-size: 34px;
}

.hello {
  margin-bottom: 4px;

  color: #81929c;

  font-size: 11px;
}

.student-name {
  color: #385768;

  font-size: 20px;
  font-weight: 900;
}

.student-class {
  margin-top: 4px;

  color: #8b9ba4;

  font-size: 10px;
}

.logout-button {
  border: none;

  border-radius: 11px;

  padding: 9px 10px;

  background: #f4f6f7;

  color: #778992;

  font-size: 10px;
  font-weight: 800;

  cursor: pointer;
}


/* =========================
   몸 상태
========================= */

.status-card {
  margin-bottom: 15px;

  padding: 17px;

  border-radius: 21px;

  background: #e8f8f2;

  color: #407565;
}

.status-title {
  margin-bottom: 7px;

  font-size: 14px;
  font-weight: 900;
}

.status-description {
  font-size: 11px;
  line-height: 1.6;
}


/* =========================
   도움 요청
========================= */

.help-button {
  width: 100%;

  display: flex;

  align-items: center;

  gap: 14px;

  margin-bottom: 14px;

  padding: 17px;

  border: none;

  border-radius: 20px;

  background: #ffe5e1;

  color: #a64b44;

  text-align: left;

  cursor: pointer;
}

.help-icon {
  width: 52px;
  height: 52px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 16px;

  background: rgba(255,255,255,.75);

  font-size: 28px;
}

.help-text {
  flex: 1;
}

.help-title {
  margin-bottom: 4px;

  font-size: 15px;
  font-weight: 900;
}

.help-description {
  font-size: 10px;
  line-height: 1.5;

  opacity: .85;
}

.arrow {
  font-size: 22px;

  opacity: .5;
}


/* =========================
   나의 응급정보
========================= */

.emergency-info-card {
  display: none;

  margin-bottom: 15px;

  border-radius: 21px;

  background: #fff1ef;

  color: #8f4b45;

  overflow: hidden;

  box-shadow:
    0 5px 15px rgba(56,83,99,.04);
}

.emergency-info-card.show {
  display: block;
}

.emergency-info-toggle {
  width: 100%;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  padding: 16px 17px;

  border: none;

  background: transparent;

  color: inherit;

  text-align: left;

  cursor: pointer;
}

.emergency-info-heading {
  flex: 1;
}

.emergency-info-title {
  font-size: 15px;
  font-weight: 900;
}

.emergency-info-sub {
  margin-top: 3px;

  color: #a57a75;

  font-size: 9px;
  line-height: 1.5;
}

.emergency-info-right {
  display: flex;

  align-items: center;

  gap: 8px;

  flex-shrink: 0;
}

.emergency-info-badge {
  padding: 5px 8px;

  border-radius: 9px;

  background: rgba(255,255,255,.82);

  color: #9d5a54;

  font-size: 8px;
  font-weight: 900;
}

.emergency-info-arrow {
  width: 20px;

  color: #ad7771;

  font-size: 18px;
  font-weight: 900;

  text-align: center;

  transition: transform .2s ease;
}

.emergency-info-card.open
.emergency-info-arrow {
  transform: rotate(180deg);
}

.emergency-info-body {
  display: none;

  padding:
    0
    17px
    17px;
}

.emergency-info-card.open
.emergency-info-body {
  display: block;
}

.emergency-info-list {
  display: grid;

  gap: 8px;
}

.emergency-info-item {
  padding: 11px 12px;

  border-radius: 13px;

  background: rgba(255,255,255,.82);
}

.emergency-info-label {
  margin-bottom: 4px;

  color: #aa7771;

  font-size: 9px;
  font-weight: 900;
}

.emergency-info-value {
  color: #705450;

  font-size: 11px;
  font-weight: 800;

  line-height: 1.55;

  word-break: keep-all;
}

.emergency-info-empty {
  padding: 12px;

  border-radius: 13px;

  background: rgba(255,255,255,.82);

  color: #8e716d;

  font-size: 10px;
  line-height: 1.6;
}


/* =========================
   기록 메뉴
========================= */

.menu-title {
  margin:
    21px
    0
    10px
    3px;

  color: #607986;

  font-size: 12px;
  font-weight: 900;
}

.menu-grid {
  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 10px;
}

.menu-button {
  min-height: 145px;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  justify-content: space-between;

  padding: 17px;

  border: none;

  border-radius: 21px;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 5px 15px rgba(56,83,99,.05);
}

.menu-icon {
  width: 50px;
  height: 50px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 15px;

  background: rgba(255,255,255,.82);

  font-size: 27px;
}

.menu-name {
  margin-top: 15px;

  font-size: 14px;
  font-weight: 900;
}

.menu-description {
  margin-top: 4px;

  font-size: 9px;
  line-height: 1.45;

  opacity: .8;
}

.meal-menu {
  background: #fff3d9;

  color: #806327;
}

.glucose-menu {
  background: #e7f2ff;

  color: #376b91;
}

.symptom-menu {
  background: #e5f7ef;

  color: #397361;
}

.records-menu {
  background: #f0edff;

  color: #635b91;
}


/* =========================
   인슐린
========================= */

.insulin-button {
  width: 100%;

  display: flex;

  align-items: center;

  gap: 14px;

  margin-top: 10px;

  padding: 16px;

  border-radius: 20px;

  background:
    linear-gradient(
      135deg,
      #ffe7e1,
      #fff0ec
    );

  color: #a85349;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 5px 15px rgba(56,83,99,.05);
}

.insulin-icon {
  width: 54px;
  height: 54px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 16px;

  background: rgba(255,255,255,.9);

  font-size: 29px;
}

.insulin-content {
  flex: 1;
}

.insulin-title {
  margin-bottom: 4px;

  font-size: 14px;
  font-weight: 900;
}

.insulin-description {
  font-size: 10px;
  line-height: 1.5;

  opacity: .85;
}

.insulin-badge {
  display: inline-block;

  margin-top: 7px;

  padding: 4px 7px;

  border-radius: 8px;

  background: rgba(255,255,255,.78);

  font-size: 8px;
  font-weight: 900;
}


/* =========================
   연락처
========================= */

.other-contact-button {
  width: 100%;

  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 11px;

  padding: 14px;

  border: none;

  border-radius: 17px;

  background: white;

  color: #607783;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 4px 14px rgba(56,83,99,.04);
}

.contact-icon {
  width: 42px;
  height: 42px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border-radius: 13px;

  background: #f4f6f8;

  font-size: 21px;
}

.contact-text {
  flex: 1;
}

.contact-title {
  margin-bottom: 3px;

  font-size: 12px;
  font-weight: 900;
}

.contact-description {
  color: #8a9ba4;

  font-size: 9px;
}


@media (max-width: 420px) {

  .demo-banner {
    align-items: stretch;
    flex-direction: column;
  }

  .demo-switch-button {
    width: 100%;
  }

  .menu-button {
    min-height: 135px;

    padding: 15px;
  }

}

</style>

</head>


<body>

<div class="page">


  <!-- 데모 -->

        </div>

  <!-- 인슐린 -->

  <a

    <div class="insulin-content">

      <div class="insulin-title">
        인슐린 기록
      </div>

        실제로 투여한 시간, 종류, Unit과 투여 위치를 기록해요.

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let currentProfile =
  null;


let isDemoStudent =
  false;


let emergencyInfoOpen =
  false;



/* =========================
   시작
========================= */

window.addEventListener(
  "load",
  async function() {

    await loadStudent();

  }
);



/* =========================
   사용자 확인
========================= */

async function loadStudent() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (
    !data.session
  ) {

    window.location.href =
      "./login.html";

    return;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nickname,class_name,avatar,role"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    error
    ||
    !profile
  ) {

    alert(
      "사용자 정보를 불러오지 못했습니다."
    );


    await logout();


    return;

  }


  currentProfile =
    profile;



  /* 일반 학생 */

  if (
    profile.role === "student"
  ) {

    isDemoStudent =
      false;


    showStudentProfile();


    await loadEmergencyInfo();


    return;

  }



  /* 데모 */

  if (
    profile.role === "demo"
  ) {

    const demoMode =
      sessionStorage.getItem(
        "demoMode"
      );


    if (
      demoMode !== "student"
    ) {

      window.location.href =
        "./teacher.html";

      return;

    }


    isDemoStudent =
      true;


    document.getElementById(
      "demoBanner"
    ).classList.add(
      "show"
    );


    showStudentProfile();


    await loadEmergencyInfo();


    return;

  }



  /* 교직원 */

  if (
    profile.role === "teacher"
    ||
    profile.role === "nurse"
  ) {

    window.location.href =
      "./teacher.html";


    return;

  }


  window.location.href =
    "./login.html";

}



/* =========================
   학생 프로필
========================= */

function showStudentProfile() {

  document.getElementById(
    "studentAvatar"
  ).textContent =
    currentProfile.avatar
    ||
    "🐻";


  document.getElementById(
    "studentName"
  ).textContent =
    currentProfile.nickname
    ||
    "학생";


  document.getElementById(
    "studentClass"
  ).textContent =
    isDemoStudent
    ?
    "학생 화면 체험 중"
    :
    (
      currentProfile.class_name
      ||
      "학급 정보 없음"
    );

}



/* =========================
   응급정보 접기 / 펼치기
========================= */

function toggleEmergencyInfo() {

  emergencyInfoOpen =
    !emergencyInfoOpen;


  const card =
    document.getElementById(
      "emergencyInfoCard"
    );


  const button =
    document.getElementById(
      "emergencyInfoToggle"
    );


  card.classList.toggle(
    "open",
    emergencyInfoOpen
  );


  button.setAttribute(
    "aria-expanded",
    emergencyInfoOpen
    ?
    "true"
    :
    "false"
  );

}



/* =========================
   나의 응급정보
========================= */

async function loadEmergencyInfo() {

  const card =
    document.getElementById(
      "emergencyInfoCard"
    );


  const content =
    document.getElementById(
      "emergencyInfoContent"
    );


  const badge =
    document.getElementById(
      "emergencyInfoBadge"
    );


  card.classList.add(
    "show"
  );


  /*
    항상 처음에는 접힌 상태
  */

  emergencyInfoOpen =
    false;


  card.classList.remove(
    "open"
  );


  document.getElementById(
    "emergencyInfoToggle"
  ).setAttribute(
    "aria-expanded",
    "false"
  );


  content.innerHTML =
    `
      <div class="emergency-info-empty">
        응급정보를 불러오는 중...
      </div>
    `;



  /* 데모 */

  if (
    isDemoStudent
  ) {

    badge.textContent =
      "체험용";


    const plan =
      getDemoEmergencyPlan();


    renderEmergencyInfo(
      plan
    );


    return;

  }



  /* 실제 학생 */

  badge.textContent =
    "내 정보";


  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "student_emergency_plans"
      )
      .select(
        "glucagon_product,glucagon_location,emergency_kit_location,plan_summary"
      )
      .eq(
        "student_id",
        currentUser.id
      )
      .maybeSingle();


  if (
    error
  ) {

    console.error(
      error
    );


    content.innerHTML =
      `
        <div class="emergency-info-empty">

          응급정보를 불러오지 못했어요.<br>
          담당 선생님에게 알려주세요.

        </div>
      `;


    return;

  }


  renderEmergencyInfo(
    data
  );

}



/* =========================
   데모 응급정보
========================= */

function getDemoEmergencyPlan() {

  try {

    const saved =
      sessionStorage.getItem(
        "demoEmergencyPlan"
      );


    if (
      saved
    ) {

      return JSON.parse(
        saved
      );

    }

  } catch {
  }


  return {

    glucagon_product:
      "Baqsimi",

    glucagon_location:
      "보건실 응급약품함",

    emergency_kit_location:
      "교실 교사용 책상 오른쪽 서랍",

    plan_summary:
      "저혈당 또는 이상 증상이 있으면 학생을 혼자 두지 않고 가까운 교직원이 함께합니다. 실제 처치는 학생별 개별 관리계획을 확인합니다."

  };

}



/* =========================
   응급정보 표시
========================= */

function renderEmergencyInfo(
  plan
) {

  const content =
    document.getElementById(
      "emergencyInfoContent"
    );


  if (
    !plan
  ) {

    showEmptyEmergencyInfo();

    return;

  }


  const hasAnyValue =
    plan.glucagon_product
    ||
    plan.glucagon_location
    ||
    plan.emergency_kit_location
    ||
    plan.plan_summary;


  if (
    !hasAnyValue
  ) {

    showEmptyEmergencyInfo();

    return;

  }


  content.innerHTML =
    `

      ${makeEmergencyInfoItem(
        "💉 글루카곤",
        plan.glucagon_product
      )}

      ${makeEmergencyInfoItem(
        "📍 글루카곤 위치",
        plan.glucagon_location
      )}

      ${makeEmergencyInfoItem(
        "🎒 응급키트 위치",
        plan.emergency_kit_location
      )}

      ${makeEmergencyInfoItem(
        "📋 개별 응급계획",
        plan.plan_summary
      )}

    `;

}



function showEmptyEmergencyInfo() {

  document.getElementById(
    "emergencyInfoContent"
  ).innerHTML =
    `

      <div class="emergency-info-empty">

        아직 등록된 응급정보가 없어요.<br>
        담당 선생님 또는 보건선생님에게 확인해 주세요.

      </div>

    `;

}



function makeEmergencyInfoItem(
  label,
  value
) {

  if (
    !value
  ) {

    return "";

  }


  return `

    <div class="emergency-info-item">

      <div class="emergency-info-label">

        ${escapeHtml(label)}

      </div>

      <div class="emergency-info-value">

        ${escapeHtml(value)}

      </div>

    </div>

  `;

}

/* =========================
   선생님 도움 요청
========================= */

async function callTeacher() {

  if (
    isDemoStudent
  ) {

    window.location.href =
      "./emergency.html";


    return;

  }


  const {
    data: links,
    error
  } =
    await supabaseClient
      .from("teacher_students")
      .select(
        "teacher_id"
      )
      .eq(
        "student_id",
        currentUser.id
      )
      .limit(1);


  if (
    error
    ||
    !links
    ||
    links.length === 0
  ) {

    window.location.href =
      "./emergency.html";


    return;

  }


  const teacherId =
    links[0].teacher_id;


  const {
    data: teacher
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "nickname,phone_number"
      )
      .eq(
        "id",
        teacherId
      )
      .maybeSingle();


  if (
    !teacher
    ||
    !teacher.phone_number
  ) {

    window.location.href =
      "./emergency.html";


    return;

  }


  const confirmed =
    confirm(
      `${teacher.nickname || "담당 선생님"}에게 전화할까요?`
    );


  if (
    !confirmed
  ) {

    return;

  }


  window.location.href =
    "tel:"
    +
    teacher.phone_number.replace(
      /[^0-9+]/g,
      ""
    );

}



/* =========================
   공통
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =========================
   로그아웃
========================= */

async function logout() {

  sessionStorage.removeItem(
    "demoMode"
  );


  sessionStorage.removeItem(
    "teacherSelectedStudent"
  );


  sessionStorage.removeItem(
    "demoAcknowledgedAlerts"
  );


  sessionStorage.removeItem(
    "demoEmergencyPlan"
  );


  await supabaseClient.auth
    .signOut();


  window.location.href =
    "./login.html";

}
