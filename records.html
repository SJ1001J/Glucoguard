<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>기록 보기 - GlucoGuard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    .records-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .records-title {
      margin: 2px 0 5px;
      font-size: 26px;
      color: #245978;
    }

    .records-description {
      margin: 0;
      font-size: 14px;
      color: #78909c;
    }

    .viewer-card {
      display: none;

      margin-bottom: 14px;

      padding: 12px 14px;

      border-radius: 16px;

      background: #f3efff;

      color: #665096;

      font-size: 12px;
      line-height: 1.5;
    }

    .viewer-card strong {
      display: block;

      margin-bottom: 3px;

      font-size: 13px;
    }

    .summary-card {
      background: white;

      border-radius: 22px;

      padding: 18px;

      margin-bottom: 15px;

      box-shadow:
        0 5px 14px rgba(60,90,110,.07);
    }

    .summary-label {
      font-size: 12px;
      color: #78909c;
    }

    .summary-number {
      margin-top: 5px;

      font-size: 28px;
      font-weight: 800;

      color: #245978;
    }

    .chart-card {
      background: white;

      border-radius: 22px;

      padding: 18px;

      margin-bottom: 18px;

      box-shadow:
        0 5px 14px rgba(60,90,110,.07);
    }

    .chart-title-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;
    }

    .chart-title {
      font-size: 17px;
      font-weight: 800;

      color: #37474f;
    }

    .chart-badge {
      padding: 6px 9px;

      border-radius: 999px;

      background: #edf6fc;

      color: #47738f;

      font-size: 10px;
      font-weight: 800;
    }

    .chart-wrap {
      width: 100%;
      height: 230px;
    }

    .chart-empty {
      display: none;

      padding: 30px 10px;

      text-align: center;

      color: #90a4ae;

      font-size: 13px;
    }

    .chart-note {
      margin: 13px 0 0;

      color: #90a4ae;

      font-size: 10px;
      line-height: 1.6;
    }

    .records-section-title {
      margin: 18px 0 10px;

      font-size: 17px;
      font-weight: 800;

      color: #37474f;
    }

    .date-group {
      margin-bottom: 18px;
    }

    .date-title {
      margin-bottom: 8px;

      color: #607d8b;

      font-size: 12px;
      font-weight: 800;
    }

    .record-list {
      display: flex;

      flex-direction: column;

      gap: 9px;
    }

    .record-card {
      padding: 15px;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 4px 12px rgba(60,90,110,.06);
    }

    .record-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }

    .record-type {
      display: flex;

      align-items: center;

      gap: 7px;

      font-size: 13px;
      font-weight: 800;

      color: #455a64;
    }

    .record-time {
      color: #90a4ae;

      font-size: 10px;
    }

    .record-main-value {
      margin-bottom: 5px;

      color: #245978;

      font-size: 22px;
      font-weight: 900;
    }

    .record-detail {
      color: #607d8b;

      font-size: 11px;
      line-height: 1.6;
    }

    .record-note {
      margin-top: 9px;

      padding: 9px 10px;

      border-radius: 11px;

      background: #f7f9fa;

      color: #607d8b;

      font-size: 10px;
      line-height: 1.5;
    }

    .glucose-low {
      border-left: 5px solid #7fb5df;
    }

    .glucose-high {
      border-left: 5px solid #efb36b;
    }

    .glucose-normal {
      border-left: 5px solid #83c4a7;
    }

    .meal-card {
      border-left: 5px solid #f1cb79;
    }

    .symptom-card {
      border-left: 5px solid #8bc8ae;
    }

    .activity-card {
      border-left: 5px solid #9a92cf;
    }

    .empty-card {
      padding: 30px 18px;

      border-radius: 20px;

      background: white;

      text-align: center;

      box-shadow:
        0 4px 13px rgba(60,90,110,.05);
    }

    .empty-icon {
      margin-bottom: 10px;

      font-size: 34px;
    }

    .empty-card h2 {
      margin: 0 0 7px;

      color: #455a64;

      font-size: 16px;
    }

    .empty-card p {
      margin: 0;

      color: #90a4ae;

      font-size: 11px;
      line-height: 1.5;
    }

    .back-button {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      border: none;
      border-radius: 12px;

      background: white;

      color: #53758a;

      font-size: 21px;

      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(60,90,110,.06);
    }

  </style>

</head>


<body>

<div class="container">


  <div class="records-header">

    <button
      class="back-button"
      onclick="goBack()">

      ←

    </button>


    <div>

      <h1
        id="pageTitle"
        class="records-title">

        📊 내 기록

      </h1>


      <p
        id="pageDescription"
        class="records-description">

        혈당, 식사, 상태, 활동 기록을 확인해요.

      </p>

    </div>

  </div>



  <div
    id="viewerCard"
    class="viewer-card">

    <strong>
      👩‍🏫 교직원 보기
    </strong>

    담당 학생의 기록을 조회하고 있어요.

  </div>



  <div class="summary-card">

    <div class="summary-label">
      전체 기록
    </div>

    <div
      id="recordCount"
      class="summary-number">

      -

    </div>

  </div>



  <div class="chart-card">

    <div class="chart-title-row">

      <div class="chart-title">
        🩸 최근 혈당 흐름
      </div>

      <div
        id="chartBadge"
        class="chart-badge">

        최근 0회

      </div>

    </div>


    <div
      id="chartWrap"
      class="chart-wrap">

      <canvas id="glucoseChart"></canvas>

    </div>


    <div
      id="chartEmpty"
      class="chart-empty">

      아직 혈당 기록이 없어요.

    </div>


    <p class="chart-note">

      혈당 기록으로 저장된 측정값만 그래프에 표시해요.
      목표 범위와 대응은 개인별 관리계획을 우선해주세요.

    </p>

  </div>



  <div class="records-section-title">
    최근 기록
  </div>


  <div id="recordsArea">

    <div class="empty-card">
      기록을 불러오는 중...
    </div>

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let targetUserId =
  null;


let viewerRole =
  "student";


let isTeacherView =
  false;


let isSuperView =
  false;


let targetStudentName =
  null;


let glucoseChart =
  null;



window.addEventListener(
  "load",
  async function() {

    const ready =
      await initializeViewer();


    if (!ready) {
      return;
    }


    await loadRecords();

  }
);



async function initializeViewer() {

  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth
      .getSession();


  if (
    sessionError ||
    !sessionData.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    sessionData.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "role, nickname, is_super"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );


    alert(
      "계정 정보를 확인하지 못했어요."
    );


    return false;

  }


  viewerRole =
    profile?.role ||
    "student";



  /*
    슈퍼계정에서 실제 학생 보기
  */

  const superSelectedStudent =
    sessionStorage.getItem(
      "superViewStudent"
    );


  if (
    profile?.is_super === true
    &&
    superSelectedStudent
  ) {

    targetUserId =
      superSelectedStudent;


    isSuperView =
      true;


    isTeacherView =
      false;


    const {
      data: studentProfile,
      error: studentError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "nickname, class_name, role"
        )
        .eq(
          "id",
          targetUserId
        )
        .eq(
          "role",
          "student"
        )
        .maybeSingle();


    if (
      studentError
      ||
      !studentProfile
    ) {

      console.error(
        studentError
      );


      alert(
        "선택한 학생 정보를 불러오지 못했어요."
      );


      sessionStorage.removeItem(
        "superViewStudent"
      );


      location.href =
        "admin.html";


      return false;

    }


    targetStudentName =
      studentProfile.nickname ||
      "학생";


    document.getElementById(
      "pageTitle"
    ).textContent =
      "📊 "
      +
      targetStudentName
      +
      " 학생 기록";


    document.getElementById(
      "pageDescription"
    ).textContent =
      (
        studentProfile.class_name
          ?
          studentProfile.class_name
          +
          " · "
          :
          ""
      )
      +
      "실제 학생 기록을 슈퍼계정으로 확인하고 있어요.";


    const viewerCard =
      document.getElementById(
        "viewerCard"
      );


    viewerCard.style.display =
      "block";


    viewerCard.innerHTML =
      `
        <strong>
          🛡️ 슈퍼관리 보기
        </strong>

        ${escapeHtml(targetStudentName)} 학생의 실제 기록을 조회하고 있어요.
      `;


    return true;

  }



  /*
    교직원
  */

  if (
    viewerRole === "teacher"
    ||
    viewerRole === "nurse"
  ) {

    const selectedStudent =
      sessionStorage.getItem(
        "teacherSelectedStudent"
      );


    if (!selectedStudent) {

      alert(
        "먼저 학생을 선택해주세요."
      );


      location.href =
        "teacher.html";


      return false;

    }


    targetUserId =
      selectedStudent;


    isTeacherView =
      true;


    const {
      data: relation,
      error: relationError
    } =
      await supabaseClient
        .from("teacher_students")
        .select("student_id")
        .eq(
          "teacher_id",
          currentUser.id
        )
        .eq(
          "student_id",
          targetUserId
        )
        .maybeSingle();


    if (
      relationError ||
      !relation
    ) {

      alert(
        "담당 학생의 기록만 확인할 수 있어요."
      );


      location.href =
        "teacher.html";


      return false;

    }


    const {
      data: studentProfile,
      error: studentError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "nickname, class_name"
        )
        .eq(
          "id",
          targetUserId
        )
        .maybeSingle();


    if (studentError) {

      console.error(
        studentError
      );

    }


    targetStudentName =
      studentProfile?.nickname ||
      "학생";


    document.getElementById(
      "pageTitle"
    ).textContent =
      "📊 "
      +
      targetStudentName
      +
      " 학생 기록";


    document.getElementById(
      "pageDescription"
    ).textContent =
      (
        studentProfile?.class_name
          ?
          studentProfile.class_name
          +
          " · "
          :
          ""
      )
      +
      "혈당, 식사, 상태, 활동 기록을 확인해요.";


    document.getElementById(
      "viewerCard"
    ).style.display =
      "block";


    return true;

  }



  /*
    학생 본인
  */

  targetUserId =
    currentUser.id;


  isTeacherView =
    false;


  return true;

}



/* =========================
   기록 불러오기
========================= */

async function loadRecords() {

  const {
    data: records,
    error
  } =
    await supabaseClient
      .from("records")
      .select(
        "id, user_id, record_type, glucose_value, meal_type, intake_ratio, note, created_at"
      )
      .eq(
        "user_id",
        targetUserId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      error
    );


    showError();


    return;

  }


  document.getElementById(
    "recordCount"
  ).textContent =
    records.length +
    "회";


  renderGlucoseChart(
    records
  );


  renderRecords(
    records
  );

}



/* =========================
   혈당 그래프
========================= */

function renderGlucoseChart(
  records
) {

  const glucoseRecords =
    records
      .filter(
        function(record) {

          return (
            record.record_type ===
              "glucose"
            &&
            record.glucose_value !==
              null
          );

        }
      )
      .slice(
        0,
        10
      )
      .reverse();


  document.getElementById(
    "chartBadge"
  ).textContent =
    "최근 "
    +
    glucoseRecords.length
    +
    "회";


  if (
    glucoseRecords.length === 0
  ) {

    document.getElementById(
      "chartWrap"
    ).style.display =
      "none";


    document.getElementById(
      "chartEmpty"
    ).style.display =
      "block";


    return;

  }


  document.getElementById(
    "chartWrap"
  ).style.display =
    "block";


  document.getElementById(
    "chartEmpty"
  ).style.display =
    "none";


  const labels =
    glucoseRecords.map(
      function(record) {

        return new Date(
          record.created_at
        ).toLocaleTimeString(
          "ko-KR",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );

      }
    );


  const values =
    glucoseRecords.map(
      function(record) {

        return Number(
          record.glucose_value
        );

      }
    );


  const tooltipLabels =
    glucoseRecords.map(
      function(record) {

        return new Date(
          record.created_at
        ).toLocaleString(
          "ko-KR",
          {
            month:
              "numeric",

            day:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );

      }
    );


  const canvas =
    document.getElementById(
      "glucoseChart"
    );


  if (
    glucoseChart
  ) {

    glucoseChart.destroy();

  }


  glucoseChart =
    new Chart(
      canvas,
      {

        type:
          "line",

        data: {

          labels:
            labels,

          datasets: [

            {

              label:
                "혈당",

              data:
                values,

              borderWidth:
                3,

              tension:
                0.3,

              pointRadius:
                4,

              pointHoverRadius:
                6

            }

          ]

        },

        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          interaction: {

            intersect:
              false,

            mode:
              "index"

          },

          plugins: {

            legend: {

              display:
                false

            },

            tooltip: {

              callbacks: {

                title:
                  function(context) {

                    const index =
                      context[0]
                        .dataIndex;


                    return (
                      tooltipLabels[
                        index
                      ]
                    );

                  },

                label:
                  function(context) {

                    return (
                      "혈당 "
                      +
                      context.parsed.y
                      +
                      " mg/dL"
                    );

                  }

              }

            }

          },

          scales: {

            y: {

              beginAtZero:
                false,

              title: {

                display:
                  true,

                text:
                  "mg/dL"

              }

            }

          }

        }

      }
    );

}



/* =========================
   기록 목록
========================= */

function renderRecords(
  records
) {

  const area =
    document.getElementById(
      "recordsArea"
    );


  if (
    !records ||
    records.length === 0
  ) {

    area.innerHTML = `

      <div class="empty-card">

        <div class="empty-icon">
          📝
        </div>

        <h2>
          아직 기록이 없어요
        </h2>

        <p>
          기록을 남기면 이곳에서 확인할 수 있어요.
        </p>

      </div>

    `;


    return;

  }


  const grouped =
    {};


  records.forEach(
    function(record) {

      const key =
        getDateKey(
          record.created_at
        );


      if (
        !grouped[key]
      ) {

        grouped[key] =
          [];

      }


      grouped[key].push(
        record
      );

    }
  );


  let html =
    "";


  Object.keys(
    grouped
  ).forEach(
    function(dateKey) {

      html += `

        <div class="date-group">

          <div class="date-title">
            ${formatDateTitle(dateKey)}
          </div>

          <div class="record-list">

      `;


      grouped[dateKey]
        .forEach(
          function(record) {

            html +=
              createRecordCard(
                record
              );

          }
        );


      html += `

          </div>

        </div>

      `;

    }
  );


  area.innerHTML =
    html;

}



/* =========================
   카드 분류
========================= */

function createRecordCard(
  record
) {

  if (
    record.record_type ===
    "glucose"
  ) {

    return createGlucoseCard(
      record
    );

  }


  if (
    record.record_type ===
    "meal"
  ) {

    return createMealCard(
      record
    );

  }


  if (
    record.record_type ===
    "symptom"
  ) {

    return createSymptomCard(
      record
    );

  }


  if (
    record.record_type ===
    "activity"
  ) {

    return createActivityCard(
      record
    );

  }


  return `
    <div class="record-card">

      <div class="record-top">

        <div class="record-type">
          📝 기록
        </div>

        <div class="record-time">
          ${formatTime(record.created_at)}
        </div>

      </div>

      <div class="record-detail">
        ${escapeHtml(record.note || "")}
      </div>

    </div>
  `;

}
/* =========================
   혈당 카드
========================= */

function createGlucoseCard(
  record
) {

  const value =
    Number(
      record.glucose_value
    );


  let statusClass =
    "glucose-normal";


  let statusText =
    "혈당 기록";


  if (
    value < 70
  ) {

    statusClass =
      "glucose-low";

    statusText =
      "저혈당 범위 기록";

  }
  else if (
    value >= 250
  ) {

    statusClass =
      "glucose-high";

    statusText =
      "고혈당 범위 기록";

  }


  return `

    <div class="record-card ${statusClass}">

      <div class="record-top">

        <div class="record-type">
          🩸 혈당
        </div>

        <div class="record-time">
          ${formatTime(record.created_at)}
        </div>

      </div>


      <div class="record-main-value">

        ${escapeHtml(
          record.glucose_value
        )}
        mg/dL

      </div>


      <div class="record-detail">
        ${escapeHtml(statusText)}
      </div>

      ${
        record.note
        ?
        `
          <div class="record-note">
            ${escapeHtml(
              getReadableNote(
                record.note
              )
            )}
          </div>
        `
        :
        ""
      }

    </div>

  `;

}



/* =========================
   식사 카드
========================= */

function createMealCard(
  record
) {

  let amountText =
    "";


  const ratio =
    Number(
      record.intake_ratio
    );


  if (
    ratio === 1
  ) {

    amountText =
      "다 먹었어요";

  }
  else if (
    ratio === .5
  ) {

    amountText =
      "반 정도 먹었어요";

  }
  else if (
    ratio === .25
  ) {

    amountText =
      "조금 먹었어요";

  }
  else if (
    ratio === 0
  ) {

    amountText =
      "안 먹었어요";

  }


  return `

    <div class="record-card meal-card">

      <div class="record-top">

        <div class="record-type">
          🍱 식사
        </div>

        <div class="record-time">
          ${formatTime(record.created_at)}
        </div>

      </div>


      <div class="record-main-value">

        ${escapeHtml(
          record.meal_type ||
          "식사"
        )}

      </div>


      <div class="record-detail">

        ${
          amountText
          ?
          escapeHtml(amountText)
          :
          "섭취량 기록"
        }

      </div>


      ${
        record.note
        ?
        `
          <div class="record-note">

            ${escapeHtml(
              getReadableNote(
                record.note
              )
            )}

          </div>
        `
        :
        ""
      }

    </div>

  `;

}



/* =========================
   상태 카드
========================= */

function createSymptomCard(
  record
) {

  const data =
    parseNote(
      record.note
    );


  const symptoms =
    Array.isArray(
      data.symptoms
    )
    ?
    data.symptoms
    :
    [];


  let title =
    symptoms.length > 0
    ?
    symptoms.join(", ")
    :
    "몸 상태 기록";


  const details =
    [];


  if (
    data.context
  ) {

    details.push(
      data.context
    );

  }


  if (
    record.glucose_value !==
    null
    &&
    record.glucose_value !==
    undefined
  ) {

    details.push(
      `혈당 ${record.glucose_value} mg/dL`
    );

  }


  if (
    data.note
  ) {

    details.push(
      data.note
    );

  }


  return `

    <div class="record-card symptom-card">

      <div class="record-top">

        <div class="record-type">
          🙂 몸 상태
        </div>

        <div class="record-time">
          ${formatTime(record.created_at)}
        </div>

      </div>


      <div class="record-main-value">

        ${escapeHtml(title)}

      </div>


      <div class="record-detail">

        ${
          details.length
          ?
          escapeHtml(
            details.join(" · ")
          )
          :
          "몸 상태를 기록했어요."
        }

      </div>

    </div>

  `;

}



/* =========================
   활동 카드
========================= */

function createActivityCard(
  record
) {

  const data =
    parseNote(
      record.note
    );


  const title =
    data.activity
    ||
    data.name
    ||
    "활동 기록";


  const detail =
    data.detail
    ||
    data.note
    ||
    "";


  return `

    <div class="record-card activity-card">

      <div class="record-top">

        <div class="record-type">
          🏃 활동
        </div>

        <div class="record-time">
          ${formatTime(record.created_at)}
        </div>

      </div>


      <div class="record-main-value">

        ${escapeHtml(title)}

      </div>


      ${
        detail
        ?
        `
          <div class="record-detail">

            ${escapeHtml(detail)}

          </div>
        `
        :
        ""
      }

    </div>

  `;

}



/* =========================
   note 읽기
========================= */

function getReadableNote(
  value
) {

  if (!value) {
    return "";
  }


  try {

    const parsed =
      JSON.parse(value);


    if (
      typeof parsed ===
      "string"
    ) {

      return parsed;

    }


    if (
      parsed.note
    ) {

      return parsed.note;

    }


    if (
      parsed.memo
    ) {

      return parsed.memo;

    }


    if (
      parsed.context
    ) {

      return parsed.context;

    }


    return Object.values(
      parsed
    )
      .filter(
        function(value) {

          return (
            value !== null
            &&
            value !== ""
            &&
            !Array.isArray(value)
          );

        }
      )
      .join(" · ");

  }
  catch {

    return value;

  }

}



/* =========================
   날짜
========================= */

function getDateKey(
  value
) {

  const date =
    new Date(value);


  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    )
    +
    "-"
    +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}



function formatDateTitle(
  value
) {

  const parts =
    value.split("-");


  if (
    parts.length !== 3
  ) {

    return value;

  }


  return (
    Number(parts[1])
    +
    "월 "
    +
    Number(parts[2])
    +
    "일"
  );

}



function formatTime(
  value
) {

  const date =
    new Date(value);


  return date.toLocaleTimeString(
    "ko-KR",
    {
      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );

}



/* =========================
   JSON
========================= */

function parseNote(
  note
) {

  try {

    return JSON.parse(
      note || "{}"
    );

  }
  catch {

    return {};

  }

}



/* =========================
   HTML 안전 처리
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
