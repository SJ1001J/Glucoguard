<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>먹은 거 기록 - GlucoGuard</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fffdf8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #263238;
    }

    .page-wrap {
      width: 100%;
      max-width: 460px;

      margin: 0 auto;

      padding: 20px 18px 38px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;
    }

    .back-button {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 14px;

      background: white;

      color: #526b7b;

      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 4px 13px rgba(60,90,110,.07);
    }

    .title-area h1 {
      margin: 0;

      color: #344e5e;

      font-size: 22px;
      font-weight: 900;
    }

    .title-area p {
      margin: 4px 0 0;

      color: #8295a1;

      font-size: 12px;
    }


    /* =========================
       STEP 카드
    ========================= */

    .step-card {
      background: white;

      border-radius: 21px;

      padding: 16px;

      margin-bottom: 13px;

      box-shadow:
        0 5px 15px rgba(60,90,110,.06);
    }

    .step-badge {
      display: inline-block;

      padding: 4px 7px;

      margin-bottom: 10px;

      border-radius: 7px;

      background: #eaf4ff;

      color: #3776a4;

      font-size: 10px;
      font-weight: 900;
    }

    .step-title {
      margin-bottom: 5px;

      color: #344e5e;

      font-size: 17px;
      font-weight: 900;
    }

    .step-description {
      margin-bottom: 13px;

      color: #8397a3;

      font-size: 11px;
      line-height: 1.5;
    }


    /* =========================
       사진
    ========================= */

    .photo-box {
      position: relative;

      min-height: 105px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 1.5px dashed #efb93d;

      border-radius: 15px;

      background: #fffdf7;

      overflow: hidden;

      cursor: pointer;
    }

    .photo-box img {
      width: 100%;
      max-height: 230px;

      object-fit: cover;

      display: none;
    }

    .photo-placeholder {
      text-align: center;
    }

    .photo-placeholder-icon {
      font-size: 26px;

      margin-bottom: 5px;
    }

    .photo-placeholder-title {
      color: #455a64;

      font-size: 13px;
      font-weight: 900;

      margin-bottom: 3px;
    }

    .photo-placeholder-text {
      color: #91a0a8;

      font-size: 10px;
    }

    #photoInput {
      display: none;
    }


    /* =========================
       점심 / 간식
    ========================= */

    .meal-choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 9px;
    }

    .meal-choice-button {
      width: 100%;

      min-height: 68px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      border: 2px solid transparent;
      border-radius: 15px;

      background: #f6f8fa;

      color: #455a64;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }

    .meal-choice-button .meal-emoji {
      font-size: 23px;
    }

    .meal-choice-button.selected {
      border-color: #79aeda;

      background: #eaf4ff;

      color: #2c6c98;
    }


    /* =========================
       먹은 양
    ========================= */

    .amount-list {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .amount-button {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 13px;

      border: 2px solid transparent;

      border-radius: 14px;

      background: #f6f8fa;

      text-align: left;

      cursor: pointer;
    }

    .amount-button.selected {
      border-color: #79aeda;

      background: #eaf4ff;
    }

    .amount-emoji {
      width: 37px;

      flex-shrink: 0;

      font-size: 23px;

      text-align: center;
    }

    .amount-text {
      flex: 1;
    }

    .amount-title {
      color: #344e5e;

      font-size: 13px;
      font-weight: 900;

      margin-bottom: 2px;
    }

    .amount-subtitle {
      color: #8a9ba5;

      font-size: 10px;
    }


    /* =========================
       저장
    ========================= */

    .save-button {
      width: 100%;

      margin-top: 2px;

      padding: 15px;

      border: none;
      border-radius: 15px;

      background: #428dbc;

      color: white;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 6px 15px rgba(66,141,188,.18);
    }

    .save-button:disabled {
      background: #b9c7d0;

      cursor: default;
    }

    .bottom-note {
      margin-top: 15px;

      text-align: center;

      color: #96a4ac;

      font-size: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="page-wrap">


  <!-- 상단 -->

  <div class="top-bar">

    <button
      class="back-button"
      onclick="location.href='index.html'">

      ←

    </button>


    <div class="title-area">

      <h1>
        🍱 먹은 거 기록
      </h1>

      <p>
        언제, 얼마나 먹었는지만 간단히 기록해요.
      </p>

    </div>

  </div>



  <!-- STEP 1 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 1 · 선택
    </div>

    <div class="step-title">
      📷 사진을 찍을까요?
    </div>

    <div class="step-description">
      사진은 안 찍어도 괜찮아요.
    </div>


    <label
      class="photo-box"
      for="photoInput">

      <img
        id="photoPreview"
        alt="음식 사진 미리보기">


      <div
        id="photoPlaceholder"
        class="photo-placeholder">

        <div class="photo-placeholder-icon">
          📷
        </div>

        <div class="photo-placeholder-title">
          음식 사진 찍기
        </div>

        <div class="photo-placeholder-text">
          눌러서 사진을 찍거나 골라요
        </div>

      </div>

    </label>


    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment">

  </div>



  <!-- STEP 2 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 2
    </div>

    <div class="step-title">
      언제 먹었나요?
    </div>


    <div class="meal-choice-grid">


      <button
        class="meal-choice-button"
        data-meal="점심"
        onclick="selectMeal(this)">

        <div class="meal-emoji">
          🍛
        </div>

        점심

      </button>


      <button
        class="meal-choice-button"
        data-meal="간식"
        onclick="selectMeal(this)">

        <div class="meal-emoji">
          🍪
        </div>

        간식

      </button>


    </div>

  </div>



  <!-- STEP 3 -->

  <div class="step-card">

    <div class="step-badge">
      STEP 3
    </div>

    <div class="step-title">
      얼마나 먹었나요?
    </div>

    <div class="step-description">
      가장 비슷한 것을 골라주세요.
    </div>


    <div class="amount-list">


      <button
        class="amount-button"
        data-ratio="1"
        data-label="다 먹었어요"
        onclick="selectAmount(this)">

        <div class="amount-emoji">
          😋
        </div>

        <div class="amount-text">

          <div class="amount-title">
            다 먹었어요
          </div>

          <div class="amount-subtitle">
            거의 남기지 않았어요
          </div>

        </div>

      </button>



      <button
        class="amount-button"
        data-ratio="0.5"
        data-label="반 정도 먹었어요"
        onclick="selectAmount(this)">

        <div class="amount-emoji">
          🙂
        </div>

        <div class="amount-text">

          <div class="amount-title">
            반 정도 먹었어요
          </div>

          <div class="amount-subtitle">
            절반쯤 먹었어요
          </div>

        </div>

      </button>



      <button
        class="amount-button"
        data-ratio="0.25"
        data-label="조금 먹었어요"
        onclick="selectAmount(this)">

        <div class="amount-emoji">
          😐
        </div>

        <div class="amount-text">

          <div class="amount-title">
            조금 먹었어요
          </div>

          <div class="amount-subtitle">
            몇 입 정도 먹었어요
          </div>

        </div>

      </button>



      <button
        class="amount-button"
        data-ratio="0"
        data-label="안 먹었어요"
        onclick="selectAmount(this)">

        <div class="amount-emoji">
          🙁
        </div>

        <div class="amount-text">

          <div class="amount-title">
            안 먹었어요
          </div>

          <div class="amount-subtitle">
            먹지 않았어요
          </div>

        </div>

      </button>


    </div>

  </div>



  <button
    id="saveButton"
    class="save-button"
    onclick="saveMeal()">

    🍱 먹은 거 기록하기

  </button>



  <div class="bottom-note">

    사진은 미리보기만 사용하며 서버에 저장하지 않아요.<br>
    점심·간식과 먹은 양만 기록에 저장돼요.

  </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser =
  null;


let selectedMeal =
  null;


let selectedRatio =
  null;


let selectedAmountLabel =
  null;



window.addEventListener(
  "load",
  async function() {

    const ready =
      await checkLogin();


    if (!ready) {
      return;
    }

  }
);



async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    profile &&
    (
      profile.role === "teacher"
      ||
      profile.role === "nurse"
    )
  ) {

    location.href =
      "teacher.html";


    return false;

  }


  return true;

}



/* =========================
   사진 미리보기
========================= */

document.getElementById(
  "photoInput"
).addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const preview =
          document.getElementById(
            "photoPreview"
          );


        preview.src =
          e.target.result;


        preview.style.display =
          "block";


        document.getElementById(
          "photoPlaceholder"
        ).style.display =
          "none";

      };


    reader.readAsDataURL(
      file
    );

  }
);



/* =========================
   점심 / 간식 선택
========================= */

function selectMeal(
  button
) {

  selectedMeal =
    button.dataset.meal;


  document.querySelectorAll(
    ".meal-choice-button"
  ).forEach(
    item => {

      item.classList.toggle(
        "selected",
        item === button
      );

    }
  );

}



/* =========================
   먹은 양 선택
========================= */

function selectAmount(
  button
) {

  selectedRatio =
    Number(
      button.dataset.ratio
    );


  selectedAmountLabel =
    button.dataset.label;


  document.querySelectorAll(
    ".amount-button"
  ).forEach(
    item => {

      item.classList.toggle(
        "selected",
        item === button
      );

    }
  );

}



/* =========================
   저장
========================= */

async function saveMeal() {

  if (!selectedMeal) {

    alert(
      "점심인지 간식인지 골라주세요."
    );


    return;

  }


  if (
    selectedRatio === null
  ) {

    alert(
      "얼마나 먹었는지 골라주세요."
    );


    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;


  button.textContent =
    "기록 중...";


  const note =
    selectedMeal
    +
    " · "
    +
    selectedAmountLabel;


  const {
    error
  } =
    await supabaseClient
      .from("records")
      .insert({

        user_id:
          currentUser.id,

        record_type:
          "meal",

        glucose_value:
          null,

        meal_type:
          selectedMeal,

        planned_carbs:
          null,

        intake_ratio:
          selectedRatio,

        estimated_carbs:
          null,

        note:
          note

      });


  button.disabled =
    false;


  button.textContent =
    "🍱 먹은 거 기록하기";


  if (error) {

    console.error(
      error
    );


    alert(
      "기록을 저장하지 못했어요."
    );


    return;

  }


  alert(
    "먹은 거 기록을 저장했어요! 🍱"
  );


  location.href =
    "index.html";

}

</script>

</body>

</html>
