<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>교직원 관리 - GlucoGuard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f8fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #263238;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 18px 40px;
    }


    /* =========================
       상단
    ========================= */

    .top-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(57,79,94,.07);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      background: #eef4ff;
      font-size: 27px;
    }

    .brand h1 {
      margin: 0;
      color: #314f68;
      font-size: 22px;
      font-weight: 900;
    }

    .brand p {
      margin: 4px 0 0;
      color: #8194a1;
      font-size: 11px;
    }

    .logout-button {
      border: none;
      border-radius: 11px;
      padding: 10px 12px;
      background: #f4f6f8;
      color: #657b88;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .teacher-info {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid #edf1f3;
      color: #718793;
      font-size: 12px;
    }

    .teacher-info strong {
      color: #3e6179;
    }


    /* =========================
       내 연락처
    ========================= */

    .teacher-phone-box {
      margin-top: 13px;
      padding: 13px;
      background: #f7f9fb;
      border-radius: 15px;
    }

    .teacher-phone-label {
      margin-bottom: 7px;
      color: #607d8b;
      font-size: 11px;
      font-weight: 800;
    }

    .teacher-phone-row {
      display: flex;
      gap: 8px;
    }

    .teacher-phone-input {
      flex: 1;
      min-width: 0;
      padding: 10px 11px;
      border: 1px solid #d8e2e8;
      border-radius: 11px;
      font-size: 13px;
    }

    .teacher-phone-save {
      border: none;
      border-radius: 11px;
      padding: 10px 13px;
      background: #4285b4;
      color: white;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .teacher-phone-help {
      margin-top: 6px;
      color: #8a9ba5;
      font-size: 10px;
    }


    /* =========================
       메인 기능
    ========================= */

    .main-tools {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 14px;
    }

    .main-tool-button {
      width: 100%;
      min-height: 108px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px;
      border: none;
      border-radius: 22px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(57,79,94,.06);
    }

    .main-tool-icon {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      background: rgba(255,255,255,.78);
      font-size: 31px;
    }

    .main-tool-text {
      flex: 1;
    }

    .main-tool-title {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .main-tool-description {
      font-size: 11px;
      line-height: 1.55;
    }

    .main-tool-arrow {
      font-size: 25px;
      opacity: .55;
    }

    .emergency-tool {
      background: #ffe7e3;
      color: #a7443d;
      border: 1px solid #ffd0ca;
    }

    .education-tool {
      background: #e8f2ff;
      color: #35627f;
    }


    /* =========================
       담당학생 설정
    ========================= */

    .management-row {
      margin-bottom: 14px;
    }

    .student-setting-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: none;
      border-radius: 17px;
      background: #e8f7f1;
      color: #3e7462;
      text-align: left;
      cursor: pointer;
    }

    .setting-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: white;
      font-size: 21px;
    }

    .setting-text {
      flex: 1;
    }

    .setting-title {
      margin-bottom: 3px;
      font-size: 13px;
      font-weight: 900;
    }

    .setting-description {
      font-size: 10px;
      opacity: .8;
    }

    .setting-arrow {
      font-size: 22px;
      opacity: .55;
    }


    /* =========================
       요약
    ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: white;
      border: none;
      border-radius: 19px;
      padding: 16px;
      text-align: left;
      box-shadow: 0 4px 14px rgba(57,79,94,.05);
    }

    .summary-label {
      margin-bottom: 6px;
      color: #8295a0;
      font-size: 11px;
    }

    .summary-value {
      color: #365e78;
      font-size: 24px;
      font-weight: 900;
    }

    .summary-card.alert {
      cursor: pointer;
    }

    .summary-card.alert .summary-value {
      color: #d24f47;
    }

    .summary-click-hint {
      margin-top: 5px;
      color: #c77a76;
      font-size: 9px;
      font-weight: 700;
    }


    /* =========================
       학생 목록
    ========================= */

    .student-list-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      margin-bottom: 11px;
      border: none;
      border-radius: 17px;
      background: white;
      color: #455f70;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(57,79,94,.05);
    }

    .student-list-toggle-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .student-list-toggle-title {
      font-size: 14px;
      font-weight: 900;
    }

    .student-list-toggle-sub {
      margin-top: 2px;
      color: #8a9ba5;
      font-size: 10px;
      text-align: left;
    }

    .student-list-toggle-arrow {
      color: #78909c;
      font-size: 19px;
      transition: transform .2s ease;
    }

    .student-list-toggle.open
    .student-list-toggle-arrow {
      transform: rotate(180deg);
    }

    .student-list-wrapper {
      display: none;
    }

    .student-list-wrapper.open {
      display: block;
    }


    /* =========================
       학생 카드
    ========================= */

    .student-card {
      background: white;
      border: 2px solid transparent;
      border-radius: 23px;
      padding: 17px;
      margin-bottom: 13px;
      box-shadow: 0 5px 17px rgba(57,79,94,.06);
    }

    .student-card.needs-attention {
      border-color: #ffb7b1;
      background: #fffdfd;
    }

    .student-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }

    .student-avatar {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 18px;
      background: #fff1c8;
      font-size: 31px;
    }

    .student-main {
      flex: 1;
    }

    .student-name {
      margin-bottom: 3px;
      color: #344e5e;
      font-size: 18px;
      font-weight: 900;
    }

    .student-class {
      color: #81939f;
      font-size: 11px;
    }

    .attention-badge,
    .ok-badge {
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 900;
    }

    .attention-badge {
      background: #ffe9e7;
      color: #c84d46;
    }

    .ok-badge {
      background: #edf7ef;
      color: #4c8560;
    }


    /* =========================
       알림 종류
    ========================= */

    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 12px;
    }

    .alert-item {
      padding: 10px 11px;
      border-radius: 13px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.55;
    }

    .alert-low {
      background: #e9f3ff;
      color: #356b96;
      border: 1px solid #cfe4fa;
    }

    .alert-high {
      background: #fff1df;
      color: #a66528;
      border: 1px solid #f5d4ad;
    }

    .alert-vomit {
      background: #ffe8e6;
      color: #b34842;
      border: 1px solid #f7c5c1;
    }


    /* =========================
       기록
    ========================= */

    .record-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 13px;
    }

    .record-box {
      min-height: 70px;
      padding: 11px;
      border-radius: 14px;
      background: #f6f8fa;
    }

    .record-box.status-box {
      grid-column: 1 / -1;
      background: #eaf8f2;
    }

    .record-label {
      margin-bottom: 5px;
      color: #8798a2;
      font-size: 10px;
    }

    .record-value {
      color: #496675;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
    }

    .status-box .record-value {
      color: #3e7565;
    }

    .safety-card-button {
      width: 100%;
      margin-bottom: 8px;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: #fff2d8;
      color: #826025;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .student-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-button {
      border: none;
      border-radius: 13px;
      padding: 12px 8px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .records-action {
      background: #eaf3ff;
      color: #2d6893;
    }

    .symptom-action {
      background: #e8f7f1;
      color: #367662;
    }

    .contact-action {
      background: #eef0ff;
      color: #5669a4;
    }

    .password-action {
      background: #f3f5f6;
      color: #687d88;
    }

    .empty-state {
      background: white;
      border-radius: 20px;
      padding: 28px 18px;
      text-align: center;
      color: #8396a1;
      font-size: 12px;
      line-height: 1.7;
    }


    /* =========================
       모달
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(30,45,55,.46);
    }

    .modal {
      width: 100%;
      max-width: 500px;
      max-height: 88vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      padding: 19px;
      box-shadow: 0 18px 45px rgba(0,0,0,.18);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-title {
      margin: 0;
      color: #344e5e;
      font-size: 19px;
      font-weight: 900;
    }

    .modal-subtitle {
      margin: 4px 0 0;
      color: #82939d;
      font-size: 11px;
    }

    .close-button {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 11px;
      background: #f4f6f7;
      color: #6b7e89;
      font-size: 18px;
      cursor: pointer;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      background: #4285b4;
      color: white;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }


    /* =========================
       안전카드
    ========================= */

    .safety-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 11px;
      border-radius: 18px;
      background: #fff6df;
    }

    .safety-avatar {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 17px;
      background: white;
      font-size: 30px;
    }

    .safety-name {
      color: #496170;
      font-size: 17px;
      font-weight: 900;
    }

    .safety-class {
      margin-top: 3px;
      color: #82939d;
      font-size: 10px;
    }

    .ack-button {
      width: 100%;
      margin: 11px 0 12px;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: #4d9d82;
      color: white;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .safety-ok {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 14px;
      background: #edf8f4;
      color: #447565;
      font-size: 11px;
    }

    .safety-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .safety-info-box {
      padding: 12px;
      border-radius: 14px;
      background: #f6f8fa;
    }

    .safety-info-box.full {
      grid-column: 1 / -1;
    }

    .safety-label {
      margin-bottom: 5px;
      color: #8799a3;
      font-size: 9px;
    }

    .safety-value {
      color: #486573;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.5;
    }

    .safety-section-title {
      margin: 15px 0 8px 2px;
      color: #526c7a;
      font-size: 12px;
      font-weight: 900;
    }

    .safety-contact {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      margin-bottom: 7px;
      border-radius: 13px;
      background: #f7f9fa;
    }

    .safety-contact-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 11px;
      background: white;
      font-size: 18px;
    }

    .safety-contact-info {
      flex: 1;
    }

    .safety-contact-name {
      color: #496574;
      font-size: 11px;
      font-weight: 900;
    }

    .safety-contact-phone {
      margin-top: 2px;
      color: #8798a2;
      font-size: 10px;
    }

    .call-button {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: #eaf3ff;
      color: #356b91;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .safety-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px;
    }

    .safety-action {
      padding: 12px;
      border: none;
      border-radius: 13px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .safety-emergency {
      background: #ffe6e2;
      color: #a44640;
    }

    .safety-records {
      background: #eaf3ff;
      color: #356b91;
    }


    /* =========================
       담당 학생 선택
    ========================= */

    .student-select-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .student-select-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border: 2px solid transparent;
      border-radius: 15px;
      background: #f6f8fa;
    }

    .student-select-card.selected {
      border-color: #80c4ad;
      background: #eaf8f2;
    }

    .student-checkbox {
      width: 20px;
      height: 20px;
    }

    .select-avatar {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: white;
      font-size: 23px;
    }

    .select-info {
      flex: 1;
    }

    .select-name {
      color: #486370;
      font-size: 13px;
      font-weight: 900;
    }

    .select-class {
      margin-top: 3px;
      color: #8598a3;
      font-size: 10px;
    }

    .selection-note {
      margin-bottom: 13px;
      padding: 11px;
      border-radius: 13px;
      background: #eef8f4;
      color: #547567;
      font-size: 10px;
      line-height: 1.6;
    }


    /* =========================
       입력
    ========================= */

    .modal-input,
    .modal-select {
      width: 100%;
      padding: 12px;
      margin-bottom: 11px;
      border: 1px solid #d8e2e8;
      border-radius: 13px;
      background: white;
      font-size: 14px;
    }

    .input-label {
      display: block;
      margin-bottom: 5px;
      color: #607d8b;
      font-size: 11px;
      font-weight: 800;
    }

    .modal-contact-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: #f7f9fa;
    }

    .modal-contact-info {
      flex: 1;
    }

    .modal-contact-name {
      color: #496574;
      font-size: 12px;
      font-weight: 900;
    }

    .modal-contact-phone {
      margin-top: 3px;
      color: #8798a2;
      font-size: 10px;
    }

    .contact-delete-button {
      border: none;
      border-radius: 9px;
      padding: 8px;
      background: #fff0ee;
      color: #b6534d;
      font-size: 10px;
    }


    /* =========================
       반복 알림
    ========================= */

    .repeat-alert {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2000;

      width: min(
        350px,
        calc(100vw - 36px)
      );

      display: none;

      padding: 15px;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 14px 35px rgba(0,0,0,.18);

      border: 2px solid #ffb1aa;
    }

    .repeat-alert.show {
      display: block;
    }

    .repeat-alert.low {
      border-color: #92bee8;
    }

    .repeat-alert.high {
      border-color: #efb46f;
    }

    .repeat-alert.vomit {
      border-color: #ed8c84;
    }

    .repeat-alert-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .repeat-alert.low
    .repeat-alert-title {
      color: #356b96;
    }

    .repeat-alert.high
    .repeat-alert-title {
      color: #a66528;
    }

    .repeat-alert.vomit
    .repeat-alert-title {
      color: #b34842;
    }

    .repeat-alert-text {
      color: #687c87;
      font-size: 11px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .repeat-alert-buttons {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .repeat-open {
      border: none;
      border-radius: 11px;
      padding: 10px;
      background: #ffe6e2;
      color: #a44640;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .repeat-close {
      border: none;
      border-radius: 11px;
      padding: 10px 12px;
      background: #f2f4f6;
      color: #6f808a;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }


    @media (max-width: 520px) {

      .teacher-phone-row {
        flex-direction: column;
      }

      .student-actions,
      .safety-actions {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="page">

  <div class="top-card">

    <div class="top-row">

      <div class="brand">

        <div class="brand-icon">
          👩‍🏫
        </div>

        <div>

          <h1>
            GlucoGuard 관리
          </h1>

          <p>
            학생의 기록과 상태를 안전하게 관리해요.
          </p>

        </div>

      </div>

      <button
        class="logout-button"
        onclick="logout()">

        로그아웃

      </button>

    </div>


    <div
      id="teacherInfo"
      class="teacher-info">

      교직원 정보를 불러오는 중...

    </div>


    <div class="teacher-phone-box">

      <div class="teacher-phone-label">
        📞 내 연락처
      </div>

      <div class="teacher-phone-row">

        <input
          id="teacherPhone"
          class="teacher-phone-input"
          type="tel"
          placeholder="예: 010-1234-5678">

        <button
          class="teacher-phone-save"

const SUPABASE_URL =

async function checkTeacherLogin() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (!data.session) {

    window.location.href =
      "./login.html";

    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "nickname,class_name,role,phone_number"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    !profile

    (
      profile.role !== "teacher"
      &&
      profile.role !== "nurse"
    )
  ) {

    window.location.href =
      "./index.html";

    return false;

  }

    "teacherInfo"

    "teacherPhone"

}

}


function closeStudentSetting() {

}


function renderStudentSelection() {

  const container =
    document.getElementById(
      "studentSelectList"
    );


  container.innerHTML =
    "";


  const linkedIds =
    linkedStudents.map(
      student =>
        student.id
    );


  allStudents.forEach(
    student => {

      const selected =
        linkedIds.includes(
          student.id
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "student-select-card"
        +
        (
          selected
          ?
          " selected"
          :
          ""
        );


      label.innerHTML =
        `
          <input
            type="checkbox"
            class="student-checkbox"
            value="${student.id}"
            ${selected ? "checked" : ""}
          >

          <div class="select-avatar">
            ${escapeHtml(student.avatar || "🐻")}
          </div>

          <div class="select-info">

            <div class="select-name">
              ${escapeHtml(student.nickname || "학생")}
            </div>

            <div class="select-class">
              ${escapeHtml(student.class_name || "")}
            </div>

          </div>
        `;


      const checkbox =
        label.querySelector(
          "input"
        );


      checkbox.onchange =
        function() {

          label.classList.toggle(
            "selected",
            checkbox.checked
          );

        };


      container.appendChild(
        label
      );

    }
  );

}


async function saveStudentSelection() {

  const checkedIds =
    Array.from(
      document.querySelectorAll(
        ".student-checkbox:checked"
      )
    ).map(
      item =>
        item.value
    );


  const currentIds =
    linkedStudents.map(
      item =>
        item.id
    );


  const addIds =
    checkedIds.filter(
      id =>
        !currentIds.includes(id)
    );


  const removeIds =
    currentIds.filter(
      id =>
        !checkedIds.includes(id)
    );


  if (
    addIds.length
  ) {

    await supabaseClient
      .from("teacher_students")
      .insert(
        addIds.map(
          id => ({
            teacher_id:
              currentUser.id,

            student_id:
              id
          })
        )
      );

  }


  if (
    removeIds.length
  ) {

    await supabaseClient
      .from("teacher_students")
      .delete()
      .eq(
        "teacher_id",
        currentUser.id
      )
      .in(
        "student_id",
        removeIds
      );

  }


  closeStudentSetting();


  await loadDashboard();

}



/* =========================
   데이터
========================= */

async function loadDashboard() {

  const {
    data: links
  } =
    await supabaseClient
      .from("teacher_students")
      .select(
        "student_id"
      )
      .eq(
        "teacher_id",
        currentUser.id
      );


  const ids =
    (links || [])
      .map(
        item =>
          item.student_id
      );


  if (
    ids.length === 0
  ) {

    linkedStudents = [];
    allRecords = [];
    acknowledgements = [];

    renderDashboard();

    return;

  }


  const {
    data: students
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nickname,class_name,avatar"
      )
      .in(
        "id",
        ids
      );


  linkedStudents =
    students || [];


  const {
    data: records
  } =
    await supabaseClient
      .from("records")
      .select(
        "id,user_id,record_type,glucose_value,meal_type,intake_ratio,note,created_at"
      )
      .in(
        "user_id",
        ids
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  allRecords =
    records || [];


  const {
    data: ack
  } =
    await supabaseClient
      .from(
        "alert_acknowledgements"
      )
      .select(
        "record_id,student_id,acknowledged_at"
      )
      .eq(
        "teacher_id",
        currentUser.id
      );


  acknowledgements =
    ack || [];


  renderDashboard();

}



/* =========================
   알림 판정
========================= */

function getRecordAlert(
  record
) {

  let type =
    null;

  let label =
    null;

  let reason =
    null;


  if (
    record.record_type ===
      "glucose"
    &&
    record.glucose_value !== null
  ) {

    if (
      record.glucose_value < 70
    ) {

      type =
        "low";

      label =
        "🩸 저혈당 확인 필요";

      reason =
        `혈당 ${record.glucose_value} mg/dL`;

    }


    if (
      record.glucose_value >= 250
    ) {

      type =
        "high";

      label =
        "🔺 고혈당 확인 필요";

      reason =
        `혈당 ${record.glucose_value} mg/dL`;

    }

  }


  if (
    record.record_type ===
    "symptom"
  ) {

    const data =
      parseNote(
        record.note
      );


    const vomiting =
      Array.isArray(
        data.symptoms
      )
      &&
      data.symptoms.includes(
        "구토"
      );


    if (
      record.glucose_value !== null
      &&
      record.glucose_value < 70
    ) {

      type =
        vomiting
        ?
        "vomit"
        :
        "low";


      label =
        vomiting
        ?
        "🤢 구토 동반 · 저혈당 확인 필요"
        :
        "🩸 저혈당 확인 필요";


      reason =
        `상태 기록 당시 혈당 ${record.glucose_value} mg/dL`;

    }


    else if (
      record.glucose_value !== null
      &&
      record.glucose_value >= 250
    ) {

      type =
        vomiting
        ?
        "vomit"
        :
        "high";


      label =
        vomiting
        ?
        "🤢 구토 동반 · 고혈당 확인 필요"
        :
        "🔺 고혈당 확인 필요";


      reason =
        `상태 기록 당시 혈당 ${record.glucose_value} mg/dL`;

    }


    else if (
      vomiting
    ) {

      type =
        "vomit";

      label =
        "🤢 구토 증상 확인 필요";

      reason =
        "구토 증상 기록";

    }

  }


  if (!type) {
    return null;
  }


  return {
    type,
    label,
    reason,
    record
  };

}



/* =========================
   학생 상태
========================= */

function buildStudentStatus(
  records
) {

  const latestGlucose =
    records.find(
      record =>
        record.record_type ===
        "glucose"
    );


  const latestMeal =
    records.find(
      record =>
        record.record_type ===
        "meal"
    );


  const latestSymptom =
    records.find(
      record =>
        record.record_type ===
        "symptom"
    );


  const symptomData =
    parseNote(
      latestSymptom
      ?
      latestSymptom.note
      :
      null
    );


  const alerts =
    records
      .map(
        record =>
          getRecordAlert(record)
      )
      .filter(Boolean)
      .filter(
        alert =>
          !acknowledgements.some(
            acknowledgement =>
              Number(
                acknowledgement.record_id
              )
              ===
              Number(
                alert.record.id
              )
          )
      );


  return {

    needsAttention:
      alerts.length > 0,

    alerts,

    latestGlucose,

    latestMeal,

    latestSymptom,

    symptomData,

    todayCount:
      records.filter(
        record =>
          isToday(
            record.created_at
          )
      ).length

  };

}



/* =========================

function renderDashboard() {

/* =========================

========================= */

function createStudentCard(
  student,
  status
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "student-card"
    +
    (
      status.needsAttention
      ?
      " needs-attention"
      :
      ""
    );


  const glucoseText =
    status.latestGlucose
    &&
    status.latestGlucose.glucose_value !== null
    ?
    `${status.latestGlucose.glucose_value} mg/dL`
    :
    "기록 없음";


  card.innerHTML =
    `
      <div class="student-head">

        <div class="student-avatar">
          ${escapeHtml(student.avatar || "🐻")}
        </div>

        <div class="student-main">

          <div class="student-name">
            ${escapeHtml(student.nickname || "학생")}
          </div>

          <div class="student-class">
            ${escapeHtml(student.class_name || "")}
            · 오늘 기록 ${status.todayCount}건
          </div>

        </div>

        ${
          status.needsAttention
          ?
          `<div class="attention-badge">확인 필요</div>`
          :
          `<div class="ok-badge">확인 완료</div>`
        }

      </div>


      ${
        status.needsAttention
        ?
        `
          <div class="alert-list">
            ${createAlertsHtml(status.alerts)}

        <div class="record-box">

          </div>

          </div>

      <div class="student-actions">

        <button class="action-button records-action">
          📊 학생 기록 보기
        </button>

        <button class="action-button symptom-action">
          🙂 몸 상태 기록
        </button>

        <button class="action-button contact-action">
          📞 비상연락처 관리
        </button>

        <button class="action-button password-action">
          🔑 비밀번호 재설정
        </button>

      </div>
    `;


  card.querySelector(
    ".safety-card-button"
  ).onclick =
    () =>
      openSafetyCard(
        student,
        status
      );


  card.querySelector(
    ".records-action"
  ).onclick =
    () =>
      openStudentRecords(
        student.id
      );


  card.querySelector(
    ".symptom-action"
  ).onclick =
    function() {

      sessionStorage.setItem(
        "teacherSelectedStudent",
        student.id
      );


      window.location.href =
        "./symptom.html";

    };


  card.querySelector(
    ".contact-action"
  ).onclick =
    () =>
      openContactModal(
        student
      );


  card.querySelector(
    ".password-action"
  ).onclick =
    () =>
      openPasswordModal(
        student
      );


  return card;

}



/* =========================
   학생 안전카드
========================= */

async function openSafetyCard(
  student,
  status
) {

  selectedSafetyStudent =
    student;


  selectedSafetyStatus =
    status;


  document.getElementById(
    "safetyCardOverlay"
  ).style.display =
    "flex";


  const {
    data: contacts
  } =
    await supabaseClient
      .from("emergency_contacts")
      .select(
        "contact_name,relationship,phone_number"
      )
      .eq(
        "user_id",
        student.id
      );


  let contactsHtml =
    "";


  if (
    contacts &&
    contacts.length
  ) {

    contacts.forEach(
      contact => {

        contactsHtml +=
          `
            <div class="safety-contact">

              <div class="safety-contact-icon">
                📞
              </div>

              <div class="safety-contact-info">

                <div class="safety-contact-name">
                  ${escapeHtml(contact.relationship)}
                  ·
                  ${escapeHtml(contact.contact_name)}
                </div>

                <div class="safety-contact-phone">
                  ${escapeHtml(contact.phone_number)}
                </div>

              </div>

              <button
                class="call-button"

                전화

      }
    );

  } else {

    contactsHtml =
      `
        <div class="empty-state">
          등록된 비상연락처가 없습니다.
        </div>
      `;

  const glucoseText =

    &&
    status.latestGlucose.glucose_value !== null
    ?
    `${status.latestGlucose.glucose_value} mg/dL`
    :
    "기록 없음";


  document.getElementById(
    "safetyCardContent"
  ).innerHTML =
    `
      <div class="safety-profile">

        <div class="safety-avatar">
          ${escapeHtml(student.avatar || "🐻")}
        </div>

        <div>

          <div class="safety-name">
            ${escapeHtml(student.nickname || "학생")}
          </div>

          <div class="safety-class">
            ${escapeHtml(student.class_name || "")}
            · 오늘 기록 ${status.todayCount}건
          </div>

        </div>

      </div>


      ${
        status.needsAttention
        ?
        `
          <div class="alert-list">
            ${createAlertsHtml(status.alerts)}
          </div>

          <button
            class="ack-button"
            onclick="acknowledgeCurrentAlerts()">

        `
        :
        `
          <div class="safety-ok">
            ✅ 현재 미확인 이상 기록이 없습니다.

      <div class="safety-grid">

        <div class="safety-info-box">

          <div class="safety-label">
            🩸 최근 혈당
          </div>

          <div class="safety-value">
            ${escapeHtml(glucoseText)}
          </div>

        </div>


        <div class="safety-info-box">

          <div class="safety-label">
            📝 오늘 기록
          </div>

          <div class="safety-value">
            ${status.todayCount}건
          </div>

        </div>


        <div class="safety-info-box full">

          <div class="safety-label">
            🙂 최근 몸 상태
          </div>

          <div class="safety-value">

            ${escapeHtml(
              getSymptomText(
                status.latestSymptom,
                status.symptomData
              )
            )}

        </div>

      </div>


      <div class="safety-section-title">
        📞 비상연락처

/* =========================
   확인 완료
========================= */

async function acknowledgeCurrentAlerts() {

  if (
    !selectedSafetyStudent
    ||
    !selectedSafetyStatus
  ) {
    return;
  }


  const rows =
    selectedSafetyStatus.alerts.map(
      alert => ({

        teacher_id:
          currentUser.id,

        student_id:
          selectedSafetyStudent.id,

        record_id:
          alert.record.id

      })
    );


  const {
    error
  } =
    await supabaseClient
      .from(
        "alert_acknowledgements"
      )
      .upsert(
        rows,
        {
          onConflict:
            "teacher_id,record_id"
        }
      );


  if (error) {

    alert(
      "확인 완료 처리에 실패했습니다."
    );

    return;

  }


  closeSafetyCard();


  await loadDashboard();


  alert(
    "확인 완료 처리했습니다."
  );

}



/* =========================
   반복 알림
========================= */

function startRepeatAlertTimer() {

  setTimeout(
    showRepeatAlertIfNeeded,
    3000
  );


  repeatAlertTimer =
    setInterval(
      showRepeatAlertIfNeeded,
      60000
    );

}


function showRepeatAlertIfNeeded() {

  if (
    attentionStudents.length === 0
  ) {

    hideRepeatAlert();

    return;

  }


  const item =
    attentionStudents[0];


  repeatAlertStudent =
    item;


  const alertItem =
    item.status.alerts[0];


  const box =
    document.getElementById(
      "repeatAlert"
    );


  box.className =
    "repeat-alert show "
    +
    alertItem.type;


  document.getElementById(
    "repeatAlertTitle"
  ).textContent =
    `${alertItem.label} · ${item.student.nickname}`;


  document.getElementById(
    "repeatAlertText"
  ).textContent =
    alertItem.reason;

}


function hideRepeatAlert() {

  document.getElementById(
    "repeatAlert"
  ).className =
    "repeat-alert";

}


function openRepeatAlertStudent() {

  if (!repeatAlertStudent) {
    return;
  }


  hideRepeatAlert();


  openSafetyCard(
    repeatAlertStudent.student,
    repeatAlertStudent.status
  );

}

async function loadEmergencyContacts() {

  const {
    data

    await supabaseClient
      .from("emergency_contacts")
      .select(
        "id,contact_name,relationship,phone_number"
      )
      .eq(
        "user_id",

      );

    document.getElementById(
      "contactModalList"
    );


  container.innerHTML =
    "";


  (data || []).forEach(
    contact => {

      const div =
        document.createElement(
          "div"

      div.className =
        "modal-contact-card";


      div.innerHTML =

          <div class="modal-contact-info">

              ${escapeHtml(contact.relationship)}

async function saveEmergencyContact() {

  const relationship =
    document.getElementById(
      "contactRelationship"
    ).value;


  const contactName =
    document.getElementById(
      "contactName"
    ).value.trim();


  const phone =
    document.getElementById(
      "contactPhone"
    ).value.trim();


  if (
    !contactName
    ||
    !phone
  ) {

    alert(
      "이름과 전화번호를 입력해주세요."
    );

    return;

  }


  await supabaseClient
    .from(
      "emergency_contacts"
    )
    .insert({

      user_id:
        selectedContactStudentId,

      relationship,

      contact_name:
        contactName,

      phone_number:
        phone

    });


  document.getElementById(
    "contactName"
  ).value =

  document.getElementById(
    "contactPhone"
  ).value =

  loadEmergencyContacts();

async function resetStudentPassword() {

  const password =
    document.getElementById(
      "newPassword"
    ).value;


  if (
    password.length < 6
  ) {

    alert(
      "6자 이상 입력해주세요."
    );

    return;

  }


  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  const response =
    await fetch(
      SUPABASE_URL
      +
      "/functions/v1/reset-student-password",
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer "
            +
            data.session.access_token

        },

        body:
          JSON.stringify({

            studentId:
              selectedPasswordStudentId,

            newPassword:
              password

          })

      }
    );


  if (
    response.ok
  ) {

    alert(
      "비밀번호를 변경했습니다."
    );


    closePasswordModal();

  } else {

    alert(
      "변경에 실패했습니다."
    );

  }

}

function callContact(
  phone
) {

    confirm(
      "이 연락처로 전화할까요?"
    )
  ) {

    window.location.href =
      "tel:"
      +
      phone.replace(
        /[^0-9+]/g,
        ""
      );

  }

}



/* =========================
   기록 표시
========================= */

function getMealText(
  record
) {

  if (!record) {
    return "기록 없음";
  }


  const ratio =
    Number(
      record.intake_ratio
    );


  let text =
    "";


  if (
    ratio === 1
  ) {

    text =
      "다 먹었어요";

  }


  if (
    ratio === .5
  ) {

    text =
      "반 정도 먹었어요";

  }


  if (
    ratio === .25
  ) {

    text =
      "조금 먹었어요";

  }


  if (
    ratio === 0
  ) {

    text =
      "안 먹었어요";

  }


  return (
    (record.meal_type || "식사")
    +
    (
      text
      ?
      " · " + text
      :
      ""
    )
  );

}


function getSymptomText(
  record,
  data
) {

  if (!record) {
    return "기록 없음";
  }


  const values =
    [];


  if (
    data.context
  ) {

    values.push(
      data.context
    );

  }


  if (
    Array.isArray(
      data.symptoms
    )
  ) {

    values.push(
      data.symptoms.join(", ")
    );

  }


  if (
    record.glucose_value !== null
  ) {

    values.push(
      `혈당 ${record.glucose_value} mg/dL`
    );

  }


  return (
    values.join(" · ")
    ||
    "몸 상태 기록"
  );

}



/* =========================
   공통
========================= */

function parseNote(
  note
) {

  try {

    return JSON.parse(
      note || "{}"
    );

  } catch {

    return {};

  }

}


function isToday(
  value
) {

  const date =
    new Date(value);


  const now =
    new Date();


  return (
    date.toDateString()
    ===
    now.toDateString()
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");

}


async function logout() {

  await supabaseClient.auth
    .signOut();


  window.location.href =
    "./login.html";

}
