<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>교직원 관리 - GlucoGuard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f8fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #263238;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 18px 40px;
    }

    /* =========================
       상단
    ========================= */

    .top-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 6px 20px rgba(57, 79, 94, .07);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      background: #eef4ff;
      font-size: 27px;
    }

    .brand h1 {
      margin: 0;
      color: #314f68;
      font-size: 22px;
      font-weight: 900;
    }

    .brand p {
      margin: 4px 0 0;
      color: #8194a1;
      font-size: 11px;
    }

    .logout-button {
      border: none;
      border-radius: 11px;
      padding: 10px 12px;
      background: #f4f6f8;
      color: #657b88;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .teacher-info {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid #edf1f3;
      font-size: 12px;
      color: #718793;
    }

    .teacher-info strong {
      color: #3e6179;
    }

    /* =========================
       요약
    ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 19px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(57,79,94,.05);
    }

    .summary-label {
      font-size: 11px;
      color: #8295a0;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 900;
      color: #365e78;
    }

    .summary-card.alert .summary-value {
      color: #d24f47;
    }

    .section-title {
      margin: 0 0 10px 2px;
      font-size: 15px;
      font-weight: 900;
      color: #455a64;
    }

    /* =========================
       학생 카드
    ========================= */

    .student-card {
      background: white;
      border-radius: 23px;
      padding: 17px;
      margin-bottom: 13px;
      box-shadow: 0 5px 17px rgba(57,79,94,.06);
      border: 2px solid transparent;
    }

    .student-card.needs-attention {
      border-color: #ffb7b1;
      background: #fffdfd;
    }

    .student-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }

    .student-avatar {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #fff1c8;
      font-size: 31px;
    }

    .student-main {
      flex: 1;
      min-width: 0;
    }

    .student-name {
      font-size: 18px;
      font-weight: 900;
      color: #344e5e;
      margin-bottom: 3px;
    }

    .student-class {
      color: #81939f;
      font-size: 11px;
    }

    .attention-badge {
      flex-shrink: 0;
      padding: 6px 9px;
      border-radius: 10px;
      background: #ffe9e7;
      color: #c84d46;
      font-size: 10px;
      font-weight: 900;
    }

    .ok-badge {
      flex-shrink: 0;
      padding: 6px 9px;
      border-radius: 10px;
      background: #edf7ef;
      color: #4c8560;
      font-size: 10px;
      font-weight: 900;
    }

    .alert-reason {
      margin-bottom: 12px;
      padding: 10px 11px;
      border-radius: 13px;
      background: #fff0ee;
      color: #b44e47;
      font-size: 11px;
      line-height: 1.55;
    }

    .record-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 13px;
    }

    .record-box {
      padding: 11px;
      border-radius: 14px;
      background: #f6f8fa;
      min-height: 68px;
    }

    .record-label {
      font-size: 10px;
      color: #8798a2;
      margin-bottom: 5px;
    }

    .record-value {
      font-size: 12px;
      font-weight: 800;
      color: #496675;
      line-height: 1.45;
      word-break: keep-all;
    }

    .student-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-button {
      border: none;
      border-radius: 13px;
      padding: 12px 8px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .records-action {
      background: #eaf3ff;
      color: #2d6893;
    }

    .symptom-action {
      background: #ffefed;
      color: #bd514a;
    }

    .contact-action {
      background: #eef0ff;
      color: #5669a4;
    }

    .password-action {
      background: #f3f5f6;
      color: #687d88;
    }

    .empty-state {
      background: white;
      border-radius: 20px;
      padding: 28px 18px;
      text-align: center;
      color: #8396a1;
      font-size: 12px;
      line-height: 1.7;
    }

    /* =========================
       모달 공통
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(30,45,55,.42);
    }

    .modal {
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      padding: 19px;
      box-shadow: 0 18px 45px rgba(0,0,0,.18);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-title {
      margin: 0;
      color: #344e5e;
      font-size: 19px;
      font-weight: 900;
    }

    .modal-subtitle {
      margin: 4px 0 0;
      color: #82939d;
      font-size: 11px;
      line-height: 1.5;
    }

    .close-button {
      border: none;
      background: #f4f6f7;
      width: 35px;
      height: 35px;
      border-radius: 11px;
      color: #6b7e89;
      font-size: 18px;
      cursor: pointer;
    }

    .input-label {
      display: block;
      margin: 0 0 5px 2px;
      color: #607d8b;
      font-size: 11px;
      font-weight: 800;
    }

    .modal-input,
    .modal-select {
      width: 100%;
      padding: 12px;
      margin-bottom: 11px;
      border: 1px solid #d8e2e8;
      border-radius: 13px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    .modal-input:focus,
    .modal-select:focus {
      border-color: #76a9cc;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      background: #4285b4;
      color: white;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    /* =========================
       비상연락처 모달
    ========================= */

    .contact-form-box {
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 17px;
      background: #f6f9fb;
    }

    .contact-form-title {
      margin-bottom: 11px;
      color: #526b7a;
      font-size: 13px;
      font-weight: 900;
    }

    .contact-list-title {
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 900;
      color: #526b79;
    }

    .modal-contact-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: #f7f9fa;
    }

    .modal-contact-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: white;
      font-size: 19px;
    }

    .modal-contact-info {
      flex: 1;
      min-width: 0;
    }

    .modal-contact-name {
      color: #496574;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .modal-contact-phone {
      color: #8798a2;
      font-size: 10px;
    }

    .contact-delete-button {
      flex-shrink: 0;
      border: none;
      border-radius: 9px;
      padding: 8px 9px;
      background: #fff0ee;
      color: #b6534d;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-empty {
      padding: 18px 12px;
      border-radius: 14px;
      background: #f7f9fa;
      color: #889aa4;
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 520px) {
      .student-actions {
        grid-template-columns: 1fr;
      }

      .record-grid {
        grid-template-columns: 1fr 1fr;
      }

      .brand h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="top-card">

    <div class="top-row">

      <div class="brand">

        <div class="brand-icon">
          👩‍🏫
        </div>

        <div>
          <h1>GlucoGuard 관리</h1>

      </div>

</div>

     비밀번호 재설정 모달
========================= -->

  id="passwordModalOverlay"

  <div class="modal">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://zvksfkslavrqagytswco.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SBPOr5LiersAEmwZkcSl_g_VAljE-HS";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser = null;
let currentTeacherProfile = null;

let linkedStudents = [];
let allRecords = [];

let selectedContactStudentId = null;
let selectedContactStudentName = "";

let selectedPasswordStudentId = null;
let selectedPasswordStudentName = "";



/* =========================
   시작
========================= */

window.addEventListener(
  "load",
  async function() {

    const ready =
      await checkTeacherLogin();


    if (!ready) {
      return;
    }


    await loadDashboard();

  }
);



/* =========================
   교직원 로그인 확인
========================= */

async function checkTeacherLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "login.html";


    return false;

  }


  currentUser =
    data.session.user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, nickname, class_name, avatar, role"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (
    profileError ||
    !profile
  ) {

    console.error(
      profileError
    );


    alert(
      "교직원 정보를 확인할 수 없습니다."
    );


    location.href =
      "login.html";


    return false;

  }


  if (
    profile.role !== "teacher"
    &&
    profile.role !== "nurse"
  ) {

    location.href =
      "index.html";


    return false;

  }


  currentTeacherProfile =
    profile;


  document.getElementById(
    "teacherInfo"
  ).innerHTML =
    `
      <strong>
        ${escapeHtml(profile.nickname || "교직원")}
      </strong>
      ·
      ${escapeHtml(profile.class_name || "학급 정보 없음")}
      ·
      ${profile.role === "nurse" ? "보건교사" : "교직원"}
    `;


  return true;

}



/* =========================
   대시보드
========================= */

async function loadDashboard() {

  const {
    data: links,
    error: linkError
  } =
    await supabaseClient
      .from("teacher_students")
      .select("student_id")
      .eq(
        "teacher_id",
        currentUser.id
      );


  if (linkError) {

    console.error(
      linkError
    );


    showDashboardError();


    return;

  }


  const studentIds =
    (links || [])
      .map(
        item =>
          item.student_id
      );


  if (
    studentIds.length === 0
  ) {

    linkedStudents = [];
    allRecords = [];

    renderDashboard();

    return;

  }


  const {
    data: profiles,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, nickname, class_name, avatar, role"
      )
      .in(
        "id",
        studentIds
      );


  if (profileError) {

    console.error(
      profileError
    );


    showDashboardError();


    return;

  }


  linkedStudents =
    (profiles || [])
      .filter(
        profile =>
          profile.role === "student"
      );


  const {
    data: records,
    error: recordError
  } =
    await supabaseClient
      .from("records")
      .select(
        "id, user_id, record_type, glucose_value, meal_type, intake_ratio, note, created_at"
      )
      .in(
        "user_id",
        studentIds
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (recordError) {

    console.error(
      recordError
    );


    allRecords = [];

  } else {

    allRecords =
      records || [];

  }


  renderDashboard();

}



function showDashboardError() {

  document.getElementById(
    "studentList"
  ).innerHTML =
    `
      <div class="empty-state">
        학생 정보를 불러오지 못했습니다.<br>
        잠시 후 다시 시도해주세요.
      </div>
    `;

}



/* =========================
   학생 카드 렌더링
========================= */

function renderDashboard() {

  const studentsWithStatus =
    linkedStudents.map(
      student => {

        const studentRecords =
          allRecords.filter(
            record =>
              record.user_id ===
              student.id
          );


        const status =
          buildStudentStatus(
            studentRecords
          );


        return {
          student,
          studentRecords,
          status
        };

      }
    );


  studentsWithStatus.sort(
    (a, b) => {

      if (
        a.status.needsAttention
        &&
        !b.status.needsAttention
      ) {
        return -1;
      }


      if (
        !a.status.needsAttention
        &&
        b.status.needsAttention
      ) {
        return 1;
      }


      return (
        a.student.nickname || ""
      ).localeCompare(
        b.student.nickname || ""
      );

    }
  );


  document.getElementById(
    "studentCount"
  ).textContent =
    linkedStudents.length;


  document.getElementById(
    "attentionCount"
  ).textContent =
    studentsWithStatus.filter(
      item =>
        item.status.needsAttention
    ).length;


  const container =
    document.getElementById(
      "studentList"
    );


  container.innerHTML =
    "";


  if (
    studentsWithStatus.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty-state">
          아직 연결된 학생이 없습니다.
        </div>
      `;


    return;

  }


  studentsWithStatus.forEach(
    item => {

      container.appendChild(
        createStudentCard(
          item.student,
          item.status
        )
      );

    }
  );

}



/* =========================
   학생 상태 계산
========================= */

function buildStudentStatus(
  records
) {

  const latestGlucose =
    records.find(
      r =>
        r.record_type ===
        "glucose"
    );


  const latestMeal =
    records.find(
      r =>
        r.record_type ===
        "meal"
    );


  const latestSymptom =
    records.find(
      r =>
        r.record_type ===
        "symptom"
    );


  const latestActivity =
    records.find(
      r =>
        r.record_type ===
        "activity"
    );


  const reasons = [];


  if (
    latestGlucose &&
    latestGlucose.glucose_value !== null
  ) {

    if (
      latestGlucose.glucose_value < 70
    ) {

      reasons.push(
        `최근 혈당 ${latestGlucose.glucose_value} mg/dL`
      );

    }


    if (
      latestGlucose.glucose_value >= 250
    ) {

      reasons.push(
        `최근 혈당 ${latestGlucose.glucose_value} mg/dL`
      );

    }

  }


  const symptomData =
    parseNote(
      latestSymptom
        ?
        latestSymptom.note
        :
        null
    );


  if (latestSymptom) {

    if (
      symptomData.condition ===
      "danger"
    ) {

      reasons.push(
        "의식·삼킴 상태 확인 필요"
      );

    }


    if (
      Array.isArray(
        symptomData.symptoms
      )
      &&
      symptomData.symptoms.includes(
        "구토"
      )
    ) {

      reasons.push(
        "구토 증상 기록"
      );

    }


    if (
      latestSymptom.glucose_value !== null
      &&
      (
        latestSymptom.glucose_value < 70
        ||
        latestSymptom.glucose_value >= 250
      )
    ) {

      reasons.push(
        `상태 기록 당시 혈당 ${latestSymptom.glucose_value} mg/dL`
      );

    }

  }


  const activityData =
    parseNote(
      latestActivity
        ?
        latestActivity.note
        :
        null
    );


  if (latestActivity) {

    if (
      activityData.feeling ===
      "몸이 이상해요"
    ) {

      reasons.push(
        "활동 중 몸이 이상하다고 기록"
      );

    }


    if (
      latestActivity.glucose_value !== null
      &&
      (
        latestActivity.glucose_value < 70
        ||
        latestActivity.glucose_value >= 250
      )
    ) {

      reasons.push(
        `활동 기록 당시 혈당 ${latestActivity.glucose_value} mg/dL`
      );

    }

  }


  const todayCount =
    records.filter(
      record =>
        isToday(
          record.created_at
        )
    ).length;


  return {

    needsAttention:
      reasons.length > 0,

    reasons:
      reasons,

    latestGlucose:
      latestGlucose,

    latestMeal:
      latestMeal,

    latestSymptom:
      latestSymptom,

    latestActivity:
      latestActivity,

    symptomData:
      symptomData,

    activityData:
      activityData,

    todayCount:
      todayCount

  };

}

        ""
    );

    getSymptomText(
      status.latestSymptom,
      status.symptomData
    );

    getActivityText(
      status.latestActivity,
      status.activityData
    );


  const mealText =
    getMealText(
      status.latestMeal
    );


  const glucoseText =
    status.latestGlucose
      &&
      status.latestGlucose.glucose_value !== null

      ?

      status.latestGlucose.glucose_value
      +
      " mg/dL"

      :

  card.innerHTML =

      <div class="student-head">

        <div class="student-main">

        </div>

        ${

        }

      </div>


      ${

        ?

        `

              .map(escapeHtml)
              .join(" · ")}

        `

        <div class="record-box">

          <div class="record-label">

          </div>

          <div class="record-value">
            ${escapeHtml(glucoseText)}
          </div>

        </div>


        <div class="record-box">

          <div class="record-label">
            🍱 최근 식사
          </div>

          <div class="record-value">
            ${escapeHtml(mealText)}
          </div>

        </div>


        <div class="record-box">

          <div class="record-label">
            🙂 최근 상태
          </div>

          <div class="record-value">
            ${escapeHtml(symptomText)}
          </div>

        </div>


        <div class="record-box">

            🏃 최근 활동

    };

/* =========================
   표시용 텍스트
========================= */

function getMealText(
  record
) {

  if (!record) {
    return "기록 없음";
  }


  const meal =
    record.meal_type ||
    "식사";


  let amount = "";


  if (
    record.intake_ratio !== null
    &&
    record.intake_ratio !== undefined
  ) {

    const ratio =
      Number(
        record.intake_ratio
      );


    if (ratio === 1) {
      amount = "다 먹었어요";
    } else if (ratio === 0.5) {
      amount = "반 정도 먹었어요";
    } else if (ratio === 0.25) {
      amount = "조금 먹었어요";
    } else if (ratio === 0) {
      amount = "먹지 않았어요";
    }

  }


  return (
    meal
    +
    (
      amount
        ?
        " · " + amount
        :
        ""
    )
  );

}



function getSymptomText(
  record,
  data
) {

  if (!record) {
    return "기록 없음";
  }


  let text =
    Array.isArray(
      data.symptoms
    )
    &&
    data.symptoms.length > 0

      ?

      data.symptoms.join(", ")

      :

      "상태 기록";


  if (
    record.glucose_value !== null
  ) {

    text +=
      " · 혈당 "
      +
      record.glucose_value
      +
      " mg/dL";

  }


  return text;

}



function getActivityText(
  record,
  data
) {

  if (!record) {
    return "기록 없음";
  }


  let text =
    data.activityType
    ||
    record.meal_type
    ||
    "활동 기록";


  if (data.feeling) {

    text +=
      " · "
      +
      data.feeling;

  }


  if (
    record.glucose_value !== null
  ) {

    text +=
      " · 혈당 "
      +
      record.glucose_value
      +
      " mg/dL";

  }


  return text;

}

/* =========================
   비상연락처 관리
========================= */

async function openContactModal(
  student
) {

  selectedContactStudentId =
    student.id;


  selectedContactStudentName =
    student.nickname ||
    "학생";


  document.getElementById(
    "contactModalStudent"
  ).textContent =
    selectedContactStudentName
    +
    " 학생의 비상연락처";


  document.getElementById(
    "contactName"
  ).value =
    "";


  document.getElementById(
    "contactPhone"
  ).value =
    "";


  document.getElementById(
    "contactRelationship"
  ).value =
    "엄마";


  document.getElementById(
    "contactModalOverlay"
  ).style.display =
    "flex";


  await loadEmergencyContacts();

}



function closeContactModal() {

  document.getElementById(
    "contactModalOverlay"
  ).style.display =
    "none";


  selectedContactStudentId =
    null;


  selectedContactStudentName =
    "";

}



async function loadEmergencyContacts() {

  if (!selectedContactStudentId) {
    return;
  }


  document.getElementById(
    "contactModalList"
  ).innerHTML =
    `
      <div class="modal-empty">
        연락처를 불러오는 중입니다.
      </div>
    `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .select(
        "id, contact_name, relationship, phone_number, created_at"
      )
      .eq(
        "user_id",
        selectedContactStudentId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );


    document.getElementById(
      "contactModalList"
    ).innerHTML =
      `
        <div class="modal-empty">
          연락처를 불러오지 못했습니다.
        </div>
      `;


    return;

  }


  renderEmergencyContacts(
    data || []
  );

}



function renderEmergencyContacts(
  contacts
) {

  const container =
    document.getElementById(
      "contactModalList"
    );


  container.innerHTML =
    "";


  if (
    contacts.length === 0
  ) {

    container.innerHTML =
      `
        <div class="modal-empty">
          아직 등록된 비상연락처가 없습니다.
        </div>
      `;


    return;

  }


  contacts.forEach(
    contact => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "modal-contact-card";


      let icon =
        "📞";


      if (
        contact.relationship === "엄마"
        ||
        contact.relationship === "아빠"
        ||
        contact.relationship === "보호자"
      ) {

        icon =
          "👨‍👩‍👧";

      }


      if (
        contact.relationship === "보건실"
      ) {

        icon =
          "🏥";

      }


      if (
        contact.relationship ===
        "담임 선생님"
      ) {

        icon =
          "👩‍🏫";

      }


      const iconBox =
        document.createElement(
          "div"
        );


      iconBox.className =
        "modal-contact-icon";


      iconBox.textContent =
        icon;


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "modal-contact-info";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "modal-contact-name";


      name.textContent =
        contact.relationship
        +
        " · "
        +
        contact.contact_name;


      const phone =
        document.createElement(
          "div"
        );


      phone.className =
        "modal-contact-phone";


      phone.textContent =
        contact.phone_number;


      info.appendChild(
        name
      );


      info.appendChild(
        phone
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "contact-delete-button";


      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          deleteEmergencyContact(
            contact.id,
            contact.contact_name
          );

        };


      card.appendChild(
        iconBox
      );


      card.appendChild(
        info
      );


      card.appendChild(
        deleteButton
      );


      container.appendChild(
        card
      );

    }
  );

}



async function saveEmergencyContact() {

  if (!selectedContactStudentId) {
    return;
  }


  const relationship =
    document.getElementById(
      "contactRelationship"
    ).value;


  const name =
    document.getElementById(
      "contactName"
    ).value.trim();


  const phone =
    document.getElementById(
      "contactPhone"
    ).value.trim();


  if (!name) {

    alert(
      "연락처 이름을 입력해주세요."
    );


    return;

  }


  if (!phone) {

    alert(
      "전화번호를 입력해주세요."
    );


    return;

  }


  const cleanedPhone =
    phone.replace(
      /[^0-9+]/g,
      ""
    );


  if (
    cleanedPhone.length < 8
  ) {

    alert(
      "전화번호를 다시 확인해주세요."
    );


    return;

  }


  const button =
    document.getElementById(
      "contactSaveButton"
    );


  button.disabled =
    true;


  button.textContent =
    "등록 중...";


  const {
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .insert({

        user_id:
          selectedContactStudentId,

        contact_name:
          name,

        relationship:
          relationship,

        phone_number:
          phone

      });


  button.disabled =
    false;


  button.textContent =
    "연락처 등록";


  if (error) {

    console.error(
      error
    );


    alert(
      "비상연락처를 등록하지 못했습니다."
    );


    return;

  }


  document.getElementById(
    "contactName"
  ).value =
    "";


  document.getElementById(
    "contactPhone"
  ).value =
    "";


  await loadEmergencyContacts();

}



async function deleteEmergencyContact(
  contactId,
  contactName
) {

  const confirmed =
    confirm(
      contactName
      +
      " 연락처를 삭제할까요?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from(
        "emergency_contacts"
      )
      .delete()
      .eq(
        "id",
        contactId
      )
      .eq(
        "user_id",
        selectedContactStudentId
      );


  if (error) {

    console.error(
      error
    );


    alert(
      "연락처를 삭제하지 못했습니다."
    );


    return;

  }


  await loadEmergencyContacts();

}

async function resetStudentPassword() {

  if (!selectedPasswordStudentId) {
    return;
  }


  const password =
    document.getElementById(
      "newPassword"
    ).value;


  if (
    password.length < 6
  ) {

    alert(
      "비밀번호는 6자 이상으로 입력해주세요."
    );


    return;

  }


  const {
    data: sessionData
  } =
    await supabaseClient.auth
      .getSession();


  const accessToken =
    sessionData.session
      ?
      sessionData.session.access_token
      :
      null;


  if (!accessToken) {

    alert(
      "로그인 세션을 확인할 수 없습니다."
    );


    return;

  }


  const button =
    document.getElementById(
      "resetPasswordButton"
    );


  button.disabled =
    true;


  button.textContent =
    "변경 중...";


  try {

    const response =
      await fetch(
        SUPABASE_URL
        +
        "/functions/v1/reset-student-password",
        {
          method:
            "POST",

          headers:
            {
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer "
                +
                accessToken
            },

          body:
            JSON.stringify(
              {
                studentId:
                  selectedPasswordStudentId,

                newPassword:
                  password
              }
            )
        }
      );


    let result =
      {};


    try {

      result =
        await response.json();

    } catch (e) {

      result =
        {};

    }


    if (!response.ok) {

      throw new Error(
        result.error
        ||
        result.message
        ||
        "비밀번호 재설정에 실패했습니다."
      );

    }


    alert(
      selectedPasswordStudentName
      +
      " 학생의 비밀번호를 변경했습니다."
    );


    closePasswordModal();


  } catch (error) {

    console.error(
      error
    );


    alert(
      error.message
      ||
      "비밀번호 재설정 중 오류가 발생했습니다."
    );

  } finally {

    button.disabled =
      false;


    button.textContent =
      "비밀번호 변경";

  }

}



/* =========================
   도우미 함수
========================= */

function parseNote(
  note
) {

  if (!note) {
    return {};
  }


  if (
    typeof note ===
    "object"
  ) {

    return note;

  }


  try {

    return JSON.parse(
      note
    );

  } catch (error) {

    return {};

  }

}



function isToday(
  dateString
) {

  const date =
    new Date(
      dateString
    );


  const today =
    new Date();


  return (
    date.getFullYear() ===
      today.getFullYear()

    &&

    date.getMonth() ===
      today.getMonth()

    &&

    date.getDate() ===
      today.getDate()
  );

}



function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
